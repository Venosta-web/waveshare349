# Variant B, "Studio": Broadcast / Equalizer Console with 12-band spectrum, mono timecodes, and segmented volume meter.
# Content box is 540 x 140 (560 x 160 card, 2 px border, 8 px padding).
id: music_card
width: 560
height: 160
align: RIGHT_MID
x: -6
y: 0
styles: card_style
bg_color: 0x0D1117
hidden: true
scrollbar_mode: "off"
widgets:
  # ── Top Header: Track + Artist (left), Player Pill + Album (right) ────────
  - label:
      id: ma_title_lbl
      text: "Nothing Playing"
      text_font: font_20
      text_color: 0xF0F6FC
      align: TOP_LEFT
      x: 0
      y: 0
      width: 378
      height: 24
      long_mode: SCROLL_CIRCULAR

  - label:
      id: ma_artist_lbl
      text: "Music Assistant"
      text_font: font_14
      text_color: 0x58A6FF
      align: TOP_LEFT
      x: 0
      y: 26
      width: 378
      height: 18
      long_mode: DOT

  - obj:
      id: ma_player_pill
      width: 154
      height: 22
      align: TOP_RIGHT
      x: 0
      y: 1
      bg_color: 0x161B22
      bg_opa: COVER
      border_color: 0x30363D
      border_width: 1
      radius: 6
      pad_all: 0
      scrollbar_mode: "off"
      widgets:
        - obj:
            id: ma_state_dot
            width: 8
            height: 8
            align: LEFT_MID
            x: 7
            bg_color: 0x6E7681
            bg_opa: COVER
            border_width: 0
            radius: 4
        - label:
            id: ma_player_lbl
            text: "Music Assistant"
            text_font: font_12
            text_color: 0xC9D1D9
            align: LEFT_MID
            x: 20
            width: 128
            long_mode: DOT

  - label:
      id: ma_album_lbl
      text: ""
      text_font: font_12
      text_color: 0x6E7681
      align: TOP_RIGHT
      x: 0
      y: 27
      width: 154
      text_align: RIGHT
      long_mode: DOT

  # ── Middle Telemetry Strip: 12-Band Spectrum + Mono Timecode Progress ────
  - obj:
      id: ma_eq_box
      width: 168
      height: 30
      align: TOP_LEFT
      x: 0
      y: 52
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      scrollbar_mode: "off"
      widgets:
        - obj: { id: ma_eq_0,  width: 10, height: 4, align: BOTTOM_LEFT, x: 0,   bg_color: 0x3FB950, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_eq_1,  width: 10, height: 4, align: BOTTOM_LEFT, x: 14,  bg_color: 0x3FB950, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_eq_2,  width: 10, height: 4, align: BOTTOM_LEFT, x: 28,  bg_color: 0x2EA043, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_eq_3,  width: 10, height: 4, align: BOTTOM_LEFT, x: 42,  bg_color: 0x39C5CF, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_eq_4,  width: 10, height: 4, align: BOTTOM_LEFT, x: 56,  bg_color: 0x39C5CF, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_eq_5,  width: 10, height: 4, align: BOTTOM_LEFT, x: 70,  bg_color: 0x58A6FF, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_eq_6,  width: 10, height: 4, align: BOTTOM_LEFT, x: 84,  bg_color: 0x58A6FF, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_eq_7,  width: 10, height: 4, align: BOTTOM_LEFT, x: 98,  bg_color: 0x79C0FF, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_eq_8,  width: 10, height: 4, align: BOTTOM_LEFT, x: 112, bg_color: 0xA371F7, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_eq_9,  width: 10, height: 4, align: BOTTOM_LEFT, x: 126, bg_color: 0xA371F7, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_eq_10, width: 10, height: 4, align: BOTTOM_LEFT, x: 140, bg_color: 0xBC8CFF, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_eq_11, width: 10, height: 4, align: BOTTOM_LEFT, x: 154, bg_color: 0xD2A8FF, bg_opa: COVER, border_width: 0, radius: 2 }

  - label:
      id: ma_pos_lbl
      text: "0:00"
      text_font: studio_mono_12
      text_color: 0xC9D1D9
      align: TOP_LEFT
      x: 182
      y: 53

  - label:
      id: ma_state_lbl
      text: "IDLE"
      text_font: studio_mono_12
      text_color: 0x6E7681
      align: TOP_LEFT
      x: 280
      y: 53
      width: 160
      text_align: CENTER

  - label:
      id: ma_dur_lbl
      text: "0:00"
      text_font: studio_mono_12
      text_color: 0x6E7681
      align: TOP_LEFT
      x: 492
      y: 53
      width: 48
      text_align: RIGHT

  - bar:
      id: ma_prog_bar
      width: 358
      height: 8
      align: TOP_LEFT
      x: 182
      y: 72
      min_value: 0
      max_value: 1000
      value: 0
      bg_color: 0x161B22
      bg_opa: COVER
      radius: 4
      indicator:
        bg_color: 0x3FB950
        bg_opa: COVER
        radius: 4

  # ── Bottom Control Dock (y: 92..138) ───────────────────────────────────────
  - button:
      id: btn_ma_prev
      width: 48
      height: 46
      align: TOP_LEFT
      x: 0
      y: 92
      bg_color: 0x161B22
      border_color: 0x30363D
      border_width: 1
      radius: 8
      widgets:
        - label:
            text: "\U000F04AE"
            text_font: ma_icons_24
            text_color: 0xF0F6FC
            align: CENTER
      on_click:
        then:
          - script.execute: ma_action_prev

  - button:
      id: btn_ma_play
      width: 72
      height: 46
      align: TOP_LEFT
      x: 54
      y: 92
      bg_color: 0x238636
      border_color: 0x2EA043
      border_width: 1
      radius: 8
      widgets:
        - label:
            id: lbl_ma_play
            text: "\U000F040A"
            text_font: ma_icons_24
            text_color: 0xFFFFFF
            align: CENTER
      on_click:
        then:
          - script.execute: ma_action_play_pause

  - button:
      id: btn_ma_next
      width: 48
      height: 46
      align: TOP_LEFT
      x: 132
      y: 92
      bg_color: 0x161B22
      border_color: 0x30363D
      border_width: 1
      radius: 8
      widgets:
        - label:
            text: "\U000F04AD"
            text_font: ma_icons_24
            text_color: 0xF0F6FC
            align: CENTER
      on_click:
        then:
          - script.execute: ma_action_next

  - button:
      id: btn_ma_shuffle
      width: 40
      height: 46
      align: TOP_LEFT
      x: 188
      y: 92
      bg_color: 0x161B22
      border_color: 0x30363D
      border_width: 1
      radius: 8
      widgets:
        - label:
            id: lbl_ma_shuffle
            text: "\U000F049D"
            text_font: ma_icons_20
            text_color: 0x6E7681
            align: CENTER
      on_click:
        then:
          - script.execute: ma_action_shuffle

  - button:
      id: btn_ma_repeat
      width: 40
      height: 46
      align: TOP_LEFT
      x: 234
      y: 92
      bg_color: 0x161B22
      border_color: 0x30363D
      border_width: 1
      radius: 8
      widgets:
        - label:
            id: lbl_ma_repeat
            text: "\U000F0456"
            text_font: ma_icons_20
            text_color: 0x6E7681
            align: CENTER
      on_click:
        then:
          - script.execute: ma_action_repeat

  # Volume & Segmented Meter Right (x: 288..540)
  - button:
      id: btn_ma_mute
      width: 40
      height: 46
      align: TOP_LEFT
      x: 288
      y: 92
      bg_color: 0x161B22
      border_color: 0x30363D
      border_width: 1
      radius: 8
      widgets:
        - label:
            id: lbl_ma_mute_icon
            text: "\U000F057E"
            text_font: ma_icons_20
            text_color: 0xC9D1D9
            align: CENTER
      on_click:
        then:
          - script.execute: ma_action_mute

  - button:
      id: btn_ma_vol_down
      width: 40
      height: 46
      align: TOP_LEFT
      x: 334
      y: 92
      bg_color: 0x161B22
      border_color: 0x30363D
      border_width: 1
      radius: 8
      widgets:
        - label:
            text: "\U000F075E"
            text_font: ma_icons_20
            text_color: 0xC9D1D9
            align: CENTER
      on_click:
        then:
          - script.execute: ma_action_vol_down

  - obj:
      id: ma_vol_meter_box
      width: 114
      height: 46
      align: TOP_LEFT
      x: 380
      y: 92
      bg_color: 0x161B22
      bg_opa: COVER
      border_color: 0x30363D
      border_width: 1
      radius: 8
      pad_all: 0
      scrollbar_mode: "off"
      widgets:
        - label:
            id: ma_vol_lbl
            text: "VOL 50%"
            text_font: studio_mono_12
            text_color: 0xC9D1D9
            align: TOP_MID
            y: 5
        - obj: { id: ma_vol_seg_0, width: 18, height: 10, align: TOP_LEFT, x: 5,  y: 27, bg_color: 0x3FB950, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_vol_seg_1, width: 18, height: 10, align: TOP_LEFT, x: 26, y: 27, bg_color: 0x3FB950, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_vol_seg_2, width: 18, height: 10, align: TOP_LEFT, x: 47, y: 27, bg_color: 0x3FB950, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_vol_seg_3, width: 18, height: 10, align: TOP_LEFT, x: 68, y: 27, bg_color: 0x21262D, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_vol_seg_4, width: 18, height: 10, align: TOP_LEFT, x: 89, y: 27, bg_color: 0x21262D, bg_opa: COVER, border_width: 0, radius: 2 }

  - button:
      id: btn_ma_vol_up
      width: 40
      height: 46
      align: TOP_LEFT
      x: 500
      y: 92
      bg_color: 0x161B22
      border_color: 0x30363D
      border_width: 1
      radius: 8
      widgets:
        - label:
            text: "\U000F075D"
            text_font: ma_icons_20
            text_color: 0xC9D1D9
            align: CENTER
      on_click:
        then:
          - script.execute: ma_action_vol_up
