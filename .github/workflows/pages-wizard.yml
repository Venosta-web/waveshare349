name: Deploy Setup Wizard & Preset Firmware

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'presets/*.yaml'
      - 'packages/**/*.yaml'
      - 'claude/**'
      - 'codex/**'
      - 'grow/**'
      - 'idle/**'
      - 'music/**'
      - 'prototype/**'
      - 'pet_scenes.h'
      - '.github/workflows/pages-wizard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-wizard
  cancel-in-progress: true

jobs:
  build_presets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - waveshare-349-full-suite
          - waveshare-349-grow-voice
          - waveshare-349-grow-music
          - waveshare-349-ai-desk
          - waveshare-349-grow-only
          - prototype-480x320-full
          - prototype-480x320-ai-desk
          - prototype-480x320-grow-music
          - prototype-480x320-grow-only
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO / ESPHome build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/esphome
            ~/.platformio
          key: esphome-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('presets/${{ matrix.preset }}.yaml', 'packages/**/*.yaml') }}
          restore-keys: |
            esphome-${{ runner.os }}-${{ matrix.preset }}-
            esphome-${{ runner.os }}-

      - name: Install ESPHome
        run: pip install esphome

      - name: Compile preset firmware
        run: |
          esphome compile "presets/${{ matrix.preset }}.yaml"
          mkdir -p dist/firmware
          BIN_PATH=$(find presets/.esphome/build -name "firmware.factory.bin" | head -n 1)
          test -n "$BIN_PATH"
          cp "$BIN_PATH" "dist/firmware/${{ matrix.preset }}.factory.bin"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.preset }}
          path: dist/firmware/${{ matrix.preset }}.factory.bin
          retention-days: 1

  build_site:
    needs: build_presets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all preset firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: _site/firmware
          merge-multiple: true

      - name: Assemble GitHub Pages bundle & ESP Web Tools manifests
        run: |
          cp -r site/* _site/
          VERSION="${GITHUB_SHA::7}"
          for bin in _site/firmware/*.factory.bin; do
            [ -f "$bin" ] || continue
            name=$(basename "$bin" .factory.bin)
            cat > "_site/firmware/${name}.manifest.json" <<EOF
          {
            "name": "${name}",
            "version": "${VERSION}",
            "new_install_prompt_erase": true,
            "new_install_improv_wait_time": 10,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "${name}.factory.bin", "offset": 0 }
                ]
              }
            ]
          }
          EOF
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Deploy runs in its own job so the github-pages artifact is fully
  # registered before deploy-pages looks it up (avoids a listing race).
  deploy_pages:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
