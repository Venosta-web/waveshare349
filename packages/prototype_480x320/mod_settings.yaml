                                        lambda: "return !id(wake_lock);"
                                      then:
                                        - lambda: |-
                                            if (id(settings_restart_armed) == 0) {
                                              id(settings_restart_armed) = 4;
                                              id(sync_settings_ui).execute();
                                            } else {
                                              ESP_LOGW("settings", "Restart confirmed by user");
                                              App.safe_reboot();
                                            }

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (id(settings_restart_armed) > 0) {
            id(settings_restart_armed)--;
            if (id(settings_restart_armed) == 0) {
              id(sync_settings_ui).execute();
            }
          }
          if (id(active_tab) == 4 && id(settings_active_cat) == 2) {
            id(sync_settings_ui).execute();
          }

script:
  - id: !extend switch_tab
    then:
      - lambda: |-
          bool active = (tab_idx == 4);
          if (active) {
            lv_obj_clear_flag(id(settings_card), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_bg_color(id(nav_settings), lv_color_hex(0x1F6FEB), 0);
            lv_obj_set_style_border_color(id(nav_settings), lv_color_hex(0x58A6FF), 0);
            lv_obj_set_style_text_color(id(nav_settings_icon), lv_color_hex(0xFFFFFF), 0);
            lv_obj_set_style_text_color(id(nav_settings_lbl), lv_color_hex(0xFFFFFF), 0);
            id(settings_restart_armed) = 0;
            id(sync_settings_ui).execute();
          } else {
            lv_obj_add_flag(id(settings_card), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_bg_color(id(nav_settings), lv_color_hex(0x161B22), 0);
            lv_obj_set_style_border_color(id(nav_settings), lv_color_hex(0x30363D), 0);
            lv_obj_set_style_text_color(id(nav_settings_icon), lv_color_hex(0x8B949E), 0);
            lv_obj_set_style_text_color(id(nav_settings_lbl), lv_color_hex(0x8B949E), 0);
          }

  - id: select_settings_cat
    parameters:
      cat_idx: int
    then:
      - lambda: |-
          id(settings_active_cat) = cat_idx;
          id(settings_restart_armed) = 0;
      - script.execute: sync_settings_ui

  - id: set_brightness_level
    parameters:
      level: int
    then:
      - lambda: |-
          id(settings_brightness) = level;
          auto call = id(display_backlight).make_call();
          call.set_brightness(level / 100.0f);
          call.perform();
      - script.execute: sync_settings_ui

  - id: set_idle_timeout_sec
    parameters:
      seconds: int
    then:
      - lambda: |-
          id(settings_idle_timeout) = seconds;
      - script.execute: reset_idle_timer
      - script.execute: sync_settings_ui

  - id: set_cycle_interval_sec
    parameters:
      seconds: int
    then:
      - lambda: |-
          id(settings_cycle_interval) = seconds;
      - script.execute: sync_settings_ui

  - id: !extend sync_settings_ui
    then:
      - lambda: |-
          auto style_pill = [](lv_obj_t* btn, lv_obj_t* lbl, bool active) {
            lv_obj_set_style_bg_color(btn, lv_color_hex(active ? 0x1F6FEB : 0x161B22), 0);
            lv_obj_set_style_border_color(btn, lv_color_hex(active ? 0x58A6FF : 0x30363D), 0);
            lv_obj_set_style_text_color(lbl, lv_color_hex(active ? 0xFFFFFF : 0x8B949E), 0);
          };

          auto style_cat = [](lv_obj_t* btn, lv_obj_t* icon, lv_obj_t* lbl, bool active) {
            lv_obj_set_style_bg_color(btn, lv_color_hex(active ? 0x1F6FEB : 0x0D1117), 0);
            lv_obj_set_style_border_color(btn, lv_color_hex(active ? 0x58A6FF : 0x21262D), 0);
            lv_obj_set_style_text_color(icon, lv_color_hex(active ? 0xFFFFFF : 0x8B949E), 0);
            lv_obj_set_style_text_color(lbl, lv_color_hex(active ? 0xFFFFFF : 0x8B949E), 0);
          };

          int cat = id(settings_active_cat);
          style_cat(id(set_cat_display), id(set_cat_display_icon), id(set_cat_display_lbl), cat == 0);
          style_cat(id(set_cat_grow), id(set_cat_grow_icon), id(set_cat_grow_lbl), cat == 1);
          style_cat(id(set_cat_system), id(set_cat_system_icon), id(set_cat_system_lbl), cat == 2);

          if (cat == 0) lv_obj_clear_flag(id(set_pane_display), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(set_pane_display), LV_OBJ_FLAG_HIDDEN);

          if (cat == 1) lv_obj_clear_flag(id(set_pane_grow), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(set_pane_grow), LV_OBJ_FLAG_HIDDEN);

          if (cat == 2) lv_obj_clear_flag(id(set_pane_system), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(set_pane_system), LV_OBJ_FLAG_HIDDEN);

          // Brightness pills
          int bri = id(settings_brightness);
          char buf[40];
          snprintf(buf, sizeof(buf), "%d%%", bri);
          lv_label_set_text(id(set_bri_val), buf);
          style_pill(id(set_bri_25), id(set_bri_25_lbl), bri == 25);
          style_pill(id(set_bri_50), id(set_bri_50_lbl), bri == 50);
          style_pill(id(set_bri_75), id(set_bri_75_lbl), bri == 75);
          style_pill(id(set_bri_100), id(set_bri_100_lbl), bri == 100);

          // Idle lock timeout pills
          int it = id(settings_idle_timeout);
          if (it <= 0) {
            lv_label_set_text(id(set_idle_val), "Off");
          } else if (it < 60) {
            snprintf(buf, sizeof(buf), "%ds", it);
            lv_label_set_text(id(set_idle_val), buf);
          } else {
            snprintf(buf, sizeof(buf), "%d min", it / 60);
            lv_label_set_text(id(set_idle_val), buf);
          }
          style_pill(id(set_idle_60), id(set_idle_60_lbl), it == 60);
          style_pill(id(set_idle_300), id(set_idle_300_lbl), it == 300);
          style_pill(id(set_idle_600), id(set_idle_600_lbl), it == 600);
          style_pill(id(set_idle_0), id(set_idle_0_lbl), it <= 0);

          // Auto-Cycle & Cycle Speed
          bool cyc_on = id(settings_cycle_enabled);
          lv_obj_set_style_bg_color(id(set_btn_autocycle), lv_color_hex(cyc_on ? 0x163322 : 0x2D2009), 0);
          lv_obj_set_style_border_color(id(set_btn_autocycle), lv_color_hex(cyc_on ? 0x3FB950 : 0xFFB020), 0);
          lv_label_set_text(id(set_autocycle_lbl), cyc_on ? "Active" : "Paused");
          lv_obj_set_style_text_color(id(set_autocycle_lbl), lv_color_hex(cyc_on ? 0x3FB950 : 0xFFB020), 0);

          int cs = id(settings_cycle_interval);
          snprintf(buf, sizeof(buf), "%ds", cs);
          lv_label_set_text(id(set_cycle_val), buf);
          style_pill(id(set_cyc_10), id(set_cyc_10_lbl), cs == 10);
          style_pill(id(set_cyc_15), id(set_cyc_15_lbl), cs == 15);
          style_pill(id(set_cyc_30), id(set_cyc_30_lbl), cs == 30);
          style_pill(id(set_cyc_60), id(set_cyc_60_lbl), cs == 60);

          // Wi-Fi & Battery Telemetry
          if (id(ha_connected).state) {
            int rssi = id(wifi_sig).has_state() ? (int) roundf(id(wifi_sig).state) : 0;
            if (rssi != 0) {
              snprintf(buf, sizeof(buf), "HA Connected • %d dBm", rssi);
            } else {
              snprintf(buf, sizeof(buf), "HA Connected");
            }
            lv_label_set_text(id(set_wifi_lbl), buf);
            lv_obj_set_style_text_color(id(set_wifi_icon), lv_color_hex(0x58A6FF), 0);
          } else {
            lv_label_set_text(id(set_wifi_lbl), "HA: Disconnected");
            lv_obj_set_style_text_color(id(set_wifi_icon), lv_color_hex(0x6E7681), 0);
          }

          if (id(phone_battery).has_state()) {
            snprintf(buf, sizeof(buf), "Battery: %.0f%%", id(phone_battery).state);
            lv_label_set_text(id(set_batt_lbl), buf);
          } else {
            lv_label_set_text(id(set_batt_lbl), "Battery: --");
          }

          // Safe 2-tap Restart button
          bool armed = (id(settings_restart_armed) > 0);
          lv_obj_set_style_bg_color(id(set_btn_restart), lv_color_hex(armed ? 0x3B1219 : 0x21262D), 0);
          lv_obj_set_style_border_color(id(set_btn_restart), lv_color_hex(armed ? 0xF85149 : 0x30363D), 0);
          lv_obj_set_style_text_color(id(set_restart_icon), lv_color_hex(armed ? 0xF85149 : 0xE6EDF3), 0);
          lv_obj_set_style_text_color(id(set_restart_lbl), lv_color_hex(armed ? 0xF85149 : 0xE6EDF3), 0);
          lv_label_set_text(id(set_restart_lbl), armed ? "Confirm?" : "Restart");
