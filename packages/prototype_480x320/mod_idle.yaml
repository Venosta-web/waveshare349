# Feature Module: 5-Minute Idle / Lock Clock Screen (480x320 Prototype)
# Requires substitutions: idle_variant ("aurora"), idle_timeout ("300")

packages:
  idle_common: !include ../../idle/common.yaml
  idle_variant: !include ../../idle/${idle_variant}.yaml

esphome:
  on_boot:
    - priority: -49
      then:
        - lambda: "lv_obj_set_parent(id(nav_lock), id(nav_rail));"

lvgl:
  pages:
    - id: !extend home_page
      on_click:
        then:
          - script.execute: reset_idle_timer
      widgets:
        - button:
            id: nav_lock
            width: 72
            height: 84
            styles: nav_btn
            widgets:
              - label:
                  id: nav_lock_icon
                  text: "\U000F033E"
                  text_font: icons_20
                  text_color: 0x8B949E
                  align: TOP_MID
                  y: 18
              - label:
                  id: nav_lock_lbl
                  text: "LOCK"
                  text_font: font_12
                  text_color: 0x8B949E
                  align: BOTTOM_MID
                  y: -14
            on_click:
              then:
                - if:
                    condition:
                      lambda: "return !id(wake_lock);"
                    then:
                      - script.execute: lock_idle_screen

        - obj: !include ../../prototype/esp32-s3-480-320-prototype/idle/${idle_variant}_card.yaml

script:
  - id: !extend switch_tab
    then:
      - script.execute: reset_idle_timer

interval:
  - interval: 5s
    then:
      - lambda: |-
          if (id(phone_battery).has_state()) {
            id(idle_battery_pct) = (int) id(phone_battery).state;
          }
          id(idle_wifi_connected) = id(ha_connected).state;
          if (id(wifi_sig).has_state()) {
            id(idle_wifi_rssi) = (int) id(wifi_sig).state;
          }
