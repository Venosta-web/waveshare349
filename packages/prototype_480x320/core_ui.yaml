# Core LVGL 480x320 shell, header bar, fonts, styles, Display View select, and adaptive nav rail.

globals:
  - id: active_tab
    type: int
    initial_value: "-1"
  - id: cycle_paused
    type: bool
    initial_value: "false"
  - id: pause_timer
    type: int
    initial_value: "0"
  - id: nav_direction
    type: int
    initial_value: "1"
  - id: last_touch_ms
    type: uint32_t
    initial_value: "0"
  - id: dim_state
    type: int
    initial_value: "0"
  - id: wake_lock
    type: bool
    initial_value: "false"

esphome:
  on_boot:
    - priority: -10
      then:
        - lambda: "id(last_touch_ms) = millis();"
    - priority: -90
      then:
        - lambda: |-
            if (lv_obj_get_child_cnt(id(nav_rail)) <= 1) {
              lv_obj_add_flag(id(nav_rail), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_clear_flag(id(nav_rail), LV_OBJ_FLAG_HIDDEN);
            }
            lv_obj_invalidate(lv_scr_act());

font:
