# Feature Module: Growspace Manager Display View (Waveshare 3.49)
# Requires substitutions: gs_count, gs_0..6_*, cycle_interval, pause_timeout, vpd_gauge_min, vpd_gauge_max

globals:
  - id: vpd_sensor_index
    type: int
    initial_value: "0"
  - id: cycle_timer
    type: int
    initial_value: "${cycle_interval}"
  - id: gs_total
    type: int
    initial_value: "${gs_count}"

esphome:
  includes:
    - ../../grow/grow_icon.h
  on_boot:
    - priority: -140
      then:
        - lambda: "lv_obj_set_parent(id(nav_grow), id(nav_rail));"
    - priority: -150
      then:
        - lambda: |-
            if (id(active_tab) < 0) {
              id(switch_tab).execute(0);
            }
    - priority: -100
      then:
        - delay: 3s
        - script.execute: update_grow_ui

api:
  on_client_connected:
    - delay: 1s
    - script.execute: update_grow_ui

lvgl:
  pages:
    - id: !extend home_page
      widgets:
        - button:
            id: nav_grow
            width: 64
            height: 50
            styles: nav_btn_active
            widgets:
              - obj:
                  id: nav_grow_box
                  width: 28
                  height: 22
                  align: CENTER
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  radius: 0
                  clickable: false
                  scrollbar_mode: "off"
            on_click:
              then:
                - script.execute:
                    id: switch_tab
                    tab_idx: 0

        - obj:
            id: grow_card
            width: 560
            height: 160
            align: RIGHT_MID
            x: -6
            y: 0
            styles: card_style
            scrollbar_mode: "off"
            widgets:
              - label:
                  id: gs_name_lbl
                  text: "4x4"
                  text_font: font_20
                  text_color: 0x00D1FF
                  align: TOP_LEFT
                  x: 4
