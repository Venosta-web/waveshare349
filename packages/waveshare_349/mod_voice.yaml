# Feature Module: Voice Satellite (ES8311 + I2S + micro_wake_word + voice_assistant + UI overlay)

substitutions:
  voice_tts_entity: "tts.piper"
  voice_tts_speaker: "media_player.music_assistant_player"
  voice_output_mode: "Onboard + HA Speakers"
  voice_answer_hold: "10s"

globals:
  - id: voice_has_answer
    type: bool
    initial_value: "false"

esphome:
  includes:
    - ../../voice/voice_icon.h
  on_boot:
    - priority: -148
      then:
        - lambda: |-
            // Pin AI Voice Activation at the bottom of the 64px sidebar and
            // reserve the upper 108px for the scrollable Display View rail.
            lv_obj_set_align(id(nav_rail), LV_ALIGN_TOP_LEFT);
            lv_obj_set_pos(id(nav_rail), 4, 6);
            lv_obj_set_height(id(nav_rail), 108);
            voice_icon::tick_nav(id(nav_voice_box), id(nav_mic));
        - script.execute: apply_voice_output_mode

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO46
    i2s_bclk_pin: GPIO15
    i2s_mclk_pin: GPIO7

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: sys_i2c
    bits_per_sample: 16bit
    sample_rate: 16000

microphone:
  - platform: i2s_audio
    id: mic_i2s
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO45
    adc_type: external
    bits_per_sample: 16bit
    pdm: false

speaker:
  - platform: i2s_audio
    id: spk_i2s
    i2s_audio_id: i2s_audio_bus
    dac_type: external
    i2s_dout_pin: GPIO6
    audio_dac: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 16000

micro_wake_word:
  id: mww
  microphone: mic_i2s
  models:
    - model: okay_nabu
  on_wake_word_detected:
    - if:
        condition:
          lambda: "return !id(voice_muted);"
        then:
          - script.execute: unlock_idle_screen
          - voice_assistant.start:

voice_assistant:
  id: va
  microphone: mic_i2s
  speaker: spk_i2s
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - script.stop: voice_overlay_auto_hide
    - script.execute: unlock_idle_screen
    - lambda: |-
        id(voice_has_answer) = false;
        voice_icon::set_mode(voice_icon::LISTENING);
    - script.execute: voice_tick
    - script.execute:
        id: set_voice_overlay
        visible: true
        title_text: "Listening..."
        body_text: "Speak now — Assist Pipeline is ready."
        hint_text: "Tap anywhere to cancel"
        badge_text: "LISTENING"
        icon_glyph: "\U000F036C"
        accent_hex: 0x58A6FF
        tint_hex: 0x79C0FF
        bg_hex: 0x0B1524
  on_stt_vad_end:
    - script.stop: voice_overlay_auto_hide
    - script.execute: unlock_idle_screen
    - lambda: "voice_icon::set_mode(voice_icon::THINKING);"
    - script.execute: voice_tick
    - script.execute:
        id: set_voice_overlay
        visible: true
        title_text: "Thinking..."
        body_text: "Processing request with Home Assistant..."
        hint_text: "Tap anywhere to cancel"
        badge_text: "ASSIST"
        icon_glyph: "\U000F06B5"
        accent_hex: 0xFFB020
        tint_hex: 0xFFD166
        bg_hex: 0x1A1408
  on_tts_start:
    - script.stop: voice_overlay_auto_hide
    - script.execute: unlock_idle_screen
    - lambda: |-
        id(voice_has_answer) = true;
        voice_icon::set_mode(voice_icon::SPEAKING);
    - script.execute: voice_tick
    - script.execute:
        id: set_voice_overlay
        visible: true
        title_text: "Assistant"
        body_text: !lambda "return x;"
        hint_text: "Tap to dismiss"
        badge_text: "SPEAKING"
        icon_glyph: "\U000F040A"
        accent_hex: 0x3FB950
        tint_hex: 0x56D364
        bg_hex: 0x091A12
    - if:
        condition:
          lambda: |-
            auto mode = id(voice_output_select).current_option();
            return (mode == "Onboard + HA Speakers" || mode == "HA Speakers Only")
              && std::string("${voice_tts_entity}").length() > 0
              && std::string("${voice_tts_speaker}").length() > 0;
        then:
          - homeassistant.action:
              action: tts.speak
              data:
                entity_id: "${voice_tts_entity}"
                media_player_entity_id: "${voice_tts_speaker}"
                message: !lambda "return x;"
  on_end:
    - lambda: |-
        voice_icon::set_mode(id(voice_muted) ? voice_icon::MUTED : voice_icon::IDLE);
    - script.execute: voice_tick
    - if:
        condition:
          lambda: "return id(voice_has_answer);"
        then:
          - lambda: |-
              lv_label_set_text(id(voice_overlay_badge), "ANSWER");
              lv_obj_invalidate(lv_scr_act());
          - script.execute: voice_overlay_auto_hide
        else:
          - script.execute: dismiss_voice_overlay
  on_error:
    - script.stop: voice_overlay_auto_hide
    - script.execute: unlock_idle_screen
    - lambda: |-
        id(voice_has_answer) = false;
        voice_icon::set_mode(voice_icon::ERROR);
    - script.execute: voice_tick
    - script.execute:
        id: set_voice_overlay
        visible: true
        title_text: "Voice Error"
        body_text: !lambda "return message;"
        hint_text: "Tap to dismiss"
        badge_text: "ERROR"
        icon_glyph: "\U000F0029"
        accent_hex: 0xF85149
        tint_hex: 0xFF7B72
        bg_hex: 0x1C0D10
    - delay: 3s
    - if:
        condition:
          lambda: "return !id(va).is_running() && !id(voice_has_answer);"
        then:
          - script.execute: dismiss_voice_overlay

select:
  - platform: template
    id: voice_output_select
    name: "Voice Output Mode"
    icon: "mdi:speaker-multiple"
    options:
      - "Onboard + HA Speakers"
      - "Onboard Only"
      - "HA Speakers Only"
      - "Display Only"
    initial_option: "${voice_output_mode}"
    optimistic: true
    restore_value: true
    set_action:
      - script.execute: apply_voice_output_mode

switch:
  - platform: template
    id: mic_mute_switch
    name: "Mute Microphone"
    icon: "mdi:microphone-off"
    optimistic: true
    turn_on_action:
      - lambda: |-
          id(voice_muted) = true;
          voice_icon::set_mode(voice_icon::MUTED);
      - micro_wake_word.stop:
      - script.execute: voice_tick
      - script.execute: sync_settings_ui
    turn_off_action:
      - lambda: |-
          id(voice_muted) = false;
          voice_icon::set_mode(voice_icon::IDLE);
      - micro_wake_word.start:
      - script.execute: voice_tick
      - script.execute: sync_settings_ui

lvgl:
  pages:
    - id: !extend home_page
      widgets:
        - button:
            id: nav_mic
            width: 64
            height: 46
            align: BOTTOM_LEFT
            x: 4
            y: -6
            bg_color: 0x101926
            bg_opa: COVER
            border_color: 0x26466D
            border_width: 1
            radius: 10
            pad_all: 0
            widgets:
              - obj:
                  id: nav_voice_box
                  width: 42
                  height: 28
                  align: CENTER
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  radius: 0
                  clickable: false
                  scrollbar_mode: "off"
            on_click:
              then:
                - script.execute: on_voice_ptt

        - obj:
            id: voice_overlay
            width: 560
            height: 160
            align: RIGHT_MID
            x: -6
            y: 0
            bg_color: 0x0B1524
            bg_opa: COVER
            border_color: 0x58A6FF
            border_width: 2
            radius: 12
            pad_all: 0
            clickable: true
            scrollbar_mode: "off"
            hidden: true
            on_click:
              then:
                - script.execute: dismiss_voice_overlay
            widgets:
              - obj:
                  id: voice_stage_box
                  width: 124
                  height: 124
                  align: LEFT_MID
                  x: 16
                  y: 0
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  radius: 0
                  clickable: false
                  scrollbar_mode: "off"

              - obj:
                  id: voice_stage_divider
                  width: 1
                  height: 112
                  align: LEFT_MID
                  x: 152
                  y: 0
                  bg_color: 0x21262D
                  bg_opa: COVER
                  border_width: 0
                  radius: 0
                  clickable: false

              - label:
                  id: voice_overlay_icon
                  text: "\U000F036C"
                  text_font: icons_20
                  text_color: 0x58A6FF
                  align: TOP_LEFT
                  x: 168
                  y: 16

              - label:
                  id: voice_overlay_title
                  text: "Listening..."
                  text_font: font_20
                  text_color: 0xF0F6FC
                  align: TOP_LEFT
                  x: 196
                  y: 14

              - label:
                  id: voice_overlay_badge
                  text: "LISTENING"
                  text_font: font_12
                  text_color: 0x79C0FF
                  align: TOP_RIGHT
                  x: -16
                  y: 18

              - obj:
                  id: voice_overlay_text_box
                  width: 376
                  height: 82
                  align: TOP_LEFT
                  x: 168
                  y: 44
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  radius: 0
                  scrollable: true
                  scroll_dir: VER
                  scrollbar_mode: "auto"
                  on_click:
                    then:
                      - script.execute: dismiss_voice_overlay
                  widgets:
                    - label:
                        id: voice_overlay_text
                        text: "Speak now — Assist Pipeline is ready."
                        text_font: font_14
                        text_color: 0xE6EDF3
                        width: 368
                        height: SIZE_CONTENT
                        long_mode: WRAP
                        align: TOP_LEFT
                        x: 0
                        y: 0

              - label:
                  id: voice_overlay_hint
                  text: "Tap anywhere to cancel"
                  text_font: font_12
                  text_color: 0x79C0FF
                  align: BOTTOM_LEFT
                  x: 168
                  y: -12

script:
  - id: !extend toggle_voice_mute
    then:
      - if:
          condition:
            lambda: "return id(voice_muted);"
          then:
            - switch.turn_on: mic_mute_switch
          else:
            - switch.turn_off: mic_mute_switch

  - id: set_voice_overlay
    parameters:
      visible: bool
      title_text: std::string
      body_text: std::string
      hint_text: std::string
      badge_text: std::string
      icon_glyph: std::string
      accent_hex: int
      tint_hex: int
      bg_hex: int
    then:
      - lambda: |-
          if (visible) {
            id(unlock_idle_screen).execute();
            lv_obj_set_style_bg_color(id(voice_overlay), lv_color_hex(bg_hex), 0);
            lv_obj_set_style_border_color(id(voice_overlay), lv_color_hex(accent_hex), 0);
            lv_obj_set_style_border_color(id(voice_stage_divider), lv_color_hex(accent_hex), 0);
            lv_obj_set_style_bg_color(id(voice_stage_divider), lv_color_hex(accent_hex), 0);
            lv_obj_set_style_bg_opa(id(voice_stage_divider), LV_OPA_30, 0);
            lv_label_set_text(id(voice_overlay_icon), icon_glyph.c_str());
            lv_obj_set_style_text_color(id(voice_overlay_icon), lv_color_hex(accent_hex), 0);
            lv_label_set_text(id(voice_overlay_title), title_text.c_str());
            lv_label_set_text(id(voice_overlay_badge), badge_text.c_str());
            lv_obj_set_style_text_color(id(voice_overlay_badge), lv_color_hex(tint_hex), 0);
            lv_label_set_text(id(voice_overlay_text), body_text.c_str());
            lv_obj_scroll_to_y(id(voice_overlay_text_box), 0, LV_ANIM_OFF);
            lv_label_set_text(id(voice_overlay_hint), hint_text.c_str());
            lv_obj_set_style_text_color(id(voice_overlay_hint), lv_color_hex(tint_hex), 0);
            lv_obj_clear_flag(id(voice_overlay), LV_OBJ_FLAG_HIDDEN);
            lv_obj_move_foreground(id(voice_overlay));
            voice_icon::tick_stage(id(voice_stage_box));
          } else {
            lv_obj_add_flag(id(voice_overlay), LV_OBJ_FLAG_HIDDEN);
          }
          lv_obj_invalidate(lv_scr_act());

  - id: apply_voice_output_mode
    then:
      - if:
          condition:
            lambda: |-
              auto mode = id(voice_output_select).current_option();
              return mode == "Onboard + HA Speakers" || mode == "Onboard Only";
          then:
            - speaker.mute_off: spk_i2s
          else:
            - speaker.mute_on: spk_i2s

  - id: dismiss_voice_overlay
    then:
      - script.stop: voice_overlay_auto_hide
      - script.execute: reset_idle_timer
      - if:
          condition:
            lambda: "return id(va).is_running();"
          then:
            - voice_assistant.stop:
          else:
            - lambda: |-
                id(voice_has_answer) = false;
                voice_icon::set_mode(id(voice_muted) ? voice_icon::MUTED : voice_icon::IDLE);
            - script.execute: voice_tick
            - script.execute:
                id: set_voice_overlay
                visible: false
                title_text: ""
                body_text: ""
                hint_text: ""
                badge_text: ""
                icon_glyph: "\U000F036C"
                accent_hex: 0x58A6FF
                tint_hex: 0x79C0FF
                bg_hex: 0x0B1524

  - id: voice_overlay_auto_hide
    mode: restart
    then:
      - delay: ${voice_answer_hold}
      - if:
          condition:
            lambda: "return !id(va).is_running();"
          then:
            - script.execute: dismiss_voice_overlay

  - id: !extend on_voice_ptt
    then:
      - script.stop: voice_overlay_auto_hide
      - script.execute: unlock_idle_screen
      - script.execute: reset_idle_timer
      - if:
          condition:
            lambda: "return id(va).is_running();"
          then:
            - voice_assistant.stop:
          else:
            - if:
                condition:
                  lambda: "return !id(voice_muted);"
                then:
                  - voice_assistant.start:
                else:
                  - lambda: "voice_icon::set_mode(voice_icon::MUTED);"
                  - script.execute: voice_tick
                  - script.execute:
                      id: set_voice_overlay
                      visible: true
                      title_text: "Mic Muted"
                      body_text: "Microphone is muted. Unmute in Home Assistant to use voice."
                      hint_text: "Tap to dismiss"
                      badge_text: "MUTED"
                      icon_glyph: "\U000F036D"
                      accent_hex: 0xF85149
                      tint_hex: 0xFF7B72
                      bg_hex: 0x1C0D10
                  - delay: 2500ms
                  - if:
                      condition:
                        lambda: "return id(voice_muted) && !id(va).is_running();"
                      then:
                        - script.execute:
                            id: set_voice_overlay
                            visible: false
                            title_text: ""
                            body_text: ""
                            hint_text: ""
                            badge_text: ""
                            icon_glyph: "\U000F036C"
                            accent_hex: 0x58A6FF
                            tint_hex: 0x79C0FF
                            bg_hex: 0x0B1524

  - id: voice_tick
    then:
      - lambda: |-
          voice_icon::tick_nav(id(nav_voice_box), id(nav_mic));
          if (!lv_obj_has_flag(id(voice_overlay), LV_OBJ_FLAG_HIDDEN)) {
            voice_icon::tick_stage(id(voice_stage_box));
          }

interval:
  - interval: 100ms
    then:
      - script.execute: voice_tick
