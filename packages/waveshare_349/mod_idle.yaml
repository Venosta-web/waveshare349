# Feature Module: 5-Minute Idle / Lock Clock Screen (Waveshare 3.49)
# Requires substitutions: idle_variant ("aurora"), idle_timeout ("300")

packages:
  idle_common: !include ../../idle/common.yaml
  idle_variant: !include ../../idle/${idle_variant}.yaml

esphome:
  on_boot:
    - priority: -149
      then:
        - lambda: "lv_obj_set_parent(id(nav_lock), id(nav_rail));"

lvgl:
  pages:
    - id: !extend home_page
      on_click:
        then:
          - script.execute: reset_idle_timer
      widgets:
        - button:
            id: nav_lock
            width: 64
            height: 50
            styles: nav_btn
            widgets:
              - label:
                  id: nav_lock_icon
                  text: "\U000F033E"
                  text_font: icons_20
                  text_color: 0x8B949E
                  align: CENTER
            on_click:
              then:
                - script.execute: lock_idle_screen

        - obj: !include ../../idle/${idle_variant}_card.yaml

time:
  - platform: homeassistant
    id: ha_time

script:
  - id: !extend switch_tab
    then:
      - script.execute: reset_idle_timer
