# Feature Module: Music Assistant (Waveshare 3.49)
# Requires substitution: music_variant ("studio" | "deck"), music_player_entity

packages:
  music_common: !include ../../music/common.yaml
  music_variant: !include ../../music/${music_variant}.yaml

esphome:
  includes:
    - ../../music/music_icon.h
  on_boot:
    - priority: -142
      then:
        - lambda: "lv_obj_set_parent(id(nav_music), id(nav_rail));"
    - priority: -152
      then:
        - lambda: |-
            if (id(active_tab) < 0) {
              id(switch_tab).execute(1);
            }
    - priority: -100
      then:
        - delay: 3s
        - script.execute: update_music_ui

api:
  on_client_connected:
    - delay: 1s
    - script.execute: update_music_ui

lvgl:
  pages:
    - id: !extend home_page
      widgets:
        - button:
            id: nav_music
            width: 64
            height: 50
            styles: nav_btn
            widgets:
              - obj:
                  id: nav_music_box
                  width: 28
                  height: 22
                  align: CENTER
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  radius: 0
                  clickable: false
                  scrollbar_mode: "off"
            on_click:
              then:
                - script.execute:
                    id: switch_tab
                    tab_idx: 1

        - obj: !include ../../music/${music_variant}_card.yaml

script:
  - id: !extend switch_tab
    then:
      - lambda: |-
          const bool active = (tab_idx == 1);
          music_icon::g_active = active;
          if (active) {
            lv_obj_clear_flag(id(music_card), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_bg_color(id(nav_music), lv_color_hex(0x1F6FEB), 0);
            lv_obj_set_style_border_color(id(nav_music), lv_color_hex(0x58A6FF), 0);
            lv_obj_scroll_to_view(id(nav_music), LV_ANIM_ON);
            id(cycle_paused) = true;
            id(pause_timer) = 3600;
          } else {
            lv_obj_add_flag(id(music_card), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_bg_color(id(nav_music), lv_color_hex(0x161B22), 0);
            lv_obj_set_style_border_color(id(nav_music), lv_color_hex(0x30363D), 0);
          }
          lv_obj_invalidate(lv_scr_act());

  - id: music_nav_tick
    then:
      - lambda: |-
          music_icon::g_playing = id(ma_is_playing);
          music_icon::g_muted = id(ma_muted);
          music_icon::tick_nav(id(nav_music_box));

interval:
  - interval: 100ms
    then:
      - script.execute: music_nav_tick
