# Hardware base for Waveshare ESP32-S3-Touch-LCD-3.49 (172x640 rotated 90°).

substitutions:
  # Battery voltage divider ratio on GPIO4 (typically 3.0 or 2.0)
  battery_divider: "3.0"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2025.11.0

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:

# ── Device status: battery, Wi-Fi signal & SSID ─────────────────────────────
# Feeds the idle_battery_* / idle_wifi_* globals (core_ui.yaml) that the lock
# screen and Settings pane render. Lives here so every hardware config — the
# top-level file, every preset and wizard output — gets it; the host simulator
# skips board.yaml and fakes these values itself.
sensor:
  - platform: adc
    pin: GPIO4
    id: battery_voltage
    name: "Battery Voltage"
    attenuation: 12db
    update_interval: 30s
    filters:
      - multiply: ${battery_divider}
    on_value:
      - lambda: |-
          float pct = ((x - 3.20f) / (4.20f - 3.20f)) * 100.0f;
          if (pct < 0.0f) pct = 0.0f;
          if (pct > 100.0f) pct = 100.0f;
          id(idle_battery_pct) = (int)roundf(pct);

  - platform: wifi_signal
    id: wifi_rssi_sensor
    name: "WiFi Signal"
    update_interval: 15s
    on_value:
      - lambda: |-
          if (!std::isnan(x)) id(idle_wifi_rssi) = (int)roundf(x);

text_sensor:
  - platform: wifi_info
    ssid:
      id: wifi_ssid_sensor
      name: "WiFi SSID"
      on_value:
        - lambda: "id(idle_wifi_ssid) = x;"

interval:
  - interval: 2s
    then:
      - lambda: |-
          id(idle_wifi_connected) = wifi::global_wifi_component->is_connected();

ota:
  - platform: esphome

spi:
  - id: display_qspi
    type: quad
    clk_pin: GPIO10
    data_pins:
      - GPIO11
      - GPIO12
      - GPIO13
      - GPIO14

i2c:
  - id: touch_i2c
    sda: GPIO17
    scl: GPIO18
    scan: true
  - id: sys_i2c
    sda: GPIO47
    scl: GPIO48
    scan: true

display:
  - platform: mipi_spi
    id: my_display
    model: WAVESHARE-ESP32-S3-TOUCH-LCD-3.49
    spi_id: display_qspi
    cs_pin: GPIO9
    reset_pin: GPIO21
    update_interval: never
    # The AXS15231 model preset uses draw_rounding: 8, but the native panel
    # width (172) is not a multiple of 8. With LVGL's software `rotation: 90`,
    # dirty areas touching the bottom landscape row get rounded to y2=175,
    # which maps to a negative native column (x1 = 172 - 168 - 8 = -4). The
    # resulting invalid CASET window smears stale pixels (orange UI colours)
    # along the bottom edge. 4 divides both 172 and 640, so every rounded area
    # stays on-panel. Native columns were already only 4-aligned under the old
    # setting (172 = 8*21 + 4), so the controller is known to accept this.
    draw_rounding: 4

lvgl:
  rotation: 90

touchscreen:
  - platform: axs15231
    id: my_touchscreen
    i2c_id: touch_i2c
    display: my_display
    # The AXS15231B touch firmware on this board reports coordinates in the
    # landscape frame (raw X along the 640px axis, raw Y along the 172px axis),
    # while the display's native frame is 172x640 portrait. Map raw touches
    # back into the native portrait frame here; LVGL's `rotation: 90` then
    # rotates them together with the picture. Without this, raw X clamps at
    # 172 and LVGL reports y:0 for almost every touch.
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: true

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO46
    i2s_bclk_pin: GPIO15
    i2s_mclk_pin: GPIO7

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: sys_i2c
    bits_per_sample: 16bit
    sample_rate: 16000

speaker:
  - platform: i2s_audio
    id: spk_i2s
    i2s_audio_id: i2s_audio_bus
    dac_type: external
    i2s_dout_pin: GPIO6
    audio_dac: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 16000

switch:
  - platform: template
    id: ai_sound_enabled
    name: "AI Sound Effects"
    icon: "mdi:volume-high"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

number:
  - platform: template
    id: ai_sound_volume
    name: "AI Sound Volume"
    icon: "mdi:volume-medium"
    optimistic: true
    restore_value: true
    initial_value: 70
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: "%"

script:
  - id: !extend play_ai_chime
    then:
      - lambda: |-
          ai_sounds::maybe_play(
            id(spk_i2s),
            static_cast<ai_sounds::ChimeId>(chime_id),
            id(ai_sound_enabled).state,
            id(ai_sound_volume).state,
            id(voice_active)
          );
