                              bg_opa: COVER
                              border_color: 0x30363D
                              border_width: 1
                              widgets:
                                - label:
                                    id: set_idle_60_lbl
                                    text: "1m"
                                    text_font: font_14
                                    text_color: 0x8B949E
                                    align: CENTER
                              on_click:
                                then:
                                  - script.execute:
