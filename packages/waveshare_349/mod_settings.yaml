            if (ssid.empty()) ssid = "Connected";
            if (ssid.length() > 14) ssid = ssid.substr(0, 13) + ".";
            if (id(idle_wifi_rssi) != 0) {
              snprintf(buf, sizeof(buf), "%s • %d dBm", ssid.c_str(), id(idle_wifi_rssi));
            } else {
              snprintf(buf, sizeof(buf), "%s", ssid.c_str());
