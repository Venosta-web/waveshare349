                              id: set_cat_system_icon
                              text: "\U000F062E"
                              text_font: icons_20
                              text_color: 0x8B949E
                              align: LEFT_MID
                          - label:
                              id: set_cat_system_lbl
                              text: "System"
                              text_font: font_14
                              text_color: 0x8B949E
                              align: LEFT_MID
                              x: 26
                        on_click:
                          then:
                            - script.execute:
                                id: select_settings_cat
                                cat_idx: 2

              # ── Right Detail Container (412 x 140) ──────────────────────
              - obj:
                  id: set_detail_box
                  width: 412
                  height: 140
                  align: RIGHT_MID
                  x: 0
                  y: 0
                  bg_color: 0x0D1117
                  bg_opa: COVER
                  border_color: 0x21262D
                  border_width: 1
                  radius: 10
                  pad_all: 10
                  scrollbar_mode: "off"
                  widgets:
                    # ── Pane 0: Display (Brightness & Idle Lock) ────────────
