                          - button:
                              id: set_cyc_60
                              width: 62
                              height: 40
                              x: 322
                              y: 66
                              radius: 8
                              bg_color: 0x161B22
                              bg_opa: COVER
                              border_color: 0x30363D
                              border_width: 1
                              widgets:
                                - label:
                                    id: set_cyc_60_lbl
                                    text: "60s"
                                    text_font: font_14
                                    text_color: 0x8B949E
                                    align: CENTER
                              on_click:
                                then:
                                  - script.execute:
                                      id: set_cycle_interval_sec
                                      seconds: 60

                    # ── Pane 2: System (Mic Mute, Network/Battery, Restart) ─
                    - obj:
                        id: set_pane_system
                        width: 390
                        height: 118
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        radius: 0
                        hidden: true
                        scrollbar_mode: "off"
                        widgets:
                          - label:
                              text: "Microphone"
                              text_font: font_14
                              text_color: 0xE6EDF3
                              x: 0
                              y: 4
                          - label:
                              id: set_mic_val
                              text: "Active"
                              text_font: font_12
                              text_color: 0x3FB950
                              x: 0
                              y: 24

                          - button:
                              id: set_btn_mic
                              width: 116
                              height: 40
                              align: TOP_RIGHT
                              x: 0
                              y: 3
                              radius: 8
                              bg_color: 0x163322
                              bg_opa: COVER
                              border_color: 0x3FB950
                              border_width: 1
                              widgets:
                                - label:
                                    id: set_mic_btn_icon
                                    text: "\U000F036C"
                                    text_font: icons_20
                                    text_color: 0x3FB950
                                    align: LEFT_MID
                                    x: 12
                                - label:
                                    id: set_mic_btn_lbl
                                    text: "Mute"
                                    text_font: font_14
                                    text_color: 0xE6EDF3
                                    align: LEFT_MID
                                    x: 38
                              on_click:
                                then:
                                  - script.execute: toggle_voice_mute
                                  - script.execute: sync_settings_ui

                          - obj:
                              width: 390
                              height: 1
                              x: 0
                              y: 55
                              bg_color: 0x21262D
                              bg_opa: COVER
                              border_width: 0
                              radius: 0

                          - label:
                              id: set_wifi_icon
                              text: "\U000F05A9"
                              text_font: icons_20
                              text_color: 0x58A6FF
                              x: 0
                              y: 68
                          - label:
                              id: set_wifi_lbl
                              text: "Wi-Fi: --"
                              text_font: font_12
                              text_color: 0xE6EDF3
                              x: 26
                              y: 66
                          - label:
                              id: set_batt_lbl
                              text: "Battery: --"
                              text_font: font_12
                              text_color: 0x8B949E
                              x: 26
                              y: 86

                          - button:
                              id: set_btn_restart
                              width: 116
                              height: 40
                              align: TOP_RIGHT
                              x: 0
                              y: 66
                              radius: 8
                              bg_color: 0x21262D
                              bg_opa: COVER
                              border_color: 0x30363D
                              border_width: 1
                              widgets:
                                - label:
                                    id: set_restart_icon
                                    text: "\U000F0450"
                                    text_font: icons_20
                                    text_color: 0xE6EDF3
                                    align: LEFT_MID
                                    x: 12
                                - label:
                                    id: set_restart_lbl
                                    text: "Restart"
                                    text_font: font_14
                                    text_color: 0xE6EDF3
                                    align: LEFT_MID
                                    x: 38
                              on_click:
                                then:
                                  - lambda: |-
                                      if (id(settings_restart_armed) == 0) {
                                        id(settings_restart_armed) = 4;
                                        id(sync_settings_ui).execute();
                                      } else {
                                        ESP_LOGW("settings", "Restart confirmed by user");
                                      #ifndef USE_HOST
                                        App.safe_reboot();
                                      #else
                                        id(settings_restart_armed) = 0;
                                        id(sync_settings_ui).execute();
                                      #endif
                                      }

        # Non-clickable software dimmer overlay for Brightness setting
        - obj:
            id: brightness_dim_overlay
            width: 640
            height: 172
            align: CENTER
            bg_color: 0x000000
            bg_opa: 0%
            border_width: 0
            radius: 0
            clickable: false
            hidden: true

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (id(settings_restart_armed) > 0) {
            id(settings_restart_armed)--;
            if (id(settings_restart_armed) == 0) {
              id(sync_settings_ui).execute();
            }
          }
          if (id(active_tab) == 4 && id(settings_active_cat) == 2) {
            id(sync_settings_ui).execute();
          }

script:
  - id: !extend switch_tab
    then:
      - lambda: |-
          bool active = (tab_idx == 4);
          if (active) {
            lv_obj_clear_flag(id(settings_card), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_bg_color(id(nav_settings), lv_color_hex(0x1F6FEB), 0);
            lv_obj_set_style_border_color(id(nav_settings), lv_color_hex(0x58A6FF), 0);
            lv_obj_set_style_text_color(id(nav_settings_icon), lv_color_hex(0xFFFFFF), 0);
            id(settings_restart_armed) = 0;
            id(sync_settings_ui).execute();
          } else {
            lv_obj_add_flag(id(settings_card), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_bg_color(id(nav_settings), lv_color_hex(0x161B22), 0);
            lv_obj_set_style_border_color(id(nav_settings), lv_color_hex(0x30363D), 0);
            lv_obj_set_style_text_color(id(nav_settings_icon), lv_color_hex(0x8B949E), 0);
          }

  - id: select_settings_cat
    parameters:
      cat_idx: int
    then:
      - lambda: |-
          id(settings_active_cat) = cat_idx;
          id(settings_restart_armed) = 0;
      - script.execute: sync_settings_ui

  - id: set_brightness_level
    parameters:
      level: int
    then:
      - lambda: |-
          id(settings_brightness) = level;
          uint8_t opa = 0;
          if (level <= 25) opa = 185;
          else if (level <= 50) opa = 128;
          else if (level <= 75) opa = 64;
          if (opa == 0) {
            lv_obj_add_flag(id(brightness_dim_overlay), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_set_style_bg_opa(id(brightness_dim_overlay), opa, 0);
            lv_obj_clear_flag(id(brightness_dim_overlay), LV_OBJ_FLAG_HIDDEN);
            lv_obj_move_foreground(id(brightness_dim_overlay));
          }
      - script.execute: sync_settings_ui

  - id: set_idle_timeout_sec
    parameters:
      seconds: int
    then:
      - lambda: |-
          id(settings_idle_timeout) = seconds;
      - script.execute: reset_idle_timer
      - script.execute: sync_settings_ui

  - id: set_cycle_interval_sec
    parameters:
      seconds: int
    then:
      - lambda: |-
          id(settings_cycle_interval) = seconds;
      - script.execute: sync_settings_ui

  - id: !extend sync_settings_ui
    then:
      - lambda: |-
          auto style_pill = [](lv_obj_t* btn, lv_obj_t* lbl, bool active) {
            lv_obj_set_style_bg_color(btn, lv_color_hex(active ? 0x1F6FEB : 0x161B22), 0);
            lv_obj_set_style_border_color(btn, lv_color_hex(active ? 0x58A6FF : 0x30363D), 0);
            lv_obj_set_style_text_color(lbl, lv_color_hex(active ? 0xFFFFFF : 0x8B949E), 0);
          };

          auto style_cat = [](lv_obj_t* btn, lv_obj_t* icon, lv_obj_t* lbl, bool active) {
            lv_obj_set_style_bg_color(btn, lv_color_hex(active ? 0x1F6FEB : 0x0D1117), 0);
            lv_obj_set_style_border_color(btn, lv_color_hex(active ? 0x58A6FF : 0x21262D), 0);
            lv_obj_set_style_text_color(icon, lv_color_hex(active ? 0xFFFFFF : 0x8B949E), 0);
            lv_obj_set_style_text_color(lbl, lv_color_hex(active ? 0xFFFFFF : 0x8B949E), 0);
          };

          int cat = id(settings_active_cat);
          style_cat(id(set_cat_display), id(set_cat_display_icon), id(set_cat_display_lbl), cat == 0);
          style_cat(id(set_cat_grow), id(set_cat_grow_icon), id(set_cat_grow_lbl), cat == 1);
          style_cat(id(set_cat_system), id(set_cat_system_icon), id(set_cat_system_lbl), cat == 2);

