                              height: 40
                              x: 186
                              y: 3
                              radius: 8
                              bg_color: 0x161B22
                              bg_opa: COVER
                              border_color: 0x30363D
                              border_width: 1
                              widgets:
                                - label:
                                    id: set_bri_50_lbl
                                    text: "50%"
                                    text_font: font_14
                                    text_color: 0x8B949E
                                    align: CENTER
                              on_click:
                                then:
                                  - script.execute:
                                      id: set_brightness_level
                                      level: 50

                          - button:
                              id: set_bri_75
                              width: 62
                              height: 40
                              x: 254
