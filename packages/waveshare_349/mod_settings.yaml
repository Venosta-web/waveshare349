          } else {
            lv_label_set_text(id(set_wifi_lbl), "Wi-Fi: Disconnected");
            lv_obj_set_style_text_color(id(set_wifi_icon), lv_color_hex(0x6E7681), 0);
          }

          if (id(idle_battery_pct) >= 0) {
            snprintf(buf, sizeof(buf), "Battery: %d%%", id(idle_battery_pct));
