# Feature Module: Device Settings Menu (Waveshare 3.49 — 640x172)
# Provides Display (Brightness dimmer, Idle Lock timeout, Lock Now),
# Growspace (Auto-Cycle toggle, Cycle Speed), and System (Mic Mute, Wi-Fi/Battery status, Safe Restart).

globals:
  - id: settings_active_cat
    type: int
    initial_value: "0"
  - id: settings_restart_armed
    type: int
    initial_value: "0"

esphome:
  on_boot:
    - priority: -147
      then:
        - lambda: "lv_obj_set_parent(id(nav_settings), id(nav_rail));"
        - script.execute: sync_settings_ui
    - priority: -157
      then:
        - lambda: |-
            if (id(active_tab) < 0) {
              id(switch_tab).execute(4);
            }

lvgl:
  pages:
    - id: !extend home_page
      widgets:
        - button:
            id: nav_settings
            width: 64
            height: 50
            styles: nav_btn
            widgets:
              - label:
                  id: nav_settings_icon
                  text: "\U000F0493"
                  text_font: icons_20
                  text_color: 0x8B949E
                  align: CENTER
            on_click:
              then:
                - script.execute:
                    id: switch_tab
                    tab_idx: 4

        - obj:
            id: settings_card
            width: 560
            height: 160
            align: RIGHT_MID
            x: -6
            y: 0
            styles: card_style
            hidden: true
            scrollbar_mode: "off"
            widgets:
              # ── Left Category Rail (120 x 140) ──────────────────────────
              - obj:
                  id: set_cat_rail
                  width: 120
                  height: 140
                  align: LEFT_MID
                  x: 0
                  y: 0
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  radius: 0
                  scrollbar_mode: "off"
                  layout:
                    type: flex
                    flex_flow: COLUMN
                    pad_row: 7
                  widgets:
                    - button:
                        id: set_cat_display
                        width: 120
                        height: 42
                        radius: 8
                        bg_color: 0x1F6FEB
                        bg_opa: COVER
                        border_color: 0x58A6FF
                        border_width: 1
                        pad_left: 10
                        pad_right: 8
                        widgets:
                          - label:
                              id: set_cat_display_icon
                              text: "\U000F00E0"
                              text_font: icons_20
                              text_color: 0xFFFFFF
                              align: LEFT_MID
                          - label:
                              id: set_cat_display_lbl
                              text: "Display"
                              text_font: font_14
                              text_color: 0xFFFFFF
                              align: LEFT_MID
                              x: 26
                        on_click:
                          then:
                            - script.execute:
                                id: select_settings_cat
                                cat_idx: 0

                    - button:
                        id: set_cat_grow
                        width: 120
                        height: 42
                        radius: 8
                        bg_color: 0x0D1117
                        bg_opa: COVER
                        border_color: 0x21262D
                        border_width: 1
                        pad_left: 10
                        pad_right: 8
                        widgets:
                          - label:
                              id: set_cat_grow_icon
                              text: "\U000F0E66"
                              text_font: icons_20
                              text_color: 0x8B949E
                              align: LEFT_MID
                          - label:
                              id: set_cat_grow_lbl
                              text: "Grow"
                              text_font: font_14
                              text_color: 0x8B949E
                              align: LEFT_MID
                              x: 26
                        on_click:
                          then:
                            - script.execute:
                                id: select_settings_cat
                                cat_idx: 1

                    - button:
                        id: set_cat_system
                        width: 120
                        height: 42
                        radius: 8
                        bg_color: 0x0D1117
                        bg_opa: COVER
                        border_color: 0x21262D
                        border_width: 1
                        pad_left: 10
                        pad_right: 8
                        widgets:
