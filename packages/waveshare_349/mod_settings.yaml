                                    align: CENTER
                              on_click:
                                then:
                                  - script.execute:
                                      id: set_idle_timeout_sec
                                      seconds: 0

                          - button:
                              id: set_btn_lock_now
                              width: 52
                              height: 40
                              x: 332
                              y: 66
                              radius: 8
                              bg_color: 0x21262D
                              bg_opa: COVER
                              border_color: 0x30363D
                              border_width: 1
                              widgets:
                                - label:
                                    text: "\U000F033E"
                                    text_font: icons_20
                                    text_color: 0xE6EDF3
                                    align: CENTER
                              on_click:
                                then:
                                  - script.execute: lock_screen_now

                    # ── Pane 1: Growspace (Auto-Cycle & Cycle Speed) ────────
                    - obj:
                        id: set_pane_grow
                        width: 390
                        height: 118
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        radius: 0
                        hidden: true
                        scrollbar_mode: "off"
                        widgets:
                          - label:
                              text: "Auto-Cycle"
                              text_font: font_14
                              text_color: 0xE6EDF3
                              x: 0
                              y: 4
                          - label:
                              text: "Rotate growspaces"
                              text_font: font_12
                              text_color: 0x8B949E
                              x: 0
                              y: 24

                          - button:
                              id: set_btn_autocycle
                              width: 116
                              height: 40
                              align: TOP_RIGHT
                              x: 0
                              y: 3
                              radius: 8
                              bg_color: 0x163322
                              bg_opa: COVER
                              border_color: 0x3FB950
                              border_width: 1
                              widgets:
                                - label:
                                    id: set_autocycle_lbl
                                    text: "Active"
                                    text_font: font_14
                                    text_color: 0x3FB950
                                    align: CENTER
                              on_click:
                                then:
                                  - lambda: |-
                                      id(settings_cycle_enabled) = !id(settings_cycle_enabled);
                                      id(cycle_paused) = !id(settings_cycle_enabled);
                                      id(pause_timer) = 0;
                                  - script.execute: sync_settings_ui

                          - obj:
                              width: 390
                              height: 1
                              x: 0
                              y: 55
                              bg_color: 0x21262D
                              bg_opa: COVER
                              border_width: 0
                              radius: 0

                          - label:
                              text: "Cycle Speed"
                              text_font: font_14
                              text_color: 0xE6EDF3
                              x: 0
                              y: 66
                          - label:
                              id: set_cycle_val
                              text: "15s"
                              text_font: font_12
                              text_color: 0x58A6FF
                              x: 0
                              y: 86

                          - button:
                              id: set_cyc_10
                              width: 62
                              height: 40
                              x: 118
                              y: 66
                              radius: 8
                              bg_color: 0x161B22
                              bg_opa: COVER
                              border_color: 0x30363D
                              border_width: 1
                              widgets:
                                - label:
                                    id: set_cyc_10_lbl
                                    text: "10s"
                                    text_font: font_14
                                    text_color: 0x8B949E
                                    align: CENTER
                              on_click:
                                then:
                                  - script.execute:
                                      id: set_cycle_interval_sec
                                      seconds: 10

                          - button:
                              id: set_cyc_15
                              width: 62
                              height: 40
                              x: 186
                              y: 66
                              radius: 8
                              bg_color: 0x1F6FEB
                              bg_opa: COVER
                              border_color: 0x58A6FF
                              border_width: 1
                              widgets:
                                - label:
                                    id: set_cyc_15_lbl
                                    text: "15s"
                                    text_font: font_14
                                    text_color: 0xFFFFFF
                                    align: CENTER
                              on_click:
                                then:
                                  - script.execute:
                                      id: set_cycle_interval_sec
                                      seconds: 15

                          - button:
                              id: set_cyc_30
                              width: 62
                              height: 40
                              x: 254
                              y: 66
                              radius: 8
                              bg_color: 0x161B22
                              bg_opa: COVER
                              border_color: 0x30363D
                              border_width: 1
                              widgets:
