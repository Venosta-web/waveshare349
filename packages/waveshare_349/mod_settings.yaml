          // Safe 2-tap Restart button
          bool armed = (id(settings_restart_armed) > 0);
          lv_obj_set_style_bg_color(id(set_btn_restart), lv_color_hex(armed ? 0x3B1219 : 0x21262D), 0);
          lv_obj_set_style_border_color(id(set_btn_restart), lv_color_hex(armed ? 0xF85149 : 0x30363D), 0);
          lv_obj_set_style_text_color(id(set_restart_icon), lv_color_hex(armed ? 0xF85149 : 0xE6EDF3), 0);
          lv_obj_set_style_text_color(id(set_restart_lbl), lv_color_hex(armed ? 0xF85149 : 0xE6EDF3), 0);
          lv_label_set_text(id(set_restart_lbl), armed ? "Confirm?" : "Restart");
