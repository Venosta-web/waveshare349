                          - button:
                              id: set_idle_600
                              width: 48
                              height: 40
                              x: 224
                              y: 66
                              radius: 8
                              bg_color: 0x161B22
                              bg_opa: COVER
                              border_color: 0x30363D
                              border_width: 1
                              widgets:
                                - label:
                                    id: set_idle_600_lbl
