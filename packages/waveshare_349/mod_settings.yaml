          style_pill(id(set_cyc_10), id(set_cyc_10_lbl), cs == 10);
          style_pill(id(set_cyc_15), id(set_cyc_15_lbl), cs == 15);
          style_pill(id(set_cyc_30), id(set_cyc_30_lbl), cs == 30);
          style_pill(id(set_cyc_60), id(set_cyc_60_lbl), cs == 60);

          // Microphone Mute
          bool muted = id(voice_muted);
          lv_label_set_text(id(set_mic_val), muted ? "Muted" : "Active");
          lv_obj_set_style_text_color(id(set_mic_val), lv_color_hex(muted ? 0xF85149 : 0x3FB950), 0);
          lv_obj_set_style_bg_color(id(set_btn_mic), lv_color_hex(muted ? 0x3B1219 : 0x163322), 0);
          lv_obj_set_style_border_color(id(set_btn_mic), lv_color_hex(muted ? 0xF85149 : 0x3FB950), 0);
          lv_label_set_text(id(set_mic_btn_icon), muted ? "\U000F036D" : "\U000F036C");
          lv_obj_set_style_text_color(id(set_mic_btn_icon), lv_color_hex(muted ? 0xF85149 : 0x3FB950), 0);
          lv_label_set_text(id(set_mic_btn_lbl), muted ? "Unmute" : "Mute");

          // Wi-Fi & Battery Telemetry
          if (id(idle_wifi_connected)) {
