# Shared LVGL UI, Home Assistant entities, and Display View control for
# Waveshare 3.49 (both SDL simulator and ESP32-S3 Voice Satellite hardware).

# ============================================================================
# 1. GLOBALS
# ============================================================================
globals:
  - id: vpd_sensor_index
    type: int
    initial_value: "0"
  - id: cycle_timer
    type: int
    initial_value: "${cycle_interval}"
  - id: cycle_paused
    type: bool
    initial_value: "false"
  - id: pause_timer
    type: int
    initial_value: "0"
  - id: gs_total
    type: int
    initial_value: "${gs_count}"
  - id: nav_direction
    type: int
    initial_value: "1"
  - id: active_tab
    type: int
    initial_value: "0"
  - id: voice_muted
    type: bool
    initial_value: "false"

# ============================================================================
# 2. FONTS & MDI ICONS
# ============================================================================
font:
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_12
    size: 12
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°•"

  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_14
    size: 14
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°•"

  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: font_20
    size: 20
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°•"

  - file:
      type: gfonts
      family: Roboto
      weight: 800
    id: font_32
    size: 32
    bpp: 4
    glyphs: "0123456789:.% -°abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ/"

  - file: "fonts/materialdesignicons-webfont.ttf"
    id: icons_20
    size: 20
    glyphs:
      - "\U000F050F" # thermometer
      - "\U000F058C" # water
      - "\U000F012C" # check-circle
      - "\U000F0029" # alert
      - "\U000F0159" # close-circle
      - "\U000F0210" # fan
      - "\U000F06B5" # lightbulb (day)
      - "\U000F06B8" # lightbulb-off (night)
      - "\U000F03E4" # pause
      - "\U000F036C" # microphone
      - "\U000F036D" # microphone-off
      - "\U000F040A" # play
      - "\U000F04AE" # skip-next
      - "\U000F04AD" # skip-previous
      - "\U000F075A" # music
      - "\U000F0387" # music-note
      - "\U000F0E66" # sprout

  - file: "fonts/materialdesignicons-webfont.ttf"
    id: icons_24
    size: 24
    glyphs:
      - "\U000F0141" # chevron-left
      - "\U000F0142" # chevron-right
      - "\U000F036C" # microphone
      - "\U000F036D" # microphone-off
      - "\U000F040A" # play
      - "\U000F03E4" # pause

# ============================================================================
# 3. EXPOSED DISPLAY VIEW SELECT ENTITY (Controlled by HA Assist / Local LLM)
# ============================================================================
select:
  - platform: template
    id: display_view
    name: "Display View"
    icon: "mdi:monitor-dashboard"
    options:
      - "Growspace"
      - "Music"
      - "AI"
    initial_option: "Growspace"
    optimistic: true
    set_action:
      - lambda: |-
          int target = 0;
          if (x == "Music") target = 1;
          else if (x == "AI") target = 2;
          id(switch_tab).execute(target);

# ============================================================================
# 4. LVGL 640x172 UI
# ============================================================================
lvgl:
  log_level: INFO
  buffer_size: 100%
  full_refresh: true
  disp_bg_color: 0x0A0C10
  touchscreens:
    - touchscreen_id: my_touchscreen

  style_definitions:
    - id: nav_btn
      bg_color: 0x161B22
      bg_opa: COVER
      border_color: 0x30363D
      border_width: 1
      radius: 8
      pad_all: 0

    - id: nav_btn_active
      bg_color: 0x1F6FEB
      bg_opa: COVER
      border_color: 0x58A6FF
      border_width: 1
      radius: 8
      pad_all: 0

    - id: card_style
      bg_color: 0x161B22
      bg_opa: COVER
      border_color: 0x30363D
      border_width: 2
      radius: 12
      pad_all: 8

    - id: phase_badge
      bg_color: 0x333333
      bg_opa: COVER
      radius: 6
      pad_left: 7
      pad_right: 7
      pad_top: 2
      pad_bottom: 2
      border_width: 0

    - id: media_btn
      bg_color: 0x21262D
      bg_opa: COVER
      border_color: 0x30363D
      border_width: 1
      radius: 8
      pad_all: 0

  pages:
    - id: home_page
      bg_color: 0x0A0C10
      widgets:
        # ── LEFT NAVIGATION RAIL (72 x 172) ────────────────────────────────
        - button:
            id: nav_grow
            width: 64
            height: 38
            align: TOP_LEFT
            x: 4
            y: 4
            styles: nav_btn_active
            widgets:
              - label:
                  id: nav_grow_icon
                  text: "\U000F0E66"
                  text_font: icons_20
                  text_color: 0xFFFFFF
                  align: CENTER
            on_press:
              then:
                - script.execute:
                    id: switch_tab
                    tab_idx: 0

        - button:
            id: nav_music
            width: 64
            height: 38
            align: TOP_LEFT
            x: 4
            y: 45
            styles: nav_btn
            widgets:
              - label:
                  id: nav_music_icon
                  text: "\U000F0387"
                  text_font: icons_20
                  text_color: 0x8B949E
                  align: CENTER
            on_press:
              then:
                - script.execute:
                    id: switch_tab
                    tab_idx: 1

        - button:
            id: nav_ai
            width: 64
            height: 38
            align: TOP_LEFT
            x: 4
            y: 86
            styles: nav_btn
            widgets:
              - obj:
                  id: nav_clawd_box
                  width: 28
                  height: 22
                  align: CENTER
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  radius: 0
                  clickable: false
                  scrollbar_mode: "off"
              - obj:
                  id: ai_alert_badge
                  width: 10
                  height: 10
                  align: TOP_RIGHT
                  x: -4
                  y: 4
                  radius: 5
                  bg_color: 0xFF5252
                  bg_opa: COVER
                  border_width: 0
                  hidden: true
            on_press:
              then:
                - script.execute:
                    id: switch_tab
                    tab_idx: 2

        - button:
            id: nav_mic
            width: 64
            height: 40
            align: TOP_LEFT
            x: 4
            y: 127
            styles: nav_btn
            widgets:
              - label:
                  id: nav_mic_icon
                  text: "\U000F036C"
                  text_font: icons_20
                  text_color: 0x8B949E
                  align: CENTER
            on_press:
              then:
                - script.execute: on_voice_ptt

        # ── CARD 1: GROWSPACE MANAGER (560 x 160) ──────────────────────────
        - obj:
            id: grow_card
            width: 560
            height: 160
            align: RIGHT_MID
            x: -6
            y: 0
            styles: card_style
            scrollbar_mode: "off"
            widgets:
              - label:
                  id: gs_name_lbl
                  text: "4x4"
                  text_font: font_20
                  text_color: 0x00D1FF
                  align: TOP_LEFT
                  x: 4
                  y: 0

              - label:
                  id: gs_day_icon
                  text: "\U000F06B5"
                  text_font: icons_20
                  text_color: 0xFFC107
                  align: TOP_LEFT
                  x: 155
                  y: 2

              - label:
                  id: gs_pause_icon
                  text: "\U000F03E4"
                  text_font: icons_20
                  text_color: 0xFFC107
                  align: TOP_LEFT
                  x: 180
                  y: 2
                  hidden: true

              - label:
                  id: gs_phase_badge
                  text: "Waiting HA"
                  text_font: font_12
                  text_color: 0xFFFFFF
                  styles: phase_badge
                  align: TOP_LEFT
                  x: 205
                  y: 2

              - label:
                  id: gs_vpd_status
                  text: "\U000F012C"
                  text_font: icons_20
                  text_color: 0x4CAF50
                  align: LEFT_MID
                  x: 4
                  y: -2

              - label:
                  id: gs_vpd_val
                  text: "-- kPa"
                  text_font: font_32
                  text_color: 0xFFFFFF
                  align: LEFT_MID
                  x: 28
                  y: -2

              - label:
                  id: gs_vpd_range
                  text: "Target\n-- - --"
                  text_font: font_12
                  text_color: 0x8B949E
                  align: LEFT_MID
                  x: 185
                  y: 0

              # VPD Linear Gauge Track (270px wide)
              - obj:
                  id: gs_gauge_bg
                  width: 270
                  height: 10
                  align: BOTTOM_LEFT
                  x: 4
                  y: -16
                  bg_color: 0x30363D
                  bg_opa: COVER
                  border_width: 0
                  radius: 4
                  widgets:
                    - obj:
                        id: gs_gauge_zone
                        width: 80
                        height: 10
                        align: LEFT_MID
                        x: 70
                        bg_color: 0x4CAF50
                        bg_opa: 65%
                        border_width: 0
                        radius: 4
                    - obj:
                        id: gs_gauge_marker
                        width: 8
                        height: 16
                        align: LEFT_MID
                        x: 110
                        bg_color: 0x00D1FF
                        bg_opa: COVER
                        border_width: 0
                        radius: 4

              - label:
                  text: "${vpd_gauge_min}"
                  text_font: font_12
                  text_color: 0x6E7681
                  align: BOTTOM_LEFT
                  x: 4
                  y: 0

              - label:
                  text: "${vpd_gauge_max}"
                  text_font: font_12
                  text_color: 0x6E7681
                  align: BOTTOM_LEFT
                  x: 254
                  y: 0

              # Vertical Divider
              - obj:
                  width: 1
                  height: 132
                  align: LEFT_MID
                  x: 292
                  bg_color: 0x30363D
                  bg_opa: COVER
                  border_width: 0

              # Right Column: Temp, Humidity & Equipment
              - label:
                  text: "\U000F050F"
                  text_font: icons_20
                  text_color: 0xFF6B6B
                  align: TOP_LEFT
                  x: 304
                  y: 4
              - label:
                  id: gs_temp_val
                  text: "--.- °C"
                  text_font: font_20
                  text_color: 0xFFFFFF
                  align: TOP_LEFT
                  x: 326
                  y: 2

              - label:
                  text: "\U000F058C"
                  text_font: icons_20
                  text_color: 0x64B5F6
                  align: TOP_LEFT
                  x: 304
                  y: 34
              - label:
                  id: gs_hum_val
                  text: "-- %"
                  text_font: font_20
                  text_color: 0xFFFFFF
                  align: TOP_LEFT
                  x: 326
                  y: 32

              - label:
                  id: gs_exh_lbl
                  text: "Exh: --"
                  text_font: font_12
                  text_color: 0x8B949E
                  align: BOTTOM_LEFT
                  x: 304
                  y: -36
              - label:
                  id: gs_circ_lbl
                  text: "Circ: --"
                  text_font: font_12
                  text_color: 0x8B949E
                  align: BOTTOM_LEFT
                  x: 304
                  y: -19
              - label:
                  id: gs_hum_eq_lbl
                  text: "Hum: --"
                  text_font: font_12
                  text_color: 0x8B949E
                  align: BOTTOM_LEFT
                  x: 304
                  y: -2

              # Prev / Next Space Buttons
              - button:
                  id: btn_prev_space
                  width: 64
                  height: 62
                  align: TOP_RIGHT
                  x: 0
                  y: 0
                  bg_color: 0x21262D
                  radius: 8
                  widgets:
                    - label:
                        text: "\U000F0141"
                        text_font: icons_24
                        align: CENTER
                  on_press:
                    then:
                      - lambda: "id(nav_direction) = -1;"
                      - script.execute: navigate_space

              - button:
                  id: btn_next_space
                  width: 64
                  height: 62
                  align: BOTTOM_RIGHT
                  x: 0
                  y: 0
                  bg_color: 0x21262D
                  radius: 8
                  widgets:
                    - label:
                        text: "\U000F0142"
                        text_font: icons_24
                        align: CENTER
                  on_press:
                    then:
                      - lambda: "id(nav_direction) = 1;"
                      - script.execute: navigate_space

        # ── CARD 2: MUSIC ASSISTANT (Hidden initially) ───────────────────────
        # Widgets live in music/<variant>_card.yaml, logic in music/<variant>.yaml.
        - obj: !include ../music/${music_variant}_card.yaml

        # ── CARD 3: CLAUDE CODE (Hidden initially) ─────────────────────────
        # Widgets live in claude/<variant>_card.yaml, logic in claude/<variant>.yaml.
        - obj: !include ../claude/${claude_variant}_card.yaml

        # ── GLOBAL VOICE OVERLAY (Shown while Voice Satellite is active) ───
        - obj:
            id: voice_overlay
            width: 520
            height: 40
            align: TOP_RIGHT
            x: -26
            y: 6
            bg_color: 0x161B22
            bg_opa: 95%
            border_color: 0x58A6FF
            border_width: 2
            radius: 20
            pad_left: 12
            pad_right: 12
            scrollbar_mode: "off"
            hidden: true
            widgets:
              - label:
                  id: voice_overlay_icon
                  text: "\U000F036C"
                  text_font: icons_20
                  text_color: 0x58A6FF
                  align: LEFT_MID
                  x: 0
                  y: 0
              - label:
                  id: voice_overlay_text
                  text: "Listening..."
                  text_font: font_14
                  text_color: 0xFFFFFF
                  width: 460
                  long_mode: DOT
                  align: LEFT_MID
                  x: 28
                  y: 0

# ============================================================================
# 5. HOME ASSISTANT SENSORS (All 7 Growspaces)
# ============================================================================
sensor:
  # Space 0: 4x4
  - { platform: homeassistant, id: gs0_vpd, entity_id: "${gs_0_vpd}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs0_temp, entity_id: "${gs_0_temp}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs0_hum, entity_id: "${gs_0_hum}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs0_vpd_tgt_min, entity_id: "${gs_0_metrics}", attribute: vpd_target_min }
  - { platform: homeassistant, id: gs0_vpd_tgt_max, entity_id: "${gs_0_metrics}", attribute: vpd_target_max }
  - { platform: homeassistant, id: gs0_vpd_dng_min, entity_id: "${gs_0_metrics}", attribute: vpd_danger_min }
  - { platform: homeassistant, id: gs0_vpd_dng_max, entity_id: "${gs_0_metrics}", attribute: vpd_danger_max }
  - { platform: homeassistant, id: gs0_exhaust, entity_id: "${gs_0_exhaust}", attribute: percentage }
  - { platform: homeassistant, id: gs0_circ, entity_id: "${gs_0_circ}", attribute: percentage }

  # Space 1: SOG 2x5
  - { platform: homeassistant, id: gs1_vpd, entity_id: "${gs_1_vpd}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs1_temp, entity_id: "${gs_1_temp}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs1_hum, entity_id: "${gs_1_hum}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs1_vpd_tgt_min, entity_id: "${gs_1_metrics}", attribute: vpd_target_min }
  - { platform: homeassistant, id: gs1_vpd_tgt_max, entity_id: "${gs_1_metrics}", attribute: vpd_target_max }
  - { platform: homeassistant, id: gs1_vpd_dng_min, entity_id: "${gs_1_metrics}", attribute: vpd_danger_min }
  - { platform: homeassistant, id: gs1_vpd_dng_max, entity_id: "${gs_1_metrics}", attribute: vpd_danger_max }
  - { platform: homeassistant, id: gs1_exhaust, entity_id: "${gs_1_exhaust}", attribute: percentage }
  - { platform: homeassistant, id: gs1_circ, entity_id: "${gs_1_circ}", attribute: percentage }

  # Space 2: Nursery Dome
  - { platform: homeassistant, id: gs2_vpd, entity_id: "${gs_2_vpd}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs2_temp, entity_id: "${gs_2_temp}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs2_hum, entity_id: "${gs_2_hum}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs2_vpd_tgt_min, entity_id: "${gs_2_metrics}", attribute: vpd_target_min }
  - { platform: homeassistant, id: gs2_vpd_tgt_max, entity_id: "${gs_2_metrics}", attribute: vpd_target_max }
  - { platform: homeassistant, id: gs2_vpd_dng_min, entity_id: "${gs_2_metrics}", attribute: vpd_danger_min }
  - { platform: homeassistant, id: gs2_vpd_dng_max, entity_id: "${gs_2_metrics}", attribute: vpd_danger_max }
  - { platform: homeassistant, id: gs2_exhaust, entity_id: "${gs_2_exhaust}", attribute: percentage }
  - { platform: homeassistant, id: gs2_circ, entity_id: "${gs_2_circ}", attribute: percentage }

  # Space 3: Clone
  - { platform: homeassistant, id: gs3_vpd, entity_id: "${gs_3_vpd}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs3_temp, entity_id: "${gs_3_temp}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs3_hum, entity_id: "${gs_3_hum}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs3_vpd_tgt_min, entity_id: "${gs_3_metrics}", attribute: vpd_target_min }
  - { platform: homeassistant, id: gs3_vpd_tgt_max, entity_id: "${gs_3_metrics}", attribute: vpd_target_max }
  - { platform: homeassistant, id: gs3_vpd_dng_min, entity_id: "${gs_3_metrics}", attribute: vpd_danger_min }
  - { platform: homeassistant, id: gs3_vpd_dng_max, entity_id: "${gs_3_metrics}", attribute: vpd_danger_max }
  - { platform: homeassistant, id: gs3_exhaust, entity_id: "${gs_3_exhaust}", attribute: percentage }
  - { platform: homeassistant, id: gs3_circ, entity_id: "${gs_3_circ}", attribute: percentage }

  # Space 4: Mother
  - { platform: homeassistant, id: gs4_vpd, entity_id: "${gs_4_vpd}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs4_temp, entity_id: "${gs_4_temp}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs4_hum, entity_id: "${gs_4_hum}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs4_vpd_tgt_min, entity_id: "${gs_4_metrics}", attribute: vpd_target_min }
  - { platform: homeassistant, id: gs4_vpd_tgt_max, entity_id: "${gs_4_metrics}", attribute: vpd_target_max }
  - { platform: homeassistant, id: gs4_vpd_dng_min, entity_id: "${gs_4_metrics}", attribute: vpd_danger_min }
  - { platform: homeassistant, id: gs4_vpd_dng_max, entity_id: "${gs_4_metrics}", attribute: vpd_danger_max }
  - { platform: homeassistant, id: gs4_exhaust, entity_id: "${gs_4_exhaust}", attribute: percentage }
  - { platform: homeassistant, id: gs4_circ, entity_id: "${gs_4_circ}", attribute: percentage }

  # Space 5: Dry
  - { platform: homeassistant, id: gs5_vpd, entity_id: "${gs_5_vpd}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs5_temp, entity_id: "${gs_5_temp}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs5_hum, entity_id: "${gs_5_hum}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs5_vpd_tgt_min, entity_id: "${gs_5_metrics}", attribute: vpd_target_min }
  - { platform: homeassistant, id: gs5_vpd_tgt_max, entity_id: "${gs_5_metrics}", attribute: vpd_target_max }
  - { platform: homeassistant, id: gs5_vpd_dng_min, entity_id: "${gs_5_metrics}", attribute: vpd_danger_min }
  - { platform: homeassistant, id: gs5_vpd_dng_max, entity_id: "${gs_5_metrics}", attribute: vpd_danger_max }
  - { platform: homeassistant, id: gs5_exhaust, entity_id: "${gs_5_exhaust}", attribute: percentage }
  - { platform: homeassistant, id: gs5_circ, entity_id: "${gs_5_circ}", attribute: percentage }

  # Space 6: Cure
  - { platform: homeassistant, id: gs6_vpd, entity_id: "${gs_6_vpd}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs6_temp, entity_id: "${gs_6_temp}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs6_hum, entity_id: "${gs_6_hum}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs6_vpd_tgt_min, entity_id: "${gs_6_metrics}", attribute: vpd_target_min }
  - { platform: homeassistant, id: gs6_vpd_tgt_max, entity_id: "${gs_6_metrics}", attribute: vpd_target_max }
  - { platform: homeassistant, id: gs6_vpd_dng_min, entity_id: "${gs_6_metrics}", attribute: vpd_danger_min }
  - { platform: homeassistant, id: gs6_vpd_dng_max, entity_id: "${gs_6_metrics}", attribute: vpd_danger_max }
  - { platform: homeassistant, id: gs6_exhaust, entity_id: "${gs_6_exhaust}", attribute: percentage }
  - { platform: homeassistant, id: gs6_circ, entity_id: "${gs_6_circ}", attribute: percentage }

text_sensor:
  # Claude Code bridge (written by claude_bridge/claude_ha_bridge.py)
  - platform: homeassistant
    id: claude_status
    entity_id: input_text.claude_status
    on_value:
      - script.execute: update_ai_ui
  - platform: homeassistant
    id: claude_detail
    entity_id: input_text.claude_detail
    on_value:
      - script.execute: update_ai_ui
  - platform: homeassistant
    id: claude_request
    entity_id: input_text.claude_request
  - platform: homeassistant
    id: claude_steps
    entity_id: input_text.claude_steps
    on_value:
      - script.execute: update_ai_ui

  - { platform: homeassistant, id: gs0_phase, entity_id: "${gs_0_metrics}", attribute: granular_stage }
  - { platform: homeassistant, id: gs0_is_day, entity_id: "${gs_0_metrics}", attribute: is_day }
  - { platform: homeassistant, id: gs0_flower_week, entity_id: "${gs_0_metrics}", attribute: flower_week }
  - { platform: homeassistant, id: gs0_veg_week, entity_id: "${gs_0_metrics}", attribute: veg_week }
  - { platform: homeassistant, id: gs0_humid, entity_id: "${gs_0_humid}" }

  - { platform: homeassistant, id: gs1_phase, entity_id: "${gs_1_metrics}", attribute: granular_stage }
