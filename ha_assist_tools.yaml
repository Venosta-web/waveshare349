# Home Assistant Assist Tools & Local LLM Pipeline Reference
#
# Paste or !include the `script:` block below into your Home Assistant
# `configuration.yaml` (or `scripts.yaml`), then expose these scripts to Assist
# under Settings -> Voice assistants -> Expose.
#
# Recommended Local Assist Pipeline (100% local, no cloud):
#   1. STT: Wyoming Protocol -> faster-whisper (e.g., base.en or small)
#   2. Conversation Agent: Ollama -> tool-calling model (e.g., qwen2.5:7b or qwen3:8b)
#      - Enable "Control Home Assistant" so Ollama can invoke exposed entities/scripts.
#   3. TTS: Wyoming Protocol -> piper (e.g., en_US-lessac-medium)
#
# Expose these ESPHome entities to Assist:
#   - select.waveshare_349_voice_display_view   (Options: Growspace, Music, AI, Codex)
#   - select.waveshare_349_voice_output_mode    (Options: Onboard + HA Speakers, Onboard Only, HA Speakers Only, Display Only)
#   - media_player.music_assistant_player       (or your configured media_player for tts.speak)
#   - script.open_music_view_and_play
#   - script.switch_display_view
#   - script.send_to_claude
#
# Dual Output (Display Text + Speakers):
#   In `mod_voice.yaml`, `on_tts_start` displays the answer on the scrollable
#   voice overlay (held for `voice_answer_hold`, default 10s, or until tapped)
#   and routes TTS to:
#     - Onboard ES8311 speaker (`spk_i2s`) via the Assist Pipeline TTS stream
#     - Home Assistant / local AI TTS (`voice_tts_entity`, e.g. `tts.piper`) on
#       `voice_tts_speaker` (e.g. `media_player.music_assistant_player`) via `tts.speak`

script:
  switch_display_view:
    alias: "Switch ESP32 Display View"
    description: "Switch the Waveshare 3.49 screen to Growspace, Music, AI, or Codex view."
    fields:
      view:
        description: "Target view: Growspace, Music, AI, or Codex"
        required: true
        selector:
          select:
            options:
              - Growspace
              - Music
              - AI
              - Codex
    sequence:
      - service: select.select_option
        target:
          entity_id: select.waveshare_349_voice_display_view
        data:
          option: "{{ view }}"

  open_music_view_and_play:
    alias: "Open Music View and Play"
    description: "Switch the Waveshare 3.49 display to Music view and start/resume playing music."
    sequence:
      - service: select.select_option
        target:
          entity_id: select.waveshare_349_voice_display_view
        data:
          option: "Music"
      - service: media_player.media_play
        target:
          entity_id: media_player.music_assistant_player

  send_to_claude:
    alias: "Send Prompt to Claude Code"
    description: "Send a voice prompt, question, or answer to the active Claude Code Channel session."
    fields:
      prompt:
        description: "The prompt, instruction, or answer to send to Claude Code"
        required: true
        selector:
          text:
    sequence:
      - event: esphome.claude_command
        event_data:
          action: prompt
          text: "{{ prompt }}"
