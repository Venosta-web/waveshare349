# ============================================================================
# 3b. EXPOSED DISPLAY VIEW SELECT ENTITY (Controlled by HA Assist / Local LLM)
# ============================================================================
select:
  - platform: template
    id: display_view
    name: "Display View"
    icon: "mdi:monitor-dashboard"
    options:
      - "Growspace"
      - "Music"
      - "AI"
    initial_option: "Growspace"
    optimistic: true
    set_action:
      - lambda: |-
          int target = 0;
          if (x == "Music") target = 1;
          else if (x == "AI") target = 2;
          id(switch_tab).execute(target);

# ============================================================================
# 4. LVGL 480x320 UI (GitHub Dark Theme)
# ============================================================================
lvgl:
  log_level: INFO
  buffer_size: 100%
  full_refresh: true
  disp_bg_color: 0x0A0C10
  rotation: 90
  touchscreens:
    - touchscreen_id: my_touchscreen

  style_definitions:
    - id: header_style
      bg_color: 0x161B22
      bg_opa: COVER
      border_color: 0x30363D
      border_width: 1
      radius: 8
      pad_all: 0

    - id: nav_btn
      bg_color: 0x161B22
      bg_opa: COVER
      border_color: 0x30363D
      border_width: 1
      radius: 8
      pad_all: 0

    - id: nav_btn_active
      bg_color: 0x1F6FEB
      bg_opa: COVER
      border_color: 0x58A6FF
      border_width: 1
      radius: 8
      pad_all: 0

    - id: card_style
      bg_color: 0x161B22
      bg_opa: COVER
      border_color: 0x30363D
      border_width: 2
      radius: 12
      pad_all: 10

    - id: phase_badge
      bg_color: 0x333333
      bg_opa: COVER
      radius: 6
      pad_left: 8
      pad_right: 8
      pad_top: 2
      pad_bottom: 2
      border_width: 0

  pages:
    - id: home_page
      bg_color: 0x0A0C10
      widgets:
        # ── TOP HEADER BAR (468 x 36) ──────────────────────────────────────
        - obj:
            id: main_header_bar
            width: 468
            height: 36
            align: TOP_MID
            x: 0
            y: 6
            styles: header_style
            scrollbar_mode: "off"
            widgets:
              - label:
                  id: icon_wifi
                  text: "\U000F092F"
                  text_font: icons_24
                  text_color: 0xFFFFFF
                  align: LEFT_MID
                  x: 10
                  width: 24
                  text_align: CENTER
              - label:
                  id: text_wifi
                  text: "--%"
                  text_font: font_14
                  text_color: 0xFFFFFF
                  align: LEFT_MID
                  x: 38
              - label:
                  id: icon_paused
                  text: "\U000F03E4"
                  text_font: icons_20
                  text_color: 0xFFC107
                  align: CENTER
                  x: -44
                  hidden: true
              - label:
                  id: lbl_clock
                  text: "00:00"
                  text_font: font_20
                  text_color: 0xFFFFFF
                  align: CENTER
                  x: 0
              - label:
                  id: text_bat
                  text: "--%"
                  text_font: font_14
                  text_color: 0xFFFFFF
                  align: RIGHT_MID
                  x: -38
              - label:
                  id: icon_bat
                  text: "\U000F10CD"
                  text_font: icons_24
                  text_color: 0xFFFFFF
                  align: RIGHT_MID
                  x: -10

        # ── LEFT NAVIGATION RAIL (72 x 266) ────────────────────────────────
        - button:
            id: nav_grow
            width: 72
            height: 84
            align: TOP_LEFT
            x: 6
            y: 48
            styles: nav_btn_active
            widgets:
              - label:
                  id: nav_grow_icon
                  text: "\U000F0E66"
                  text_font: icons_20
                  text_color: 0xFFFFFF
                  align: TOP_MID
                  y: 18
              - label:
                  id: nav_grow_lbl
                  text: "GROW"
                  text_font: font_12
                  text_color: 0xFFFFFF
                  align: BOTTOM_MID
                  y: -14
            on_press:
              then:
                - if:
                    condition:
                      lambda: "return !id(wake_lock);"
                    then:
                      - script.execute:
                          id: switch_tab
                          tab_idx: 0

        - button:
            id: nav_music
            width: 72
            height: 84
            align: TOP_LEFT
            x: 6
            y: 139
            styles: nav_btn
            widgets:
              - label:
                  id: nav_music_icon
                  text: "\U000F0387"
                  text_font: icons_20
                  text_color: 0x8B949E
                  align: TOP_MID
                  y: 18
              - label:
                  id: nav_music_lbl
                  text: "MUSIC"
                  text_font: font_12
                  text_color: 0x8B949E
                  align: BOTTOM_MID
                  y: -14
            on_press:
              then:
                - if:
                    condition:
                      lambda: "return !id(wake_lock);"
                    then:
                      - script.execute:
                          id: switch_tab
                          tab_idx: 1

        - button:
            id: nav_ai
            width: 72
            height: 84
            align: TOP_LEFT
            x: 6
            y: 230
            styles: nav_btn
            widgets:
              - obj:
                  id: nav_clawd_box
                  width: 28
