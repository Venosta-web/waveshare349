substitutions:
  prefix: "panto"

  # ══════════════════════════════════════════════════════════════════════════
  # GROWSPACE CONFIGURATION (Direct HA Entities + Metrics Bridge Templates)
  # See ../Waveshare349/ha_metrics_bridge.yaml and docs/adr/0001-hybrid-ha-metrics-bridge.md
  # ══════════════════════════════════════════════════════════════════════════
  gs_count: "7"

  # Growspace 0: 4x4
  gs_0_name: "4x4"
  gs_0_metrics: "sensor.4x4_metrics_bridge"
  gs_0_vpd: "sensor.4x4_calculated_vpd"
  gs_0_temp: "sensor.4x4_temperature"
  gs_0_hum: "sensor.4x4_humidity"
  gs_0_exhaust: "fan.4x4_exhaust"
  gs_0_circ: "fan.4x4_circulation"
  gs_0_humid: "humidifier.4x4_humidifier"

  # Growspace 1: SOG 2x5
  gs_1_name: "SOG 2x5"
  gs_1_metrics: "sensor.sog_2x5_metrics_bridge"
  gs_1_vpd: "sensor.sog_2x5_calculated_vpd"
  gs_1_temp: "sensor.sog_2x5_temperature"
  gs_1_hum: "sensor.sog_2x5_humidity"
  gs_1_exhaust: "fan.sog_2x5_exhaust"
  gs_1_circ: "fan.sog_2x5_circulation"
  gs_1_humid: "humidifier.sog_2x5_humidifier"

  # Growspace 2: Nursery Dome
  gs_2_name: "Nursery Dome"
  gs_2_metrics: "sensor.nursery_dome_metrics_bridge"
  gs_2_vpd: "sensor.nursery_dome_calculated_vpd"
  gs_2_temp: "sensor.nursery_dome_temperature"
  gs_2_hum: "sensor.nursery_dome_humidity"
  gs_2_exhaust: "fan.nursery_dome_exhaust"
  gs_2_circ: "fan.nursery_dome_circulation"
  gs_2_humid: "humidifier.nursery_dome_humidifier"

  # Growspace 3: Clone
  gs_3_name: "Clone"
  gs_3_metrics: "sensor.clone_metrics_bridge"
  gs_3_vpd: "sensor.clone_calculated_vpd"
  gs_3_temp: "sensor.clone_temperature"
  gs_3_hum: "sensor.clone_humidity"
  gs_3_exhaust: "fan.clone_exhaust"
  gs_3_circ: "fan.clone_circulation"
  gs_3_humid: "humidifier.clone_humidifier"

  # Growspace 4: Mother
  gs_4_name: "Mother"
  gs_4_metrics: "sensor.mother_metrics_bridge"
  gs_4_vpd: "sensor.mother_calculated_vpd"
  gs_4_temp: "sensor.mother_temperature"
  gs_4_hum: "sensor.mother_humidity"
  gs_4_exhaust: "fan.mother_exhaust"
  gs_4_circ: "fan.mother_circulation"
  gs_4_humid: "humidifier.mother_humidifier"

  # Growspace 5: Dry
  gs_5_name: "Dry"
  gs_5_metrics: "sensor.dry_metrics_bridge"
  gs_5_vpd: "sensor.dry_calculated_vpd"
  gs_5_temp: "sensor.dry_temperature"
  gs_5_hum: "sensor.dry_humidity"
  gs_5_exhaust: "fan.dry_exhaust"
  gs_5_circ: "fan.dry_circulation"
  gs_5_humid: "humidifier.dry_humidifier"

  # Growspace 6: Cure
  gs_6_name: "Cure"
  gs_6_metrics: "sensor.cure_metrics_bridge"
  gs_6_vpd: "sensor.cure_calculated_vpd"
  gs_6_temp: "sensor.cure_temperature"
  gs_6_hum: "sensor.cure_humidity"
  gs_6_exhaust: "fan.cure_exhaust"
  gs_6_circ: "fan.cure_circulation"
  gs_6_humid: "humidifier.cure_humidifier"

  # Timing (cycle/pause in seconds; dim/sleep in minutes)
  cycle_interval: "15"
  pause_timeout: "25"
  dim_timeout: "5"
  sleep_timeout: "15"

  # Hardware entities
  battery_entity: "sensor.m2101k7bny_battery_level"

  # Music Assistant card: "deck" (vinyl turntable) or "studio" (EQ + meter console)
  music_variant: "studio"
  music_player_entity: "sensor.music_assistant_bridge"

  # Claude Code card: "stage" (mascot-forward) or "terminal" (CLI status line)
  claude_variant: "terminal"
  # Seconds the bridge waits for a tap (CLAUDE_HA_DECISION_TIMEOUT)
  claude_decision_timeout: "110"

  # VPD gauge scale
  vpd_gauge_min: "0.4"
  vpd_gauge_max: "1.8"

esphome:
  name: "infoscreen"
  project:
    name: "Guition.ESP32-Clean-UI"
    version: "480x320-Prototype"
  includes:
    - claude/clawd.h
  on_boot:
    priority: -100
    then:
      - lambda: "id(last_touch_ms) = millis();"
      - delay: 5s
      - script.execute: update_grow_ui
      - script.execute: update_music_ui

packages:
  claude: !include claude/${claude_variant}.yaml
  music_common: !include music/common.yaml
  music: !include music/${music_variant}.yaml

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "20480"
    advanced:
      execute_from_psram: true

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  on_client_connected:
    - delay: 1s
    - script.execute: update_grow_ui
    - script.execute: update_music_ui
    - script.execute: update_ai_ui

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${prefix}-fallback"
    password: "fallback_password"

# ============================================================================
# 1. HARDWARE (ESP32-S3 + AXS15231 320x480 rotated to 480x320 Landscape)
# ============================================================================
output:
  - platform: ledc
    pin: 1
    id: gpio_backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: "Display Backlight"
    id: display_backlight
    restore_mode: ALWAYS_ON

i2c:
  - id: bus_a
    sda: GPIO4
    scl: GPIO8
    scan: true

spi:
  - type: quad
    clk_pin: GPIO47
    data_pins: [21, 48, 40, 39]

touchscreen:
  - platform: axs15231
    id: my_touchscreen
    i2c_id: bus_a
    display: my_display
    # lvgl: rotation: 90 handles touch coordinate rotation automatically; do not add transform: swap_xy/mirror here.
    on_touch:
      - lambda: |-
          id(last_touch_ms) = millis();

          // Wake-lock: if screen is dimmed/sleeping, wake it and block accidental tap
          if (id(dim_state) != 0) {
            id(dim_state) = 0;
            id(wake_lock) = true;
            auto call = id(display_backlight).make_call();
            call.set_brightness(1.0f);
            call.perform();
            return;
          }

display:
  - id: my_display
    platform: qspi_dbi
    dimensions:
      width: 320
      height: 480
    model: AXS15231
    data_rate: 40MHz
    cs_pin: 45

binary_sensor:
  - platform: status
    id: ha_connected
    name: "HA Connected"
    on_release:
      then:
        - lvgl.label.update:
            id: icon_wifi
            text: "\U000F092F"
            text_color: 0xFF5252
        - lvgl.label.update:
            id: text_wifi
            text: "HA Offline"
            text_color: 0xFF5252
        - lambda: "lv_obj_invalidate(lv_scr_act());"
    on_press:
      then:
        - lvgl.label.update:
            id: icon_wifi
            text_color: 0xFFFFFF
        - lvgl.label.update:
            id: text_wifi
            text_color: 0xFFFFFF
        - lambda: |-
            float sig = id(wifi_sig).has_state() ? id(wifi_sig).state : -100;
            int pct = 0;
            if (sig >= -50) pct = 100;
            else if (sig <= -100) pct = 0;
            else pct = 2 * (sig + 100);
            lv_label_set_text(id(text_wifi), str_sprintf("%d%%", pct).c_str());
            const char* icon;
            if (sig >= -60) icon = "\U000F0928";
            else if (sig >= -70) icon = "\U000F0925";
            else if (sig >= -80) icon = "\U000F0922";
            else icon = "\U000F091F";
            lv_label_set_text(id(icon_wifi), icon);
            lv_obj_invalidate(lv_scr_act());

# ============================================================================
# 2. GLOBALS
# ============================================================================
globals:
  - id: vpd_sensor_index
    type: int
    initial_value: "0"
  - id: cycle_timer
    type: int
    initial_value: "${cycle_interval}"
  - id: cycle_paused
    type: bool
    initial_value: "false"
  - id: pause_timer
    type: int
    initial_value: "0"
  - id: gs_total
    type: int
    initial_value: "${gs_count}"
  - id: nav_direction
    type: int
    initial_value: "1"
  - id: last_touch_ms
    type: uint32_t
    initial_value: "0"
  - id: dim_state
    type: int
    initial_value: "0"
  - id: wake_lock
    type: bool
    initial_value: "false"
  - id: active_tab
    type: int
    initial_value: "0"

