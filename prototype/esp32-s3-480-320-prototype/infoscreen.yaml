  - { platform: homeassistant, id: gs5_exhaust, entity_id: "${gs_5_exhaust}", attribute: percentage }
  - { platform: homeassistant, id: gs5_circ, entity_id: "${gs_5_circ}", attribute: percentage }

  # Growspace 6: Cure
  - { platform: homeassistant, id: gs6_vpd, entity_id: "${gs_6_vpd}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs6_temp, entity_id: "${gs_6_temp}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs6_hum, entity_id: "${gs_6_hum}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs6_vpd_tgt_min, entity_id: "${gs_6_metrics}", attribute: vpd_target_min }
  - { platform: homeassistant, id: gs6_vpd_tgt_max, entity_id: "${gs_6_metrics}", attribute: vpd_target_max }
  - { platform: homeassistant, id: gs6_vpd_dng_min, entity_id: "${gs_6_metrics}", attribute: vpd_danger_min }
  - { platform: homeassistant, id: gs6_vpd_dng_max, entity_id: "${gs_6_metrics}", attribute: vpd_danger_max }
  - { platform: homeassistant, id: gs6_exhaust, entity_id: "${gs_6_exhaust}", attribute: percentage }
  - { platform: homeassistant, id: gs6_circ, entity_id: "${gs_6_circ}", attribute: percentage }

  # Battery
  - platform: homeassistant
    id: phone_battery
    entity_id: ${battery_entity}
    on_value:
      then:
        - lvgl.label.update:
            id: text_bat
            text: !lambda 'return str_sprintf("%.0f%%", x);'
        - lvgl.label.update:
            id: icon_bat
            text: !lambda |-
              if (x >= 90) return "\U000F0948";
              if (x >= 70) return "\U000F0946";
              if (x >= 50) return "\U000F0942";
              if (x >= 30) return "\U000F0940";
              return "\U000F10CD";
        - lambda: "lv_obj_invalidate(lv_scr_act());"

  # WiFi
  - platform: wifi_signal
    id: wifi_sig
    update_interval: 60s
    on_value:
      then:
        - lvgl.label.update:
            id: text_wifi
            text: !lambda |-
              int percent = 0;
              if (x >= -50) percent = 100;
              else if (x <= -100) percent = 0;
              else percent = 2 * (x + 100);
              return str_sprintf("%d%%", percent);
        - lvgl.label.update:
            id: icon_wifi
            text: !lambda |-
              if (x >= -60) return "\U000F0928";
              if (x >= -70) return "\U000F0925";
              if (x >= -80) return "\U000F0922";
              return "\U000F091F";
        - lambda: "lv_obj_invalidate(lv_scr_act());"

