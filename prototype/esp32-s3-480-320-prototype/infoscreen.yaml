# ============================================================================
# 6. SCRIPTS (Tab Switching, Growspace Navigation, Clock & VPD Rendering)
# ============================================================================
script:
  - id: switch_tab
    parameters:
      tab_idx: int
    then:
      - lambda: |-
          id(active_tab) = tab_idx;
          lv_obj_t* cards[] = { id(grow_card), id(music_card), id(ai_card) };
          lv_obj_t* btns[]  = { id(nav_grow), id(nav_music), id(nav_ai) };
          lv_obj_t* icons[] = { id(nav_grow_icon), id(nav_music_icon), nullptr };
          lv_obj_t* lbls[]  = { id(nav_grow_lbl), id(nav_music_lbl), id(nav_ai_lbl) };
          const char* opts[] = { "Growspace", "Music", "AI" };
          for (int i = 0; i < 3; i++) {
            const bool active = (i == tab_idx);
            const uint32_t fg = active ? 0xFFFFFF : 0x8B949E;
            if (active) {
              lv_obj_clear_flag(cards[i], LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_style_bg_color(btns[i], lv_color_hex(0x1F6FEB), 0);
              lv_obj_set_style_border_color(btns[i], lv_color_hex(0x58A6FF), 0);
            } else {
              lv_obj_add_flag(cards[i], LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_style_bg_color(btns[i], lv_color_hex(0x161B22), 0);
              lv_obj_set_style_border_color(btns[i], lv_color_hex(0x30363D), 0);
            }
            if (icons[i] != nullptr) lv_obj_set_style_text_color(icons[i], lv_color_hex(fg), 0);
            if (lbls[i] != nullptr) lv_obj_set_style_text_color(lbls[i], lv_color_hex(fg), 0);
          }
          if (tab_idx == 1) {
            // Keep Growspace auto-cycling paused while Music View is active
            id(cycle_paused) = true;
            id(pause_timer) = 3600;
          } else if (tab_idx == 0 && id(pause_timer) > ${pause_timeout}) {
            id(pause_timer) = ${pause_timeout};
          }
          if (tab_idx == 2) {
            lv_obj_add_flag(id(ai_alert_badge), LV_OBJ_FLAG_HIDDEN);
          }
          if (id(display_view).current_option() != opts[tab_idx]) {
            id(display_view).publish_state(opts[tab_idx]);
          }
          lv_obj_invalidate(lv_scr_act());
      - script.execute: update_pause_indicator

  - id: navigate_space
    then:
      - lambda: |-
          int total = id(gs_total);
          int dir = id(nav_direction);
          int idx = id(vpd_sensor_index);
          esphome::text_sensor::TextSensor* phase_s[] = {
            id(gs0_phase), id(gs1_phase), id(gs2_phase), id(gs3_phase),
            id(gs4_phase), id(gs5_phase), id(gs6_phase)
          };
          for (int i = 0; i < total; i++) {
            idx = (idx + dir + total) % total;
            if (phase_s[idx] != nullptr && phase_s[idx]->has_state() && phase_s[idx]->state != "empty") break;
          }
          id(vpd_sensor_index) = idx;
          id(cycle_timer) = ${cycle_interval};
          id(cycle_paused) = true;
          id(pause_timer) = ${pause_timeout};
      - script.execute: update_pause_indicator
      - script.execute: update_grow_ui

  - id: update_pause_indicator
    then:
      - if:
          condition:
            lambda: "return id(cycle_paused);"
          then:
            - lvgl.widget.update:
                id: gs_pause_icon
                hidden: false
            - lvgl.widget.update:
                id: icon_paused
                hidden: false
          else:
            - lvgl.widget.update:
                id: gs_pause_icon
                hidden: true
            - lvgl.widget.update:
                id: icon_paused
                hidden: true

  - id: update_clock
    then:
      - lvgl.label.update:
          id: lbl_clock
          text:
            format: "%02d:%02d"
            args:
              - "id(ha_time).now().hour"
              - "id(ha_time).now().minute"
      - lambda: "lv_obj_invalidate(lv_scr_act());"

  - id: update_grow_ui
    then:
      - lambda: |-
          const int MAX_SPACES = 7;
          int idx = id(vpd_sensor_index) % MAX_SPACES;

          const char* names[] = {
            "${gs_0_name}", "${gs_1_name}", "${gs_2_name}", "${gs_3_name}",
            "${gs_4_name}", "${gs_5_name}", "${gs_6_name}"
          };

          esphome::sensor::Sensor* vpd_s[] = { id(gs0_vpd), id(gs1_vpd), id(gs2_vpd), id(gs3_vpd), id(gs4_vpd), id(gs5_vpd), id(gs6_vpd) };
          esphome::sensor::Sensor* temp_s[] = { id(gs0_temp), id(gs1_temp), id(gs2_temp), id(gs3_temp), id(gs4_temp), id(gs5_temp), id(gs6_temp) };
          esphome::sensor::Sensor* hum_s[] = { id(gs0_hum), id(gs1_hum), id(gs2_hum), id(gs3_hum), id(gs4_hum), id(gs5_hum), id(gs6_hum) };
          esphome::sensor::Sensor* tgt_min_s[] = { id(gs0_vpd_tgt_min), id(gs1_vpd_tgt_min), id(gs2_vpd_tgt_min), id(gs3_vpd_tgt_min), id(gs4_vpd_tgt_min), id(gs5_vpd_tgt_min), id(gs6_vpd_tgt_min) };
          esphome::sensor::Sensor* tgt_max_s[] = { id(gs0_vpd_tgt_max), id(gs1_vpd_tgt_max), id(gs2_vpd_tgt_max), id(gs3_vpd_tgt_max), id(gs4_vpd_tgt_max), id(gs5_vpd_tgt_max), id(gs6_vpd_tgt_max) };
          esphome::sensor::Sensor* dng_min_s[] = { id(gs0_vpd_dng_min), id(gs1_vpd_dng_min), id(gs2_vpd_dng_min), id(gs3_vpd_dng_min), id(gs4_vpd_dng_min), id(gs5_vpd_dng_min), id(gs6_vpd_dng_min) };
          esphome::sensor::Sensor* dng_max_s[] = { id(gs0_vpd_dng_max), id(gs1_vpd_dng_max), id(gs2_vpd_dng_max), id(gs3_vpd_dng_max), id(gs4_vpd_dng_max), id(gs5_vpd_dng_max), id(gs6_vpd_dng_max) };
          esphome::sensor::Sensor* exh_s[] = { id(gs0_exhaust), id(gs1_exhaust), id(gs2_exhaust), id(gs3_exhaust), id(gs4_exhaust), id(gs5_exhaust), id(gs6_exhaust) };
          esphome::sensor::Sensor* circ_s[] = { id(gs0_circ), id(gs1_circ), id(gs2_circ), id(gs3_circ), id(gs4_circ), id(gs5_circ), id(gs6_circ) };

          esphome::text_sensor::TextSensor* humid_s[] = { id(gs0_humid), id(gs1_humid), id(gs2_humid), id(gs3_humid), id(gs4_humid), id(gs5_humid), id(gs6_humid) };
          esphome::text_sensor::TextSensor* phase_s[] = { id(gs0_phase), id(gs1_phase), id(gs2_phase), id(gs3_phase), id(gs4_phase), id(gs5_phase), id(gs6_phase) };
          esphome::text_sensor::TextSensor* day_s[] = { id(gs0_is_day), id(gs1_is_day), id(gs2_is_day), id(gs3_is_day), id(gs4_is_day), id(gs5_is_day), id(gs6_is_day) };
          esphome::text_sensor::TextSensor* fw_s[] = { id(gs0_flower_week), id(gs1_flower_week), id(gs2_flower_week), id(gs3_flower_week), id(gs4_flower_week), id(gs5_flower_week), id(gs6_flower_week) };
          esphome::text_sensor::TextSensor* vw_s[] = { id(gs0_veg_week), id(gs1_veg_week), id(gs2_veg_week), id(gs3_veg_week), id(gs4_veg_week), id(gs5_veg_week), id(gs6_veg_week) };

          auto is_valid = [](esphome::sensor::Sensor* s) -> bool {
            return s != nullptr && s->has_state() && std::isfinite(s->state);
          };

          auto resolve_vpd = [&](int space_idx, float& out_vpd) -> bool {
            if (is_valid(vpd_s[space_idx])) {
              out_vpd = vpd_s[space_idx]->state;
              return true;
            }
            if (is_valid(temp_s[space_idx]) && is_valid(hum_s[space_idx])) {
              float t = temp_s[space_idx]->state;
              float rh = hum_s[space_idx]->state;
              float svp = 0.61078f * expf((17.27f * t) / (t + 237.3f));
              float calc = svp * (1.0f - rh / 100.0f);
              out_vpd = calc < 0.0f ? 0.0f : calc;
              return true;
            }
            return false;
          };

          float vpd = 0.0f;
          bool has_vpd = resolve_vpd(idx, vpd);
          bool has_temp = is_valid(temp_s[idx]);
          bool has_hum = is_valid(hum_s[idx]);
          float temp = has_temp ? temp_s[idx]->state : 0.0f;
          float hum = has_hum ? hum_s[idx]->state : 0.0f;
          float tgt_min = is_valid(tgt_min_s[idx]) ? tgt_min_s[idx]->state : 0.8f;
          float tgt_max = is_valid(tgt_max_s[idx]) ? tgt_max_s[idx]->state : 1.2f;
          float dng_min = is_valid(dng_min_s[idx]) ? dng_min_s[idx]->state : 0.4f;
          float dng_max = is_valid(dng_max_s[idx]) ? dng_max_s[idx]->state : 1.6f;

          // Grow Stage badge
          std::string phase = (phase_s[idx] != nullptr && phase_s[idx]->has_state()) ? phase_s[idx]->state : "unknown";
          char badge[32] = "";
          uint32_t badge_color = 0x555555;
          if (phase.find("flower") != std::string::npos) {
            snprintf(badge, sizeof(badge), "Flower W%s", (fw_s[idx] != nullptr && fw_s[idx]->has_state()) ? fw_s[idx]->state.c_str() : "");
            badge_color = 0xFF9800;
          } else if (phase.find("veg") != std::string::npos) {
            snprintf(badge, sizeof(badge), "Veg W%s", (vw_s[idx] != nullptr && vw_s[idx]->has_state()) ? vw_s[idx]->state.c_str() : "");
            badge_color = 0x4CAF50;
          } else if (phase == "seedling") {
            snprintf(badge, sizeof(badge), "Seedling");
            badge_color = 0x8BC34A;
          } else if (phase == "clone") {
            snprintf(badge, sizeof(badge), "Clone");
            badge_color = 0xFF5722;
          } else if (phase == "mother") {
            snprintf(badge, sizeof(badge), "Mother");
            badge_color = 0xE91E63;
          } else if (phase == "dry") {
            snprintf(badge, sizeof(badge), "Drying");
            badge_color = 0x9C27B0;
          } else if (phase == "cure") {
            snprintf(badge, sizeof(badge), "Curing");
            badge_color = 0x2196F3;
          } else {
            snprintf(badge, sizeof(badge), "%s", phase.c_str());
          }

          lv_label_set_text(id(gs_name_lbl), names[idx]);
          lv_label_set_text(id(gs_phase_badge), badge);
          lv_obj_set_style_bg_color(id(gs_phase_badge), lv_color_hex(badge_color), 0);

          // Day / Night icon
          std::string day_str = (day_s[idx] != nullptr && day_s[idx]->has_state()) ? day_s[idx]->state : "on";
          bool is_day = (day_str == "on" || day_str == "True" || day_str == "true");
          lv_label_set_text(id(gs_day_icon), is_day ? "\U000F06B5" : "\U000F06B8");
          lv_obj_set_style_text_color(id(gs_day_icon), lv_color_hex(is_day ? 0xFFC107 : 0x555555), 0);

          // VPD Value & Status Color
          char buf[48];
          if (has_vpd) {
            snprintf(buf, sizeof(buf), "%.2f kPa", vpd);
            lv_label_set_text(id(gs_vpd_val), buf);
          } else {
            lv_label_set_text(id(gs_vpd_val), "-- kPa");
          }

          snprintf(buf, sizeof(buf), "Target\n%.1f - %.1f", tgt_min, tgt_max);
          lv_label_set_text(id(gs_vpd_range), buf);

          uint32_t sc;
          const char* si;
          if (!has_vpd) {
            sc = 0x6E7681; si = "\U000F012C";
          } else if (vpd >= tgt_min && vpd <= tgt_max) {
            sc = 0x4CAF50; si = "\U000F012C";
          } else if (vpd >= dng_min && vpd <= dng_max) {
            sc = 0xFFC107; si = "\U000F0029";
          } else {
            sc = 0xFF5252; si = "\U000F0159";
          }
          lv_label_set_text(id(gs_vpd_status), si);
          lv_obj_set_style_text_color(id(gs_vpd_status), lv_color_hex(sc), 0);

          // VPD Gauge Bar (366 px width)
          float gw = 366.0f, gmin = ${vpd_gauge_min}f, gmax = ${vpd_gauge_max}f, gr = gmax - gmin;
          float mp = has_vpd ? (vpd - gmin) / gr : 0.0f;
          if (mp < 0) mp = 0; if (mp > 1) mp = 1;
          lv_obj_set_x(id(gs_gauge_marker), (int)(mp * gw) - 4);
          lv_obj_set_style_bg_color(id(gs_gauge_marker), lv_color_hex(sc), 0);

          float zsp = (tgt_min - gmin) / gr, zep = (tgt_max - gmin) / gr;
          if (zsp < 0) zsp = 0; if (zep > 1) zep = 1;
          int zw = (int)((zep - zsp) * gw);
          if (zw < 4) zw = 4;
          lv_obj_set_x(id(gs_gauge_zone), (int)(zsp * gw));
          lv_obj_set_width(id(gs_gauge_zone), zw);

          // Temp & Humidity
          if (has_temp) {
            snprintf(buf, sizeof(buf), "%.1f °C", temp);
            lv_label_set_text(id(gs_temp_val), buf);
          } else {
            lv_label_set_text(id(gs_temp_val), "--.- °C");
          }
          if (has_hum) {
            snprintf(buf, sizeof(buf), "%.0f %%", hum);
            lv_label_set_text(id(gs_hum_val), buf);
          } else {
            lv_label_set_text(id(gs_hum_val), "-- %");
          }

          // Equipment readouts (nullptr-safe)
          if (exh_s[idx] == nullptr) {
            lv_label_set_text(id(gs_exh_lbl), "Exh: --");
            lv_obj_set_style_text_color(id(gs_exh_lbl), lv_color_hex(0x6E7681), 0);
          } else {
            float exh_v = is_valid(exh_s[idx]) ? exh_s[idx]->state : 0;
            snprintf(buf, sizeof(buf), exh_v > 0 ? "Exh: %.0f%%" : "Exh: Off", exh_v);
            lv_label_set_text(id(gs_exh_lbl), buf);
            lv_obj_set_style_text_color(id(gs_exh_lbl), lv_color_hex(exh_v > 0 ? 0x4CAF50 : 0x6E7681), 0);
          }

          if (circ_s[idx] == nullptr) {
            lv_label_set_text(id(gs_circ_lbl), "Circ: --");
            lv_obj_set_style_text_color(id(gs_circ_lbl), lv_color_hex(0x6E7681), 0);
          } else {
            float circ_v = is_valid(circ_s[idx]) ? circ_s[idx]->state : 0;
            snprintf(buf, sizeof(buf), circ_v > 0 ? "Circ: %.0f%%" : "Circ: Off", circ_v);
            lv_label_set_text(id(gs_circ_lbl), buf);
            lv_obj_set_style_text_color(id(gs_circ_lbl), lv_color_hex(circ_v > 0 ? 0x4CAF50 : 0x6E7681), 0);
          }

          if (humid_s[idx] == nullptr) {
            lv_label_set_text(id(gs_hum_eq_lbl), "Hum: --");
            lv_obj_set_style_text_color(id(gs_hum_eq_lbl), lv_color_hex(0x6E7681), 0);
          } else {
            bool hum_on = humid_s[idx]->has_state() && humid_s[idx]->state == "on";
            lv_label_set_text(id(gs_hum_eq_lbl), hum_on ? "Hum: On" : "Hum: Off");
            lv_obj_set_style_text_color(id(gs_hum_eq_lbl), lv_color_hex(hum_on ? 0x64B5F6 : 0x6E7681), 0);
          }

          // Global Danger Alert across all 7 growspaces
          bool global_danger = false;
          for (int i = 0; i < MAX_SPACES; i++) {
            if (phase_s[i] != nullptr && phase_s[i]->has_state() && phase_s[i]->state != "empty") {
              float v = 0.0f;
              if (!resolve_vpd(i, v)) continue;
              float d_min = is_valid(dng_min_s[i]) ? dng_min_s[i]->state : 0.4f;
              float d_max = is_valid(dng_max_s[i]) ? dng_max_s[i]->state : 1.6f;
              if (v < d_min || v > d_max) {
                global_danger = true;
                break;
              }
            }
          }
          lv_obj_set_style_border_color(id(grow_card), lv_color_hex(global_danger ? 0xFF5252 : 0x30363D), 0);
          lv_obj_set_style_border_color(id(main_header_bar), lv_color_hex(global_danger ? 0xFF5252 : 0x30363D), 0);
          lv_obj_invalidate(lv_scr_act());

# ============================================================================
# 7. INTERVALS (Auto-Cycle, Wake-Lock Clear, Auto-Dim/Sleep)
# ============================================================================
interval:
  # 1s tick: Growspace cycle & pause countdown
  - interval: 1s
    then:
      - lambda: |-
          if (!id(cycle_paused)) {
            if (id(cycle_timer) > 0) {
              id(cycle_timer)--;
              int bw = (id(cycle_timer) * 256) / ${cycle_interval};
              lv_obj_set_width(id(grow_countdown_bar), bw > 0 ? bw : 1);
              lv_obj_set_style_bg_color(id(grow_countdown_bar), lv_color_hex(0x00D1FF), 0);
            }
          } else {
            if (id(pause_timer) > 0) {
              id(pause_timer)--;
              int pbw = (id(pause_timer) * 256) / ${pause_timeout};
              if (pbw > 256) pbw = 256;
              lv_obj_set_width(id(grow_countdown_bar), pbw > 0 ? pbw : 1);
              lv_obj_set_style_bg_color(id(grow_countdown_bar), lv_color_hex(0xFFC107), 0);
            } else {
              id(cycle_paused) = false;
              id(cycle_timer) = ${cycle_interval};
              lv_obj_set_style_bg_color(id(grow_countdown_bar), lv_color_hex(0x00D1FF), 0);
            }
          }
      - if:
          condition:
            lambda: "return !id(cycle_paused) && id(cycle_timer) == ${cycle_interval};"
          then:
            - script.execute: update_pause_indicator
      - if:
          condition:
            lambda: "return id(cycle_timer) == 0 && !id(cycle_paused);"
          then:
            - lambda: "id(nav_direction) = 1;"
            - script.execute: navigate_space
            - lambda: "id(cycle_paused) = false;"
            - script.execute: update_pause_indicator

  # Wake-lock clearing (300ms guard after waking from dim/sleep)
  - interval: 100ms
    then:
      - lambda: |-
          if (id(wake_lock)) {
            if (millis() - id(last_touch_ms) > 300) {
              id(wake_lock) = false;
            }
          }

  # Auto-dim & sleep backlight on inactivity
  - interval: 5s
    then:
      - lambda: |-
          uint32_t elapsed_s = (millis() - id(last_touch_ms)) / 1000;
          int new_state = 0;
          if (elapsed_s > ${sleep_timeout} * 60) new_state = 2;
          else if (elapsed_s > ${dim_timeout} * 60) new_state = 1;
          if (new_state != id(dim_state)) {
            id(dim_state) = new_state;
            auto call = id(display_backlight).make_call();
            if (new_state == 2) call.set_brightness(0.05f);
            else if (new_state == 1) call.set_brightness(0.3f);
            else call.set_brightness(1.0f);
            call.perform();
          }
