                        radius: 2

              # Bottom Right: Prev / Next Growspace Buttons
              - button:
                  id: btn_prev_space
                  width: 44
                  height: 54
                  align: BOTTOM_RIGHT
                  x: -50
                  y: 0
                  bg_color: 0x21262D
                  border_color: 0x30363D
                  border_width: 1
                  radius: 8
                  widgets:
                    - label:
                        text: "\U000F0141"
                        text_font: icons_24
                        align: CENTER
                  on_press:
                    then:
                      - if:
                          condition:
                            lambda: "return !id(wake_lock);"
                          then:
                            - lambda: "id(nav_direction) = -1;"
                            - script.execute: navigate_space

              - button:
                  id: btn_next_space
                  width: 44
                  height: 54
                  align: BOTTOM_RIGHT
                  x: 0
                  y: 0
                  bg_color: 0x21262D
                  border_color: 0x30363D
                  border_width: 1
                  radius: 8
                  widgets:
                    - label:
                        text: "\U000F0142"
                        text_font: icons_24
                        align: CENTER
                  on_press:
                    then:
                      - if:
                          condition:
                            lambda: "return !id(wake_lock);"
                          then:
                            - lambda: "id(nav_direction) = 1;"
                            - script.execute: navigate_space

        # ── CARD 2: MUSIC ASSISTANT (Hidden initially) ───────────────────────
        # Widgets live in music/<variant>_card.yaml, logic in music/<variant>.yaml.
        - obj: !include music/${music_variant}_card.yaml

        # ── CARD 3: CLAUDE CODE (Hidden initially) ─────────────────────────
        # Widgets live in claude/<variant>_card.yaml, logic in claude/<variant>.yaml.
        - obj: !include claude/${claude_variant}_card.yaml

# ============================================================================
# 5. HOME ASSISTANT SENSORS (All 7 Growspaces + Clock + Battery + WiFi)
# ============================================================================
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - script.execute: update_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock

sensor:
