  - { platform: homeassistant, id: gs4_circ, entity_id: "${gs_4_circ}", attribute: percentage }

  # Growspace 5: Dry
  - { platform: homeassistant, id: gs5_vpd, entity_id: "${gs_5_vpd}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs5_temp, entity_id: "${gs_5_temp}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs5_hum, entity_id: "${gs_5_hum}", on_value: [script.execute: update_grow_ui] }
  - { platform: homeassistant, id: gs5_vpd_tgt_min, entity_id: "${gs_5_metrics}", attribute: vpd_target_min }
