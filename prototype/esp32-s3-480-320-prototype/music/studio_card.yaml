# Variant B, "Studio": Broadcast / Equalizer Console with 12-band spectrum, mono timecodes, and segmented volume meter.
# Content box is 366 x 242 (390 x 266 card, 2 px border, 10 px padding).
id: music_card
width: 390
height: 266
align: TOP_RIGHT
x: -6
y: 48
styles: card_style
bg_color: 0x0D1117
hidden: true
scrollbar_mode: "off"
widgets:
  # ── Top Header: Track + Artist (left), Player Pill + Album (right) ────────
  - label:
      id: ma_title_lbl
      text: "Nothing Playing"
      text_font: font_20
      text_color: 0xF0F6FC
      align: TOP_LEFT
      x: 0
      y: 0
      width: 236
      height: 24
      long_mode: SCROLL_CIRCULAR

  - label:
      id: ma_artist_lbl
      text: "Music Assistant"
      text_font: font_14
      text_color: 0x58A6FF
      align: TOP_LEFT
      x: 0
      y: 26
      width: 236
      height: 18
      long_mode: DOT

  - obj:
      id: ma_player_pill
      width: 122
      height: 22
      align: TOP_RIGHT
      x: 0
      y: 1
      bg_color: 0x161B22
      bg_opa: COVER
      border_color: 0x30363D
      border_width: 1
      radius: 6
      pad_all: 0
      scrollbar_mode: "off"
      widgets:
        - obj:
            id: ma_state_dot
            width: 8
            height: 8
            align: LEFT_MID
            x: 7
            bg_color: 0x6E7681
            bg_opa: COVER
            border_width: 0
            radius: 4
        - label:
            id: ma_player_lbl
            text: "Music Assistant"
            text_font: font_12
            text_color: 0xC9D1D9
            align: LEFT_MID
            x: 20
            width: 96
            long_mode: DOT

  - label:
      id: ma_album_lbl
      text: ""
      text_font: font_12
      text_color: 0x6E7681
      align: TOP_RIGHT
      x: 0
      y: 27
      width: 122
      text_align: RIGHT
      long_mode: DOT

  # ── 12-Band Spectrum Strip (y: 54..90) ────────────────────────────────────
  - obj:
      id: ma_eq_box
      width: 366
      height: 36
      align: TOP_LEFT
      x: 0
      y: 54
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      scrollbar_mode: "off"
      widgets:
        - obj: { id: ma_eq_0,  width: 24, height: 4, align: BOTTOM_LEFT, x: 6,   bg_color: 0x3FB950, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_eq_1,  width: 24, height: 4, align: BOTTOM_LEFT, x: 36,  bg_color: 0x3FB950, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_eq_2,  width: 24, height: 4, align: BOTTOM_LEFT, x: 66,  bg_color: 0x2EA043, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_eq_3,  width: 24, height: 4, align: BOTTOM_LEFT, x: 96,  bg_color: 0x39C5CF, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_eq_4,  width: 24, height: 4, align: BOTTOM_LEFT, x: 126, bg_color: 0x39C5CF, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_eq_5,  width: 24, height: 4, align: BOTTOM_LEFT, x: 156, bg_color: 0x58A6FF, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_eq_6,  width: 24, height: 4, align: BOTTOM_LEFT, x: 186, bg_color: 0x58A6FF, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_eq_7,  width: 24, height: 4, align: BOTTOM_LEFT, x: 216, bg_color: 0x79C0FF, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_eq_8,  width: 24, height: 4, align: BOTTOM_LEFT, x: 246, bg_color: 0xA371F7, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_eq_9,  width: 24, height: 4, align: BOTTOM_LEFT, x: 276, bg_color: 0xA371F7, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_eq_10, width: 24, height: 4, align: BOTTOM_LEFT, x: 306, bg_color: 0xBC8CFF, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_eq_11, width: 24, height: 4, align: BOTTOM_LEFT, x: 336, bg_color: 0xD2A8FF, bg_opa: COVER, border_width: 0, radius: 2 }

  # ── Mono Timecodes & Progress Bar (y: 100..130) ───────────────────────────
  - label:
      id: ma_pos_lbl
      text: "0:00"
      text_font: studio_mono_12
      text_color: 0xC9D1D9
      align: TOP_LEFT
      x: 0
      y: 100

  - label:
      id: ma_state_lbl
      text: "IDLE"
      text_font: studio_mono_12
      text_color: 0x6E7681
      align: TOP_LEFT
      x: 103
      y: 100
      width: 160
      text_align: CENTER

  - label:
      id: ma_dur_lbl
      text: "0:00"
      text_font: studio_mono_12
      text_color: 0x6E7681
      align: TOP_RIGHT
      x: 0
      y: 100
      width: 56
      text_align: RIGHT

  - bar:
      id: ma_prog_bar
      width: 366
      height: 8
      align: TOP_LEFT
      x: 0
      y: 120
      min_value: 0
      max_value: 1000
      value: 0
      bg_color: 0x161B22
      bg_opa: COVER
      radius: 4
      indicator:
        bg_color: 0x3FB950
        bg_opa: COVER
        radius: 4

  # ── Transport Dock (y: 140..186) ──────────────────────────────────────────
  - button:
      id: btn_ma_shuffle
      width: 52
      height: 46
      align: TOP_LEFT
      x: 0
      y: 140
      bg_color: 0x161B22
      border_color: 0x30363D
      border_width: 1
      radius: 8
      widgets:
        - label:
            id: lbl_ma_shuffle
            text: "\U000F049D"
            text_font: ma_icons_20
            text_color: 0x6E7681
            align: CENTER
      on_click:
        then:
          - if:
              condition:
                lambda: "return !id(wake_lock);"
              then:
                - script.execute: ma_action_shuffle

  - button:
      id: btn_ma_prev
      width: 62
      height: 46
      align: TOP_LEFT
      x: 60
      y: 140
      bg_color: 0x161B22
      border_color: 0x30363D
      border_width: 1
      radius: 8
      widgets:
        - label:
            text: "\U000F04AE"
            text_font: ma_icons_24
            text_color: 0xF0F6FC
            align: CENTER
      on_click:
        then:
          - if:
              condition:
                lambda: "return !id(wake_lock);"
              then:
                - script.execute: ma_action_prev

  - button:
      id: btn_ma_play
      width: 106
      height: 46
      align: TOP_LEFT
      x: 130
      y: 140
      bg_color: 0x238636
      border_color: 0x2EA043
      border_width: 1
      radius: 8
      widgets:
        - label:
            id: lbl_ma_play
            text: "\U000F040A"
            text_font: ma_icons_24
            text_color: 0xFFFFFF
            align: CENTER
      on_click:
        then:
          - if:
              condition:
                lambda: "return !id(wake_lock);"
              then:
                - script.execute: ma_action_play_pause

  - button:
      id: btn_ma_next
      width: 62
      height: 46
      align: TOP_LEFT
      x: 244
      y: 140
      bg_color: 0x161B22
      border_color: 0x30363D
      border_width: 1
      radius: 8
      widgets:
        - label:
            text: "\U000F04AD"
            text_font: ma_icons_24
            text_color: 0xF0F6FC
            align: CENTER
      on_click:
        then:
          - if:
              condition:
                lambda: "return !id(wake_lock);"
              then:
                - script.execute: ma_action_next

  - button:
      id: btn_ma_repeat
      width: 52
      height: 46
      align: TOP_LEFT
      x: 314
      y: 140
      bg_color: 0x161B22
      border_color: 0x30363D
      border_width: 1
      radius: 8
      widgets:
        - label:
            id: lbl_ma_repeat
            text: "\U000F0456"
            text_font: ma_icons_20
            text_color: 0x6E7681
            align: CENTER
      on_click:
        then:
          - if:
              condition:
                lambda: "return !id(wake_lock);"
              then:
                - script.execute: ma_action_repeat

  # ── Volume & Segmented Meter Dock (y: 196..242) ───────────────────────────
  - button:
      id: btn_ma_mute
      width: 52
      height: 46
      align: TOP_LEFT
      x: 0
      y: 196
      bg_color: 0x161B22
      border_color: 0x30363D
      border_width: 1
      radius: 8
      widgets:
        - label:
            id: lbl_ma_mute_icon
            text: "\U000F057E"
            text_font: ma_icons_20
            text_color: 0xC9D1D9
            align: CENTER
      on_click:
        then:
          - if:
              condition:
                lambda: "return !id(wake_lock);"
              then:
                - script.execute: ma_action_mute

  - button:
      id: btn_ma_vol_down
      width: 52
      height: 46
      align: TOP_LEFT
      x: 60
      y: 196
      bg_color: 0x161B22
      border_color: 0x30363D
      border_width: 1
      radius: 8
      widgets:
        - label:
            text: "\U000F075E"
            text_font: ma_icons_20
            text_color: 0xC9D1D9
            align: CENTER
      on_click:
        then:
          - if:
              condition:
                lambda: "return !id(wake_lock);"
              then:
                - script.execute: ma_action_vol_down

  - obj:
      id: ma_vol_meter_box
      width: 186
      height: 46
      align: TOP_LEFT
      x: 120
      y: 196
      bg_color: 0x161B22
      bg_opa: COVER
      border_color: 0x30363D
      border_width: 1
      radius: 8
      pad_all: 0
      scrollbar_mode: "off"
      widgets:
        - label:
            id: ma_vol_lbl
            text: "VOL 50%"
            text_font: studio_mono_12
            text_color: 0xC9D1D9
            align: TOP_MID
            y: 5
        - obj: { id: ma_vol_seg_0, width: 30, height: 10, align: TOP_LEFT, x: 8,   y: 27, bg_color: 0x3FB950, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_vol_seg_1, width: 30, height: 10, align: TOP_LEFT, x: 43,  y: 27, bg_color: 0x3FB950, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_vol_seg_2, width: 30, height: 10, align: TOP_LEFT, x: 78,  y: 27, bg_color: 0x3FB950, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_vol_seg_3, width: 30, height: 10, align: TOP_LEFT, x: 113, y: 27, bg_color: 0x21262D, bg_opa: COVER, border_width: 0, radius: 2 }
        - obj: { id: ma_vol_seg_4, width: 30, height: 10, align: TOP_LEFT, x: 148, y: 27, bg_color: 0x21262D, bg_opa: COVER, border_width: 0, radius: 2 }

  - button:
      id: btn_ma_vol_up
      width: 52
      height: 46
      align: TOP_LEFT
      x: 314
      y: 196
      bg_color: 0x161B22
      border_color: 0x30363D
      border_width: 1
      radius: 8
      widgets:
        - label:
            text: "\U000F075D"
            text_font: ma_icons_20
            text_color: 0xC9D1D9
            align: CENTER
      on_click:
        then:
          - if:
              condition:
                lambda: "return !id(wake_lock);"
              then:
                - script.execute: ma_action_vol_up
