# Shared Music Assistant media_player bindings, globals, icons, and actions.
# Included by waveshare_sim.yaml alongside music/${music_variant}.yaml.

globals:
  - id: ma_pos_sec
    type: int
    initial_value: "0"
  - id: ma_dur_sec
    type: int
    initial_value: "0"
  - id: ma_is_playing
    type: bool
    initial_value: "false"
  - id: ma_shuffle_on
    type: bool
    initial_value: "false"
  - id: ma_repeat_mode
    type: int # 0=off, 1=all, 2=one
    initial_value: "0"
  - id: ma_muted
    type: bool
    initial_value: "false"
  - id: ma_vol_pct
    type: int
    initial_value: "50"

font:
  - file: "../fonts/materialdesignicons-webfont.ttf"
    id: ma_icons_20
    size: 20
    bpp: 4
    glyphs:
      - "\U000F040A" # play
      - "\U000F03E4" # pause
      - "\U000F04AE" # skip-previous
      - "\U000F04AD" # skip-next
      - "\U000F049D" # shuffle
      - "\U000F0456" # repeat
      - "\U000F0458" # repeat-once
      - "\U000F057E" # volume-high
      - "\U000F0580" # volume-medium
      - "\U000F0581" # volume-off
      - "\U000F075E" # volume-minus
      - "\U000F075D" # volume-plus
      - "\U000F0387" # music-note
      - "\U000F04C3" # speaker

  - file: "../fonts/materialdesignicons-webfont.ttf"
    id: ma_icons_24
    size: 24
    bpp: 4
    glyphs:
      - "\U000F040A" # play
      - "\U000F03E4" # pause
      - "\U000F04AE" # skip-previous
      - "\U000F04AD" # skip-next

text_sensor:
  - platform: homeassistant
    id: ma_state
    entity_id: "${music_player_entity}"
    on_value:
      - script.execute: update_music_ui

  - platform: homeassistant
    id: ma_title
    entity_id: "${music_player_entity}"
    attribute: media_title
    on_value:
      - script.execute: update_music_ui

  - platform: homeassistant
    id: ma_artist
    entity_id: "${music_player_entity}"
    attribute: media_artist
    on_value:
      - script.execute: update_music_ui

  - platform: homeassistant
    id: ma_album
    entity_id: "${music_player_entity}"
    attribute: media_album_name
    on_value:
      - script.execute: update_music_ui

  - platform: homeassistant
    id: ma_friendly_name
    entity_id: "${music_player_entity}"
    attribute: friendly_name
    on_value:
      - script.execute: update_music_ui

  - platform: homeassistant
    id: ma_shuffle
    entity_id: "${music_player_entity}"
    attribute: shuffle
    on_value:
      - script.execute: update_music_ui

  - platform: homeassistant
    id: ma_repeat
    entity_id: "${music_player_entity}"
    attribute: repeat
    on_value:
      - script.execute: update_music_ui

  - platform: homeassistant
    id: ma_is_muted
    entity_id: "${music_player_entity}"
    attribute: is_volume_muted
    on_value:
      - script.execute: update_music_ui

sensor:
  - platform: homeassistant
    id: ma_duration
    entity_id: "${music_player_entity}"
    attribute: media_duration
    on_value:
      - lambda: |-
          if (std::isfinite(x) && x >= 0.0f) id(ma_dur_sec) = (int)x;
      - script.execute: update_music_progress

  - platform: homeassistant
    id: ma_position
    entity_id: "${music_player_entity}"
    attribute: media_position
    on_value:
      - lambda: |-
          if (std::isfinite(x) && x >= 0.0f) id(ma_pos_sec) = (int)x;
      - script.execute: update_music_progress

  - platform: homeassistant
    id: ma_volume
    entity_id: "${music_player_entity}"
    attribute: volume_level
    on_value:
      - lambda: |-
          if (std::isfinite(x)) {
            int p = (int)(x * 100.0f + 0.5f);
            if (p < 0) p = 0;
            if (p > 100) p = 100;
            id(ma_vol_pct) = p;
          }
      - script.execute: update_music_ui

script:
  - id: update_music_progress
    then:
      - lambda: |-
          int pos = id(ma_pos_sec);
          int dur = id(ma_dur_sec);
          if (pos < 0) pos = 0;
          if (dur > 0 && pos > dur) pos = dur;

          char pbuf[16], dbuf[16];
          snprintf(pbuf, sizeof(pbuf), "%d:%02d", pos / 60, pos % 60);
          snprintf(dbuf, sizeof(dbuf), "%d:%02d", dur / 60, dur % 60);
          lv_label_set_text(id(ma_pos_lbl), pbuf);
          lv_label_set_text(id(ma_dur_lbl), dbuf);

          int pct = (dur > 0) ? (pos * 1000) / dur : 0;
          if (pct < 0) pct = 0;
          if (pct > 1000) pct = 1000;
          lv_bar_set_value(id(ma_prog_bar), pct, LV_ANIM_OFF);

  - id: ma_action_play_pause
    then:
      - lambda: |-
          id(ma_is_playing) = !id(ma_is_playing);
      - script.execute: update_music_ui
      - homeassistant.action:
          action: media_player.media_play_pause
          data:
            entity_id: "${music_player_entity}"

  - id: ma_action_prev
    then:
      - homeassistant.action:
          action: media_player.media_previous_track
          data:
            entity_id: "${music_player_entity}"

  - id: ma_action_next
    then:
      - homeassistant.action:
          action: media_player.media_next_track
          data:
            entity_id: "${music_player_entity}"

  - id: ma_action_shuffle
    then:
      - lambda: |-
          id(ma_shuffle_on) = !id(ma_shuffle_on);
      - script.execute: update_music_ui
      - homeassistant.action:
          action: media_player.shuffle_set
          data:
            entity_id: "${music_player_entity}"
            shuffle: !lambda "return id(ma_shuffle_on) ? \"true\" : \"false\";"

  - id: ma_action_repeat
    then:
      - lambda: |-
          id(ma_repeat_mode) = (id(ma_repeat_mode) + 1) % 3;
      - script.execute: update_music_ui
      - homeassistant.action:
          action: media_player.repeat_set
          data:
            entity_id: "${music_player_entity}"
            repeat: !lambda |-
              if (id(ma_repeat_mode) == 1) return "all";
              if (id(ma_repeat_mode) == 2) return "one";
              return "off";

  - id: ma_action_mute
    then:
      - lambda: |-
          id(ma_muted) = !id(ma_muted);
      - script.execute: update_music_ui
      - homeassistant.action:
          action: media_player.volume_mute
          data:
            entity_id: "${music_player_entity}"
            is_volume_muted: !lambda "return id(ma_muted) ? \"true\" : \"false\";"

  - id: ma_action_vol_up
    then:
      - lambda: |-
          id(ma_muted) = false;
          id(ma_vol_pct) = (id(ma_vol_pct) + 5 > 100) ? 100 : id(ma_vol_pct) + 5;
      - script.execute: update_music_ui
      - homeassistant.action:
          action: media_player.volume_up
          data:
            entity_id: "${music_player_entity}"

  - id: ma_action_vol_down
    then:
      - lambda: |-
          id(ma_vol_pct) = (id(ma_vol_pct) - 5 < 0) ? 0 : id(ma_vol_pct) - 5;
      - script.execute: update_music_ui
      - homeassistant.action:
          action: media_player.volume_down
          data:
            entity_id: "${music_player_entity}"

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: "return id(ma_is_playing);"
          then:
            - lambda: |-
                if (id(ma_dur_sec) <= 0 || id(ma_pos_sec) < id(ma_dur_sec)) {
                  id(ma_pos_sec)++;
                }
            - script.execute: update_music_progress
