# Home Assistant Template Sensors — Growspace Manager Metrics Bridge
#
# Flattens the nested `metrics` dictionary from Growspace Manager v1.3.1+
# Overview Sensors into top-level attributes so ESPHome can subscribe to them.
#
# Include this in your Home Assistant `configuration.yaml` (e.g. via packages)
# and adjust the source `sensor.<growspace>` entity IDs if yours differ.

template:
  - sensor:
      - name: "4x4 Metrics Bridge"
        unique_id: gs_4x4_metrics_bridge
        state: "{{ (state_attr('sensor.4x4', 'metrics') or {}).get('granular_stage', 'unknown') }}"
        attributes:
          granular_stage: "{{ (state_attr('sensor.4x4', 'metrics') or {}).get('granular_stage', 'unknown') }}"
          is_day: "{{ (state_attr('sensor.4x4', 'metrics') or {}).get('is_day', true) }}"
          flower_week: "{{ (state_attr('sensor.4x4', 'metrics') or {}).get('flower_week', 0) }}"
          veg_week: "{{ (state_attr('sensor.4x4', 'metrics') or {}).get('veg_week', 0) }}"
          vpd_target_min: "{{ (state_attr('sensor.4x4', 'metrics') or {}).get('vpd_target_min') }}"
          vpd_target_max: "{{ (state_attr('sensor.4x4', 'metrics') or {}).get('vpd_target_max') }}"
          vpd_danger_min: "{{ (state_attr('sensor.4x4', 'metrics') or {}).get('vpd_danger_min') }}"
          vpd_danger_max: "{{ (state_attr('sensor.4x4', 'metrics') or {}).get('vpd_danger_max') }}"

