# Variant A, "Stage" — logic for codex/stage_card.yaml.
# Pulled in by waveshare_349.yaml / waveshare_sim.yaml as packages: codex: !include codex/${codex_variant}.yaml

font:
  - file: "fonts/DejaVuSans-Bold.ttf"
    id: codex_glyph_20
    size: 20
    bpp: 4
    glyphs: "·✢✳✶✻✽✓✕!?zZ"
  - file: "fonts/DejaVuSans-Bold.ttf"
    id: codex_glyph_14
    size: 14
    bpp: 4
    glyphs: "·›○✓"

script:
  # Renders the Codex card from the codex_* helpers. A pending request reveals
  # Approve/Reject, jumps to the Codex tab and pauses the growspace cycle.
  - id: update_codex_ui
    mode: queued
    then:
      - lambda: |-
          std::string status = id(codex_status).state;
          std::string detail = id(codex_detail).state;
          if (status == "unknown" || status == "unavailable") status = "";
          if (detail == "unknown" || detail == "unavailable") detail = "";
          codex_pet::set_mode(codex_pet::parse_status(status), millis());
          if (codex_pet::g_mode == codex_pet::RATE_LIMITED) {
            codex_pet::parse_rate_limit_detail(detail, millis());
          } else {
            codex_pet::split_detail(detail);
          }
          codex_pet::parse_steps(id(codex_steps).state);
          const bool pending = codex_pet::g_mode == codex_pet::PENDING;
          const bool rate_limited = codex_pet::g_mode == codex_pet::RATE_LIMITED;
          const bool show_steps = codex_pet::g_step_total > 0 && !pending && !rate_limited && codex_pet::g_mode != codex_pet::NEEDS_INPUT;

          static const char *const WORDS[] = {"Idle", "Working", "Needs approval", "Needs input", "Done", "Approved", "Rejected", "Rate limited"};
          lv_label_set_text(id(lbl_codex_status), WORDS[codex_pet::g_mode]);
          lv_obj_set_style_text_color(id(lbl_codex_status), lv_color_hex(codex_pet::accent(codex_pet::g_mode)), 0);

          if (codex_pet::g_project.empty()) {
            lv_obj_add_flag(id(lbl_codex_project), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_label_set_text(id(lbl_codex_project), codex_pet::g_project.c_str());
            lv_obj_clear_flag(id(lbl_codex_project), LV_OBJ_FLAG_HIDDEN);
          }
          const char *text = codex_pet::g_text.empty()
              ? (codex_pet::g_mode == codex_pet::IDLE ? "Waiting for Codex"
                 : rate_limited ? (codex_pet::g_rl_is_7d ? "7-day usage limit reached" : "5-hour usage limit reached")
                 : "")
              : codex_pet::g_text.c_str();
          lv_label_set_text(id(lbl_codex_detail), text);

          if (rate_limited) {
            lv_obj_clear_flag(id(codex_rl_box), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_y(id(codex_rl_box), codex_pet::g_project.empty() ? 38 : 56);
            lv_obj_set_y(id(lbl_codex_detail), codex_pet::g_project.empty() ? 92 : 108);
            lv_obj_set_height(id(lbl_codex_detail), codex_pet::g_project.empty() ? 48 : 32);
            lv_obj_set_style_text_color(id(lbl_codex_detail), lv_color_hex(0x8B949E), 0);
          } else {
            lv_obj_add_flag(id(codex_rl_box), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_y(id(lbl_codex_detail), codex_pet::g_project.empty() ? 34 : 58);
            lv_obj_set_height(id(lbl_codex_detail), pending ? 32 : (codex_pet::g_project.empty() ? 82 : 66));
            lv_obj_set_style_text_color(id(lbl_codex_detail), lv_color_hex(0xC9D1D9), 0);
          }

          lv_obj_t *step_objs[] = {
              id(lbl_codex_step_count), id(lbl_codex_step_now_icon), id(lbl_codex_step_now),
              id(lbl_codex_step_next_icon), id(lbl_codex_step_next)
          };
          if (show_steps) {
            const uint32_t acc = codex_pet::accent(codex_pet::g_mode);
            const bool all_done = codex_pet::g_mode == codex_pet::DONE && codex_pet::g_step_cur == codex_pet::g_step_total;
            lv_obj_add_flag(id(lbl_codex_detail), LV_OBJ_FLAG_HIDDEN);
            for (auto *o : step_objs) lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);

            char cbuf[24];
            snprintf(cbuf, sizeof(cbuf), "%d/%d", codex_pet::g_step_cur, codex_pet::g_step_total);
            lv_label_set_text(id(lbl_codex_step_count), cbuf);
            lv_obj_set_style_text_color(id(lbl_codex_step_count), lv_color_hex(acc), 0);

            lv_label_set_text(id(lbl_codex_step_now_icon), all_done ? "✓" : "›");
            lv_obj_set_style_text_color(id(lbl_codex_step_now_icon), lv_color_hex(acc), 0);
            lv_label_set_text(id(lbl_codex_step_now), codex_pet::g_step_now.c_str());

            if (!codex_pet::g_step_next.empty()) {
              lv_label_set_text(id(lbl_codex_step_next_icon), "○");
              lv_obj_set_style_text_color(id(lbl_codex_step_next_icon), lv_color_hex(0x6E7681), 0);
              lv_label_set_text(id(lbl_codex_step_next), codex_pet::g_step_next.c_str());
              lv_obj_set_style_text_color(id(lbl_codex_step_next), lv_color_hex(0x8B949E), 0);
            } else if (all_done) {
              char dbuf[48];
              snprintf(dbuf, sizeof(dbuf), "All %d steps complete", codex_pet::g_step_total);
              lv_label_set_text(id(lbl_codex_step_next_icon), "✓");
              lv_obj_set_style_text_color(id(lbl_codex_step_next_icon), lv_color_hex(0x3FB950), 0);
              lv_label_set_text(id(lbl_codex_step_next), dbuf);
              lv_obj_set_style_text_color(id(lbl_codex_step_next), lv_color_hex(0x8B949E), 0);
            } else {
              lv_label_set_text(id(lbl_codex_step_next_icon), "·");
              lv_obj_set_style_text_color(id(lbl_codex_step_next_icon), lv_color_hex(0x6E7681), 0);
              lv_label_set_text(id(lbl_codex_step_next), "Final step");
              lv_obj_set_style_text_color(id(lbl_codex_step_next), lv_color_hex(0x6E7681), 0);
            }
          } else {
            lv_obj_clear_flag(id(lbl_codex_detail), LV_OBJ_FLAG_HIDDEN);
            for (auto *o : step_objs) lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          }

          if (pending) {
            lv_obj_clear_flag(id(btn_codex_approve), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(btn_codex_reject), LV_OBJ_FLAG_HIDDEN);
            id(cycle_paused) = true;
            id(pause_timer) = 3600;
          } else {
            lv_obj_add_flag(id(btn_codex_approve), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(btn_codex_reject), LV_OBJ_FLAG_HIDDEN);
            if (id(pause_timer) > ${pause_timeout}) id(pause_timer) = ${pause_timeout};
          }
          id(codex_tick).execute();
      - if:
          condition:
            lambda: "return codex_pet::g_mode == codex_pet::PENDING;"
          then:
            - lvgl.widget.update:
                id: codex_alert_badge
                hidden: false
            - if:
                condition:
                  lambda: "return id(active_tab) != 1;"
                then:
                  - script.execute:
                      id: switch_tab
                      tab_idx: 3

  # Immediate feedback after a tap, before HA echoes the new state back.
  - id: codex_sent
    parameters:
      verdict: std::string
    then:
      - lambda: |-
          lv_obj_add_flag(id(btn_codex_approve), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(btn_codex_reject), LV_OBJ_FLAG_HIDDEN);
          codex_pet::set_mode(verdict == "Approved" ? codex_pet::SENT_OK : codex_pet::SENT_NO, millis());
          lv_label_set_text(id(lbl_codex_status), verdict.c_str());
          lv_obj_set_style_text_color(id(lbl_codex_status), lv_color_hex(codex_pet::accent(codex_pet::g_mode)), 0);
          lv_obj_set_height(id(lbl_codex_detail), codex_pet::g_project.empty() ? 82 : 66);
          id(codex_tick).execute();

  # One animation frame. Runs at 10 Hz; nav icon always updates, card only while Codex tab is up.
  - id: codex_tick
    then:
      - lambda: |-
          using namespace codex_pet;
          tick_nav(id(nav_codex_box));
          static Puppet p;
          if (p.root == nullptr) build(p, id(codex_pet_box), 7);
          if (lv_obj_has_flag(id(codex_card), LV_OBJ_FLAG_HIDDEN)) return;

          const uint32_t f = g_frame, t = g_frame - g_mode_frame, now = millis();
          const uint32_t acc = accent(g_mode);
          apply(p, animate(g_mode, f, t, p.u), g_mode, f);

          // Spinner: sparkle while working, a still mark otherwise.
          const char *spin = g_mode == WORKING ? spinner(f)
                           : g_mode == codex_pet::PENDING || g_mode == NEEDS_INPUT ? "✻"
                           : g_mode == RATE_LIMITED ? "!"
                           : g_mode == DONE || g_mode == SENT_OK ? "✓"
                           : g_mode == SENT_NO ? "✕" : "·";
          lv_label_set_text(id(codex_spin), spin);
          lv_obj_set_style_text_color(id(codex_spin), lv_color_hex(acc), 0);

          // Bubble over Byte's head.
          lv_obj_t *b = id(codex_bubble);
          int by = 12;
          switch (g_mode) {
            case IDLE: {
              uint32_t k = f % 30;
              lv_label_set_text(b, k < 15 ? "z" : "Z");
              by = 30 - (int) k;
              lv_obj_set_style_bg_opa(b, LV_OPA_TRANSP, 0);
              lv_obj_set_style_text_color(b, lv_color_hex(0x6E7681), 0);
              lv_obj_set_style_text_opa(b, k < 22 ? LV_OPA_COVER : (lv_opa_t) (255 - (k - 22) * 30), 0);
              lv_obj_clear_flag(b, LV_OBJ_FLAG_HIDDEN);
              break;
            }
            case codex_pet::PENDING:
            case NEEDS_INPUT:
            case DONE:
            case SENT_OK:
            case SENT_NO: {
              lv_label_set_text(b, g_mode == codex_pet::PENDING ? "!" : g_mode == NEEDS_INPUT ? "?" : g_mode == SENT_NO ? "✕" : "✓");
              lv_obj_set_style_bg_opa(b, LV_OPA_COVER, 0);
              lv_obj_set_style_bg_color(b, lv_color_hex(acc), 0);
              lv_obj_set_style_text_color(b, lv_color_hex(0x0A0C10), 0);
              lv_obj_set_style_text_opa(b, LV_OPA_COVER, 0);
              by = 12 - ((f / 5) % 2);
              bool show = !(g_mode == DONE && (t < 6 || t > 80));
              if (show) lv_obj_clear_flag(b, LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(b, LV_OBJ_FLAG_HIDDEN);
              break;
            }
            default:
              lv_obj_add_flag(b, LV_OBJ_FLAG_HIDDEN);
          }
          lv_obj_set_y(b, by);

          // Clock: elapsed while working, time left on a pending request, run length when done.
          char buf[32] = "";
          if (g_mode == WORKING || g_mode == NEEDS_INPUT || g_mode == SENT_OK || g_mode == SENT_NO) {
            fmt_elapsed(buf, sizeof(buf), now - g_work_start);
          } else if (g_mode == codex_pet::PENDING) {
            uint32_t gone = now - g_pending_start, total = ${codex_decision_timeout} * 1000;
            uint32_t left = gone < total ? total - gone : 0;
            snprintf(buf, sizeof(buf), "%us left", (unsigned) ((left + 999) / 1000));
          } else if (g_mode == DONE && g_last_run > 0) {
            char d[16];
            fmt_elapsed(d, sizeof(d), g_last_run);
            snprintf(buf, sizeof(buf), "took %s", d);
          } else if (g_mode == RATE_LIMITED) {
            snprintf(buf, sizeof(buf), "%s", g_rl_is_7d ? "7D LIMIT" : "5H LIMIT");
          }
          lv_label_set_text(id(lbl_codex_time), buf);
          lv_obj_set_style_text_color(id(lbl_codex_time), lv_color_hex(g_mode == RATE_LIMITED ? 0xFF7B72 : 0x8B949E), 0);

          // Rate-limit countdown & draining progress bar.
          uint64_t rl_left = 0;
          if (g_mode == RATE_LIMITED) {
            rl_left = rl_left_ms(now);
            char cbuf[32];
            fmt_countdown(cbuf, sizeof(cbuf), rl_left);
            if (rl_left == 0) {
              lv_label_set_text(id(lbl_codex_rl_countdown), "Ready (0s)");
              lv_obj_set_style_text_color(id(lbl_codex_rl_countdown), lv_color_hex(0x3FB950), 0);
              lv_obj_set_width(id(codex_rl_fill), 0);
            } else {
              lv_label_set_text(id(lbl_codex_rl_countdown), cbuf);
              lv_obj_set_style_text_color(id(lbl_codex_rl_countdown), lv_color_hex(0xF0F6FC), 0);
              int w = (int) ((374ULL * rl_left) / g_rl_total_ms);
              if (w < 4) w = 4;
              if (w > 374) w = 374;
              lv_obj_set_width(id(codex_rl_fill), w);
              uint32_t fill_col = (rl_left * 10 <= g_rl_total_ms) ? 0xFFB020 : 0xF85149;
              lv_obj_set_style_bg_color(id(codex_rl_fill), lv_color_hex(fill_col), 0);
            }
            if (g_rl_reset_at.empty()) {
              lv_label_set_text(id(lbl_codex_rl_reset), "");
            } else {
              char rbuf[48];
              snprintf(rbuf, sizeof(rbuf), "Resets %s", g_rl_reset_at.c_str());
              lv_label_set_text(id(lbl_codex_rl_reset), rbuf);
            }
          }

          // Activity line.
          lv_obj_t *track = id(codex_track), *fill = id(codex_track_fill);
          if (g_mode == WORKING) {
            lv_obj_clear_flag(track, LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_y(track, 134);
            int span = 376 + 96, k = (int) (f % 24);
            float e = k / 24.0f;
            e = e < 0.5f ? 2 * e * e : 1 - 2 * (1 - e) * (1 - e);
            lv_obj_set_width(fill, 96);
            lv_obj_set_x(fill, (int) (e * span) - 96);
            lv_obj_set_style_bg_color(fill, lv_color_hex(BODY), 0);
          } else if (g_mode == codex_pet::PENDING) {
            lv_obj_clear_flag(track, LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_y(track, 90);
            uint32_t gone = now - g_pending_start, total = ${codex_decision_timeout} * 1000;
            int w = gone < total ? (int) (376.0f * (total - gone) / total) : 0;
            lv_obj_set_width(fill, w < 4 ? 4 : w);
            lv_obj_set_x(fill, 0);
            lv_obj_set_style_bg_color(fill, lv_color_hex(acc), 0);
          } else {
            lv_obj_add_flag(track, LV_OBJ_FLAG_HIDDEN);
          }

          // Border: breathes amber while a request waits, resting otherwise.
          uint32_t border = 0x30363D;
          if (g_mode == codex_pet::PENDING) border = (f / 5) % 2 ? 0xFFB020 : 0x8A5D12;
          else if (g_mode == NEEDS_INPUT) border = 0x6E5BA8;
          else if (g_mode == SENT_OK) border = 0x2EA043;
          else if (g_mode == SENT_NO) border = 0xF85149;
          else if (g_mode == RATE_LIMITED) border = rl_left == 0 ? 0x2EA043 : 0x9E3632;
          lv_obj_set_style_border_color(id(codex_card), lv_color_hex(border), 0);
          // Stage light: cool emerald-dark while Byte is awake, dims crimson on rate limit.
          uint32_t stage_bg = g_mode == IDLE ? 0x0D1117 : g_mode == RATE_LIMITED ? 0x1B1114 : 0x0F1C18;
          lv_obj_set_style_bg_color(id(codex_stage), lv_color_hex(stage_bg), 0);

interval:
  - interval: 100ms
    then:
      - lambda: "codex_pet::g_frame++;"
      - script.execute: codex_tick
