# Variation 3, "Terminal": Monospace Telemetry HUD
# Matches claude/terminal & codex/terminal with phosphor-inspired monospace readouts.
id: idle_lock_overlay
width: 640
height: 172
align: TOP_LEFT
x: 0
y: 0
bg_color: 0x05080B
bg_opa: COVER
border_color: 0x1E293B
border_width: 1
radius: 0
pad_all: 0
scrollbar_mode: "off"
hidden: true
clickable: true
on_click:
  then:
    - script.execute: unlock_idle_screen
widgets:
  # ── TOP STATUS STRIP ──────────────────────────────────────────────────────
  - label:
      id: term_lock_icon
      text: "\U000F033E"
      text_font: term_icons_14
      text_color: 0x58A6FF
      align: TOP_LEFT
      x: 16
      y: 10

  - label:
      id: term_status_lbl
      text: "IDLE LOCK // 5M TIMEOUT"
      text_font: term_mono_12b
      text_color: 0x8B949E
      align: TOP_LEFT
      x: 36
      y: 10

  - label:
      text: "[TAP TO WAKE]"
      text_font: term_mono_12b
      text_color: 0x58A6FF
      align: TOP_RIGHT
      x: -16
      y: 10

  - obj:
      width: 608
      height: 1
      align: TOP_LEFT
      x: 16
      y: 32
      bg_color: 0x1B2430
      bg_opa: COVER
      border_width: 0
      radius: 0
      clickable: false

  # ── MAIN READOUT ROW: CLOCK (LEFT) & TELEMETRY (RIGHT) ────────────────────
  - label:
      id: term_time_lbl
      text: "16:43"
      text_font: term_time_56
      text_color: 0xE6EDF3
      align: TOP_LEFT
      x: 18
      y: 48

  - label:
      id: term_sec_lbl
      text: ":00"
      text_font: term_sec_26
      text_color: 0x3FB950
      align: TOP_LEFT
      x: 200
      y: 72

  - obj:
      width: 1
      height: 86
      align: TOP_LEFT
      x: 274
      y: 42
      bg_color: 0x1B2430
      bg_opa: COVER
      border_width: 0
      radius: 0
      clickable: false

  - label:
      id: term_bat_lbl
      text: "BAT [########..]  84%"
      text_font: term_mono_16b
      text_color: 0x3FB950
      align: TOP_LEFT
      x: 292
      y: 46

  - label:
      id: term_wifi_lbl
      text: "NET [####] -54dBm  OK"
      text_font: term_mono_16b
      text_color: 0x58A6FF
      align: TOP_LEFT
      x: 292
      y: 75

  - label:
      id: term_ssid_lbl
      text: "SSID: Connecting..."
      text_font: term_mono_13
      text_color: 0x8B949E
      width: 328
      long_mode: DOT
      align: TOP_LEFT
      x: 292
      y: 105

  # ── BOTTOM HAIRLINE & ARMED WAKE SOURCES ──────────────────────────────────
  - obj:
      width: 608
      height: 1
      align: TOP_LEFT
      x: 16
      y: 136
      bg_color: 0x1B2430
      bg_opa: COVER
      border_width: 0
      radius: 0
      clickable: false

  - label:
      id: term_date_lbl
      text: "2026-11-15  SUN"
      text_font: term_mono_12
      text_color: 0x8B949E
      align: TOP_LEFT
      x: 16
      y: 145

  - label:
      text: "WAKE: CLAUDE · CODEX · VOICE"
      text_font: term_mono_12
      text_color: 0x58A6FF
      align: TOP_RIGHT
      x: -16
      y: 145
