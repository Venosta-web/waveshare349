# Variation 1, "Chronograph": Swiss Precision Instrument / Braun-inspired Dark Chronograph
# Full-screen 640 x 172 lock/idle overlay.
id: idle_lock_overlay
width: 640
height: 172
align: TOP_LEFT
x: 0
y: 0
bg_color: 0x07090D
bg_opa: COVER
border_width: 0
radius: 0
pad_all: 0
scrollbar_mode: "off"
hidden: true
clickable: true
on_click:
  then:
    - script.execute: unlock_idle_screen
widgets:
  # ── LEFT TIME ZONE ────────────────────────────────────────────────────────
  - label:
      id: chrono_date_lbl
      text: "SUN · NOV 15"
      text_font: chrono_meta_12
      text_color: 0x8B949E
      align: TOP_LEFT
      x: 26
      y: 18

  - label:
      id: chrono_time_lbl
      text: "16:43"
      text_font: chrono_time_72
      text_color: 0xF0F4F8
      align: TOP_LEFT
      x: 24
      y: 38

  - label:
      id: chrono_sec_lbl
      text: ":00"
      text_font: chrono_sec_28
      text_color: 0xF59E0B
      align: TOP_LEFT
      x: 262
      y: 52

  # 60-second precision progress track
  - obj:
      id: chrono_sec_track
      width: 348
      height: 4
      align: TOP_LEFT
      x: 26
      y: 128
      bg_color: 0x161B22
      bg_opa: COVER
      border_width: 0
      radius: 2
      pad_all: 0
      clickable: false
      scrollbar_mode: "off"
      widgets:
        - obj:
            id: chrono_sec_bar
            width: 0
            height: 4
            align: LEFT_MID
            x: 0
            y: 0
            bg_color: 0xF59E0B
            bg_opa: COVER
            border_width: 0
            radius: 2
            clickable: false

  - label:
      id: chrono_lock_icon
      text: "\U000F033F"
      text_font: chrono_icons_14
      text_color: 0x6E7681
      align: TOP_LEFT
      x: 26
      y: 144

  - label:
      id: chrono_unlock_hint
      text: "TAP TO UNLOCK"
      text_font: chrono_meta_12
      text_color: 0x6E7681
      align: TOP_LEFT
      x: 46
      y: 144

  # ── VERTICAL HAIRLINE DIVIDER ─────────────────────────────────────────────
  - obj:
      width: 1
      height: 136
      align: TOP_LEFT
      x: 396
      y: 18
      bg_color: 0x1E242E
      bg_opa: COVER
      border_width: 0
      radius: 0
      clickable: false

  # ── RIGHT TELEMETRY BAY: BATTERY ──────────────────────────────────────────
  - label:
      id: chrono_bat_icon
      text: "\U000F0081"
      text_font: icons_20
      text_color: 0x3FB950
      align: TOP_LEFT
      x: 416
      y: 18

  - label:
      text: "BATTERY"
      text_font: chrono_meta_12
      text_color: 0x8B949E
      align: TOP_LEFT
      x: 442
      y: 21

  - label:
      id: chrono_bat_pct
      text: "--%"
      text_font: font_20
      text_color: 0xF0F4F8
      align: TOP_RIGHT
      x: -20
      y: 16

  - obj:
      id: chrono_bat_track
      width: 204
      height: 8
      align: TOP_LEFT
      x: 416
      y: 48
      bg_color: 0x161B22
      bg_opa: COVER
      border_width: 0
      radius: 4
      pad_all: 0
      clickable: false
      scrollbar_mode: "off"
      widgets:
        - obj:
            id: chrono_bat_fill
            width: 0
            height: 8
            align: LEFT_MID
            x: 0
            y: 0
            bg_color: 0x3FB950
            bg_opa: COVER
            border_width: 0
            radius: 4
            clickable: false

  - label:
      id: chrono_bat_state
      text: "MONITORING"
      text_font: chrono_meta_12
      text_color: 0x6E7681
      align: TOP_LEFT
      x: 416
      y: 63

  # ── HORIZONTAL HAIRLINE ───────────────────────────────────────────────────
  - obj:
      width: 204
      height: 1
      align: TOP_LEFT
      x: 416
      y: 88
      bg_color: 0x1E242E
      bg_opa: COVER
      border_width: 0
      radius: 0
      clickable: false

  # ── RIGHT TELEMETRY BAY: WI-FI ────────────────────────────────────────────
  - label:
      id: chrono_wifi_icon
      text: "\U000F0928"
      text_font: icons_20
      text_color: 0x58A6FF
      align: TOP_LEFT
      x: 416
      y: 100

  - label:
      text: "WI-FI"
      text_font: chrono_meta_12
      text_color: 0x8B949E
      align: TOP_LEFT
      x: 442
      y: 103

  - label:
      id: chrono_wifi_rssi
      text: "-- dBm"
      text_font: font_14
      text_color: 0xF0F4F8
      align: TOP_RIGHT
      x: -20
      y: 102

  - label:
      id: chrono_wifi_ssid
      text: "Connecting..."
      text_font: font_14
      text_color: 0xC9D1D9
      width: 132
      long_mode: DOT
      align: TOP_LEFT
      x: 416
      y: 132

  - label:
      id: chrono_wifi_badge
      text: "OFFLINE"
      text_font: chrono_meta_12
      text_color: 0xFF5252
      align: TOP_RIGHT
      x: -20
      y: 134
