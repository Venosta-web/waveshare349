# Variant "terminal_campfire" (Terminal Starlit Campfire) — logic for claude/terminal_campfire_card.yaml.
# Pulled in by waveshare_sim.yaml as packages: claude: !include claude/${claude_variant}.yaml

font:
  - file: "../fonts/DejaVuSansMono-Bold.ttf"
    id: mono_16b
    size: 16
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~·✢✳✶✻✽✓✕…"
  - file: "../fonts/DejaVuSansMono.ttf"
    id: mono_14
    size: 14
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°•…›○✓"
  - file: "../fonts/DejaVuSansMono.ttf"
    id: mono_12
    size: 12
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~·…○✓"

script:
  # Renders the AI card from the claude_* helpers. A pending request reveals
  # Approve/Reject, jumps to the AI tab and pauses the growspace cycle.
  - id: update_ai_ui
    mode: queued
    then:
      - lambda: |-
          std::string status = id(claude_status).state;
          std::string detail = id(claude_detail).state;
          if (status == "unknown" || status == "unavailable") status = "";
          if (detail == "unknown" || detail == "unavailable") detail = "";
          clawd::set_mode(clawd::parse_status(status), millis());
          if (clawd::g_mode == clawd::RATE_LIMITED) {
            clawd::parse_rate_limit_detail(detail, millis());
          } else {
            clawd::split_detail(detail);
          }
          clawd::parse_steps(id(claude_steps).state);
          const bool pending = clawd::g_mode == clawd::PENDING;
          const bool rate_limited = clawd::g_mode == clawd::RATE_LIMITED;
          const bool show_steps = clawd::g_step_total > 0 && !pending && !rate_limited && clawd::g_mode != clawd::NEEDS_INPUT;

          if (rate_limited && !clawd::g_rl_reset_at.empty()) {
            char rbuf[48];
            snprintf(rbuf, sizeof(rbuf), "Resets %s", clawd::g_rl_reset_at.c_str());
            lv_label_set_text(id(lbl_claude_project), rbuf);
          } else {
            lv_label_set_text(id(lbl_claude_project), clawd::g_project.c_str());
          }
          const char *text = clawd::g_text.empty()
              ? (clawd::g_mode == clawd::IDLE ? "Waiting for Claude Code"
                 : rate_limited ? (clawd::g_rl_is_7d ? "7-day usage limit reached" : "5-hour usage limit reached")
                 : "")
              : clawd::g_text.c_str();
          lv_label_set_text(id(lbl_agent_detail), text);

          if (rate_limited) {
            lv_obj_clear_flag(id(claude_rl_track), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(claude_rl_track), LV_OBJ_FLAG_HIDDEN);
          }

          const bool show_7d_wing = rate_limited && !clawd::g_rl_is_7d && clawd::g_rl_7d_left_pct >= 0;
          if (show_7d_wing) {
            char sub[64], pct7[20], rst7[48];
            if (!clawd::g_rl_reset_at.empty()) {
              snprintf(sub, sizeof(sub), "Weekly quota still available · resets %s", clawd::g_rl_reset_at.c_str());
            } else {
              snprintf(sub, sizeof(sub), "Weekly quota still available");
            }
            lv_label_set_text(id(lbl_rl_sub), sub);

            snprintf(pct7, sizeof(pct7), "%d%% left", clawd::g_rl_7d_left_pct);
            lv_label_set_text(id(lbl_rl_7d_pct), pct7);
            uint32_t col7 = clawd::g_rl_7d_left_pct > 25 ? 0x3FB950 : 0xFFB020;
            lv_obj_set_style_text_color(id(lbl_rl_7d_pct), lv_color_hex(col7), 0);
            lv_obj_set_style_bg_color(id(claude_rl_7d_fill), lv_color_hex(col7), 0);

            int w7 = (222 * clawd::g_rl_7d_left_pct) / 100;
            if (clawd::g_rl_7d_left_pct > 0 && w7 < 4) w7 = 4;
            if (w7 > 222) w7 = 222;
            lv_obj_set_width(id(claude_rl_7d_fill), w7);

            if (!clawd::g_rl_7d_reset_at.empty()) {
              snprintf(rst7, sizeof(rst7), "resets %s", clawd::g_rl_7d_reset_at.c_str());
            } else {
              rst7[0] = 0;
            }
            lv_label_set_text(id(lbl_rl_7d_reset), rst7);

            lv_obj_clear_flag(id(lbl_rl_sub), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(claude_rl_5h_wing), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(claude_rl_7d_wing), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(lbl_rl_sub), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(claude_rl_5h_wing), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(claude_rl_7d_wing), LV_OBJ_FLAG_HIDDEN);
          }

          lv_obj_t *step_objs[] = {
              id(lbl_step_now_icon), id(lbl_step_now), id(lbl_step_count),
              id(lbl_step_next_icon), id(lbl_step_next), id(step_progress_bg)
          };
          if (show_steps) {
            const uint32_t acc = clawd::accent(clawd::g_mode);
            const bool all_done = clawd::g_mode == clawd::DONE && clawd::g_step_cur == clawd::g_step_total;
            lv_obj_add_flag(id(claude_caret), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_agent_detail), LV_OBJ_FLAG_HIDDEN);
            for (auto *o : step_objs) lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);

            char cbuf[24];
            snprintf(cbuf, sizeof(cbuf), "%d/%d", clawd::g_step_cur, clawd::g_step_total);
            lv_label_set_text(id(lbl_step_count), cbuf);
            lv_obj_set_style_text_color(id(lbl_step_count), lv_color_hex(acc), 0);

            lv_label_set_text(id(lbl_step_now_icon), all_done ? "✓" : "›");
            lv_obj_set_style_text_color(id(lbl_step_now_icon), lv_color_hex(acc), 0);
            lv_label_set_text(id(lbl_step_now), clawd::g_step_now.c_str());

            if (!clawd::g_step_next.empty()) {
              lv_label_set_text(id(lbl_step_next_icon), "○");
              lv_obj_set_style_text_color(id(lbl_step_next_icon), lv_color_hex(0x6E7681), 0);
              lv_label_set_text(id(lbl_step_next), clawd::g_step_next.c_str());
              lv_obj_set_style_text_color(id(lbl_step_next), lv_color_hex(0x8B949E), 0);
            } else if (all_done) {
              char dbuf[48];
              snprintf(dbuf, sizeof(dbuf), "All %d steps complete", clawd::g_step_total);
              lv_label_set_text(id(lbl_step_next_icon), "✓");
              lv_obj_set_style_text_color(id(lbl_step_next_icon), lv_color_hex(0x3FB950), 0);
              lv_label_set_text(id(lbl_step_next), dbuf);
              lv_obj_set_style_text_color(id(lbl_step_next), lv_color_hex(0x8B949E), 0);
            } else {
              lv_label_set_text(id(lbl_step_next_icon), "·");
              lv_obj_set_style_text_color(id(lbl_step_next_icon), lv_color_hex(0x6E7681), 0);
              lv_label_set_text(id(lbl_step_next), "Final step");
              lv_obj_set_style_text_color(id(lbl_step_next), lv_color_hex(0x6E7681), 0);
            }
            int fill_w = (536 * clawd::g_step_cur) / clawd::g_step_total;
            lv_obj_set_width(id(step_progress_fill), fill_w);
            lv_obj_set_style_bg_color(id(step_progress_fill), lv_color_hex(acc), 0);
          } else {
            lv_obj_clear_flag(id(claude_caret), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(lbl_agent_detail), LV_OBJ_FLAG_HIDDEN);
            for (auto *o : step_objs) lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          }

          if (pending) {
            lv_obj_clear_flag(id(btn_claude_approve), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(btn_claude_reject), LV_OBJ_FLAG_HIDDEN);
            id(cycle_paused) = true;
            id(pause_timer) = 3600;
          } else {
            lv_obj_add_flag(id(btn_claude_approve), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(btn_claude_reject), LV_OBJ_FLAG_HIDDEN);
            if (id(pause_timer) > ${pause_timeout}) id(pause_timer) = ${pause_timeout};
          }
          id(claude_tick).execute();
      - if:
          condition:
            lambda: "return clawd::g_mode == clawd::PENDING;"
          then:
            - lvgl.widget.update:
                id: ai_alert_badge
                hidden: false
            - if:
                condition:
                  lambda: "return id(active_tab) != 1;"
                then:
                  - script.execute:
                      id: switch_tab
                      tab_idx: 2

  # Immediate feedback after a tap, before HA echoes the new state back.
  - id: claude_sent
    parameters:
      verdict: std::string
    then:
      - lambda: |-
          lv_obj_add_flag(id(btn_claude_approve), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(btn_claude_reject), LV_OBJ_FLAG_HIDDEN);
          clawd::set_mode(verdict == "Approved" ? clawd::SENT_OK : clawd::SENT_NO, millis());
          id(claude_tick).execute();

  # One animation frame at 10 Hz; nav icon always updates, card only while AI tab is up.
  - id: claude_tick
    then:
      - lambda: |-
          using namespace clawd;
          tick_nav(id(nav_clawd_box));
          static Puppet p;
          static int walk_x = 0, walk_dir = 1;
          static uint32_t verb_for = UINT32_MAX;
          static const char *verb = "Working";
          // Claude Code names its work with a fresh gerund each prompt.
          static const char *const VERBS[] = {"Working", "Pondering", "Noodling", "Brewing", "Cogitating",
                                              "Tinkering", "Puzzling", "Forging", "Mulling", "Percolating"};
          static pet_scenes::TerminalCampfireScene scene;
          if (p.root == nullptr) {
            build(p, id(clawd_box), 4);
            scene.build(id(ai_card), id(clawd_box), id(claude_bubble), false);
            lv_label_set_recolor(id(lbl_agent_status), true);
            lv_obj_remove_flag(id(claude_bubble), LV_OBJ_FLAG_CLICKABLE);
            lv_obj_set_style_bg_color(id(claude_trail), lv_color_hex(BODY), 0);
            lv_obj_set_style_border_width(id(claude_trail), 0, 0);
          }
          if (g_work_start != verb_for) {
            verb_for = g_work_start;
            verb = VERBS[(g_work_start / 7 + g_frame) % (sizeof(VERBS) / sizeof(VERBS[0]))];
          }
          if (lv_obj_has_flag(id(ai_card), LV_OBJ_FLAG_HIDDEN)) return;

          const uint32_t f = g_frame, t = g_frame - g_mode_frame, now = millis();
          const uint32_t acc = accent(g_mode);
          const int max_x = 540 - p.w();
          const int center = max_x / 2;

          const bool travelling = false;
          Pose s = animate(g_mode, f, t, p.u);
          pet_scenes::merge_pose(s, scene.tick(static_cast<pet_scenes::PetMode>(g_mode), f, t, walk_x));
          apply(p, s);
          lv_obj_set_x(id(clawd_box), walk_x);
          lv_obj_set_width(id(claude_trail), 0);

          // Bubble: a drifting z while asleep, ? or ! above the head otherwise.
          lv_obj_t *b = id(claude_bubble);
          int bx = walk_x + p.w() - 6, by = 86;
          if (g_mode == IDLE && !travelling) {
            uint32_t k = f % 30;
            lv_label_set_text(b, k < 15 ? "z" : "Z");
            bx += (int) (k / 6);
            by = 92 - (int) (k / 2);
            lv_obj_set_style_text_color(b, lv_color_hex(0x6E7681), 0);
            lv_obj_set_style_text_opa(b, k < 20 ? LV_OPA_COVER : (lv_opa_t) (255 - (k - 20) * 25), 0);
            lv_obj_clear_flag(b, LV_OBJ_FLAG_HIDDEN);
          } else if ((g_mode == NEEDS_INPUT || g_mode == clawd::PENDING) && !travelling) {
            lv_label_set_text(b, g_mode == clawd::PENDING ? "!" : "?");
            by = 82 - (int) ((f / 5) % 2);
            lv_obj_set_style_text_color(b, lv_color_hex(acc), 0);
            lv_obj_set_style_text_opa(b, LV_OPA_COVER, 0);
            lv_obj_clear_flag(b, LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(b, LV_OBJ_FLAG_HIDDEN);
          }
          lv_obj_set_pos(b, bx, by);

          // ── Status line ──
          lv_label_set_text(id(claude_spin), g_mode == WORKING ? spinner(f)
                            : g_mode == DONE || g_mode == SENT_OK ? "✓"
                            : g_mode == SENT_NO ? "✕"
                            : g_mode == RATE_LIMITED ? "!"
                            : g_mode == IDLE ? "·" : "✻");
          lv_obj_set_style_text_color(id(claude_spin), lv_color_hex(acc), 0);

          char line[160];
          if (g_mode == WORKING) {
            // A bright 3-letter glint sweeping the verb, like the CLI's shimmer.
            const int n = strlen(verb), pos = (int) (f % (n + 8)) - 3;
            int o = 0;
            for (int i = 0; i < n && o < 140; i++) {
              bool hi = i >= pos && i < pos + 3;
              if (hi && (i == 0 || i == pos)) o += snprintf(line + o, sizeof(line) - o, "#FFD2BF ");
              line[o++] = verb[i];
              if (hi && (i == n - 1 || i == pos + 2)) line[o++] = '#';
            }
            line[o] = 0;
            strncat(line, "…", sizeof(line) - strlen(line) - 1);
          } else {
            static const char *const WORDS[] = {"Idle", "", "Waiting for approval", "Needs your input", "Done", "Approved", "Rejected", "Rate limited"};
            snprintf(line, sizeof(line), "%s", WORDS[g_mode]);
          }
          lv_label_set_text(id(lbl_agent_status), line);
          lv_obj_set_style_text_color(id(lbl_agent_status), lv_color_hex(acc), 0);

          uint64_t rl_left = 0;
          char tbuf[48] = "";
          if (g_mode == WORKING || g_mode == NEEDS_INPUT) {
            char d[16];
            fmt_elapsed(d, sizeof(d), now - g_work_start);
            snprintf(tbuf, sizeof(tbuf), "(%s)", d);
          } else if (g_mode == clawd::PENDING) {
            uint32_t gone = now - g_pending_start, total = ${claude_decision_timeout} * 1000;
            uint32_t left = gone < total ? total - gone : 0;
            snprintf(tbuf, sizeof(tbuf), "(%us to decide)", (unsigned) ((left + 999) / 1000));
          } else if (g_mode == DONE && g_last_run > 0) {
            char d[16];
            fmt_elapsed(d, sizeof(d), g_last_run);
            snprintf(tbuf, sizeof(tbuf), "(took %s)", d);
          } else if (g_mode == RATE_LIMITED) {
            rl_left = rl_left_ms(now);
            if (rl_left == 0) {
              snprintf(tbuf, sizeof(tbuf), "(%s · ready)", g_rl_is_7d ? "7d" : "5h");
              lv_obj_set_width(id(claude_rl_fill), 0);
              if (!g_rl_is_7d && g_rl_7d_left_pct >= 0) {
                lv_label_set_text(id(lbl_rl_5h_pct), "Ready");
                lv_obj_set_style_text_color(id(lbl_rl_5h_pct), lv_color_hex(0x2EA043), 0);
              }
            } else {
              char d[24];
              fmt_countdown(d, sizeof(d), rl_left);
              snprintf(tbuf, sizeof(tbuf), "(%s · %s)", g_rl_is_7d ? "7d" : "5h", d);
              int w = (int) ((538ULL * rl_left) / g_rl_total_ms);
              if (w < 4) w = 4;
              if (w > 538) w = 538;
              lv_obj_set_width(id(claude_rl_fill), w);
              uint32_t fill_col = (rl_left * 10 <= g_rl_total_ms) ? 0xFFB020 : 0xF85149;
              lv_obj_set_style_bg_color(id(claude_rl_fill), lv_color_hex(fill_col), 0);
              if (!g_rl_is_7d && g_rl_7d_left_pct >= 0) {
                unsigned pct5 = (unsigned) ((rl_left * 100ULL + g_rl_total_ms / 2) / g_rl_total_ms);
                if (pct5 > 100) pct5 = 100;
                char p5buf[24];
                snprintf(p5buf, sizeof(p5buf), "%u%% remaining", pct5);
                lv_label_set_text(id(lbl_rl_5h_pct), p5buf);
                lv_obj_set_style_text_color(id(lbl_rl_5h_pct), lv_color_hex(fill_col), 0);
              }
            }
          }
          lv_label_set_text(id(lbl_claude_time), tbuf);
          lv_obj_align_to(id(lbl_claude_time), id(lbl_agent_status), LV_ALIGN_OUT_RIGHT_MID, 8, 1);

          // ── Prompt box frame ──
          uint32_t frame = 0x30363D, caret = 0x6E7681;
          const char *mark = ">";
          if (g_mode == clawd::PENDING) { frame = acc; caret = acc; mark = "!"; }
          else if (g_mode == NEEDS_INPUT) { frame = acc; caret = acc; mark = "?"; }
          else if (g_mode == RATE_LIMITED) { frame = rl_left == 0 ? 0x2EA043 : 0x9E3632; caret = acc; mark = "!"; }
          else if (g_mode == WORKING) { caret = BODY; }
          lv_obj_set_style_border_color(id(claude_box), lv_color_hex(frame), 0);
          lv_label_set_text(id(claude_caret), mark);
          lv_obj_set_style_text_color(id(claude_caret), lv_color_hex(caret), 0);

          // Card border: pulses amber while a request waits.
          uint32_t border = 0x30363D;
          if (g_mode == clawd::PENDING) border = (f / 5) % 2 ? 0xFFB020 : 0x8A5D12;
          else if (g_mode == SENT_OK) border = 0x2EA043;
          else if (g_mode == SENT_NO) border = 0xF85149;
          else if (g_mode == RATE_LIMITED) border = rl_left == 0 ? 0x2EA043 : 0x9E3632;
          lv_obj_set_style_border_color(id(ai_card), lv_color_hex(border), 0);

interval:
  - interval: 100ms
    then:
      - lambda: "clawd::g_frame++;"
      - script.execute: claude_tick
