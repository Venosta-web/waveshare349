# Variant B, "Terminal": the Claude Code status line and prompt box, with Clawd
# pacing the floor underneath while a prompt runs.
# Content box is 540 x 140 (560 x 160 card, 2 px border, 8 px padding).
id: ai_card
width: 560
height: 160
align: RIGHT_MID
x: -6
y: 0
styles: card_style
bg_color: 0x0D1117
hidden: true
scrollbar_mode: "off"
widgets:
  # ── Status line:  ✻ Working… (1m 05s)                 ~/project ──────────
  - label:
      id: claude_spin
      text: "·"
      text_font: mono_16b
      text_color: 0x8B949E
      align: TOP_LEFT
      x: 2
      y: 0
  - label:
      id: lbl_agent_status
      text: "Idle"
      text_font: mono_16b
      text_color: 0x8B949E
      align: TOP_LEFT
      x: 22
      y: 0
  - label:
      id: lbl_claude_time
      text: ""
      text_font: mono_12
      text_color: 0x6E7681
      align: TOP_LEFT
      x: 120
      y: 3
  - label:
      id: lbl_claude_project
      text: ""
      text_font: mono_12
      text_color: 0x8B949E
      align: TOP_RIGHT
      x: 0
      y: 3

  # ── Prompt box, as in the Claude Code input/permission frame ────────────
  - obj:
      id: claude_box
      width: 540
      height: 56
      align: TOP_LEFT
      x: 0
      y: 24
      bg_opa: TRANSP
      border_color: 0x30363D
      border_width: 1
      radius: 6
      pad_left: 10
      pad_right: 10
      pad_top: 6
      pad_bottom: 6
      scrollbar_mode: "off"
      widgets:
        - label:
            id: claude_caret
            text: ">"
            text_font: mono_14
            text_color: 0x6E7681
            align: TOP_LEFT
            x: 0
            y: 0
        - label:
            id: lbl_agent_detail
            text: "Waiting for Claude Code"
            text_font: mono_14
            text_color: 0xC9D1D9
            align: TOP_LEFT
            x: 16
            y: 0
            width: 502
            height: 40
            long_mode: DOT
        - label:
            id: lbl_step_now_icon
            text: "›"
            text_font: mono_14
            text_color: 0xD97757
            align: TOP_LEFT
            x: 0
            y: 0
            hidden: true
        - label:
            id: lbl_step_now
            text: ""
            text_font: mono_14
            text_color: 0xF0F6FC
            align: TOP_LEFT
            x: 16
            y: 0
            width: 446
            height: 18
            long_mode: DOT
            hidden: true
        - label:
            id: lbl_step_count
            text: ""
            text_font: mono_12
            text_color: 0xD97757
            align: TOP_RIGHT
            x: 0
            y: 0
            bg_color: 0x21262D
            bg_opa: COVER
            radius: 4
            pad_left: 5
            pad_right: 5
            pad_top: 1
            pad_bottom: 1
            hidden: true
        - label:
            id: lbl_step_next_icon
            text: "○"
            text_font: mono_12
            text_color: 0x6E7681
            align: TOP_LEFT
            x: 1
            y: 23
            hidden: true
        - label:
            id: lbl_step_next
            text: ""
            text_font: mono_12
            text_color: 0x8B949E
            align: TOP_LEFT
            x: 16
            y: 22
            width: 502
            height: 16
            long_mode: DOT
            hidden: true
        - label:
            id: lbl_rl_sub
            text: ""
            text_font: mono_12
            text_color: 0x8B949E
            align: TOP_LEFT
            x: 16
            y: 23
            width: 502
            height: 16
            long_mode: DOT
            hidden: true

  # Subtle progress bar under the prompt box when a multi-step task is active.
  - obj:
      id: step_progress_bg
      width: 536
      height: 2
      align: TOP_LEFT
      x: 2
      y: 81
      bg_color: 0x21262D
      bg_opa: COVER
      border_width: 0
      radius: 1
      pad_all: 0
      hidden: true
      scrollbar_mode: "off"
      widgets:
        - obj:
            id: step_progress_fill
            width: 0
            height: 2
            align: LEFT_MID
            x: 0
            bg_color: 0xD97757
            bg_opa: COVER
            border_width: 0
            radius: 1
            pad_all: 0

  # ── Rate-limit countdown bar (shown only when rate-limited) ─────────────
  - obj:
      id: claude_rl_track
      width: 540
      height: 8
      align: TOP_LEFT
      x: 0
      y: 84
      bg_color: 0x21262D
      bg_opa: COVER
      border_color: 0x30363D
      border_width: 1
      radius: 4
      pad_all: 0
      hidden: true
      scrollbar_mode: "off"
      widgets:
        - obj:
            id: claude_rl_fill
            width: 538
            height: 6
            align: LEFT_MID
            x: 0
            bg_color: 0xF85149
            bg_opa: COVER
            border_width: 0
            radius: 3
            pad_all: 0

  # ── Floor-flanking 5h / 7d telemetry (shown when 5h-limited with 7d quota left)
  - obj:
      id: claude_rl_5h_wing
      width: 224
      height: 36
      align: TOP_LEFT
      x: 0
      y: 99
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      hidden: true
      scrollbar_mode: "off"
      widgets:
        - label:
            id: lbl_rl_5h_title
            text: "5h cooldown"
            text_font: mono_12
            text_color: 0x8B949E
            align: TOP_LEFT
            x: 2
            y: 2
        - label:
            id: lbl_rl_5h_pct
            text: ""
            text_font: mono_12
            text_color: 0xF85149
            align: TOP_LEFT
            x: 2
            y: 18

  - obj:
      id: claude_rl_7d_wing
      width: 224
      height: 38
      align: TOP_LEFT
      x: 316
      y: 98
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      hidden: true
      scrollbar_mode: "off"
      widgets:
        - label:
            id: lbl_rl_7d_title
            text: "7d limit"
            text_font: mono_12
            text_color: 0x8B949E
            align: TOP_LEFT
            x: 0
            y: 0
        - label:
            id: lbl_rl_7d_pct
            text: ""
            text_font: mono_12
            text_color: 0x3FB950
            align: TOP_RIGHT
            x: 0
            y: 0
        - obj:
            id: claude_rl_7d_track
            width: 224
            height: 7
            align: TOP_LEFT
            x: 0
            y: 15
            bg_color: 0x21262D
            bg_opa: COVER
            border_color: 0x30363D
            border_width: 1
            radius: 3
            pad_all: 0
            scrollbar_mode: "off"
            widgets:
              - obj:
                  id: claude_rl_7d_fill
                  width: 0
                  height: 5
                  align: LEFT_MID
                  x: 0
                  bg_color: 0x3FB950
                  bg_opa: COVER
                  border_width: 0
                  radius: 2
                  pad_all: 0
        - label:
            id: lbl_rl_7d_reset
            text: ""
            text_font: mono_12
            text_color: 0x6E7681
            align: TOP_RIGHT
            x: 0
            y: 23

  # ── Floor at y = 137; Clawd's feet land on it ──────────────────────────────────────────
  - obj:
      id: claude_floor
      width: 540
      height: 1
      align: TOP_LEFT
      x: 0
      y: 137
      bg_color: 0x21262D
      bg_opa: COVER
      border_width: 0
      radius: 0
      pad_all: 0
  # Trail of footprints Clawd leaves behind on a long run (lit as time passes).
  - obj:
      id: claude_trail
      width: 0
      height: 2
      align: TOP_LEFT
      x: 0
      y: 136
      bg_color: 0xD97757
      bg_opa: 60%
      border_width: 0
      radius: 0
      pad_all: 0
  - obj:
      id: clawd_box
      align: TOP_LEFT
      x: 0
      y: 101
      width: 56
      height: 41
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      radius: 0
      scrollbar_mode: "off"
  - label:
      id: claude_bubble
      text: "z"
      text_font: mono_14
      text_color: 0x6E7681
      align: TOP_LEFT
      x: 50
      y: 84

  # Approve / Reject only appear while a permission request is pending, with
  # Clawd standing between them. The request id is echoed back so a stale tap
  # can't approve a newer request.
  - button:
      id: btn_claude_approve
      width: 222
      height: 46
      align: BOTTOM_LEFT
      hidden: true
      bg_color: 0x238636
      border_color: 0x2EA043
      border_width: 1
      radius: 8
      widgets:
        - label:
            text: "APPROVE"
            text_font: mono_16b
            text_color: 0xFFFFFF
            align: CENTER
      on_click:
        then:
          - homeassistant.event:
              event: esphome.claude_command
              data:
                action: approve
                request_id: !lambda "return id(claude_request).state;"
          - script.execute:
              id: claude_sent
              verdict: "Approved"

  - button:
      id: btn_claude_reject
      width: 222
      height: 46
      align: BOTTOM_RIGHT
      hidden: true
      bg_color: 0x161B22
      border_color: 0xF85149
      border_width: 1
      radius: 8
      widgets:
        - label:
            text: "REJECT"
            text_font: mono_16b
            text_color: 0xFF7B72
            align: CENTER
      on_click:
        then:
          - homeassistant.event:
              event: esphome.claude_command
              data:
                action: reject
                request_id: !lambda "return id(claude_request).state;"
          - script.execute:
              id: claude_sent
              verdict: "Rejected"
