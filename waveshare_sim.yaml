substitutions:
  device_name: "waveshare-sim"
  friendly_name: "Waveshare 3.49 SDL Simulator"

  # ══════════════════════════════════════════════════════════════════════════
  # GROWSPACE CONFIGURATION (Direct HA Entities + Metrics Bridge Templates)
  # See ha_metrics_bridge.yaml and docs/adr/0001-hybrid-ha-metrics-bridge.md
  # ══════════════════════════════════════════════════════════════════════════
  gs_count: "7"

  # Space 0: 4x4
  gs_0_name: "4x4"
  gs_0_metrics: "sensor.4x4_metrics_bridge"
  gs_0_vpd: "sensor.4x4_calculated_vpd"
  gs_0_temp: "sensor.4x4_temperature"
  gs_0_hum: "sensor.4x4_humidity"
  gs_0_exhaust: "fan.4x4_exhaust"
  gs_0_circ: "fan.4x4_circulation"
  gs_0_humid: "humidifier.4x4_humidifier"

  # Space 1: SOG 2x5
  gs_1_name: "SOG 2x5"
  gs_1_metrics: "sensor.sog_2x5_metrics_bridge"
  gs_1_vpd: "sensor.sog_2x5_calculated_vpd"
  gs_1_temp: "sensor.sog_2x5_temperature"
  gs_1_hum: "sensor.sog_2x5_humidity"
  gs_1_exhaust: "fan.sog_2x5_exhaust"
  gs_1_circ: "fan.sog_2x5_circulation"
  gs_1_humid: "humidifier.sog_2x5_humidifier"

  # Space 2: Nursery Dome
  gs_2_name: "Nursery Dome"
  gs_2_metrics: "sensor.nursery_dome_metrics_bridge"
  gs_2_vpd: "sensor.nursery_dome_calculated_vpd"
  gs_2_temp: "sensor.nursery_dome_temperature"
  gs_2_hum: "sensor.nursery_dome_humidity"
  gs_2_exhaust: "fan.nursery_dome_exhaust"
  gs_2_circ: "fan.nursery_dome_circulation"
  gs_2_humid: "humidifier.nursery_dome_humidifier"

  # Space 3: Clone
  gs_3_name: "Clone"
  gs_3_metrics: "sensor.clone_metrics_bridge"
  gs_3_vpd: "sensor.clone_calculated_vpd"
  gs_3_temp: "sensor.clone_temperature"
  gs_3_hum: "sensor.clone_humidity"
  gs_3_exhaust: "fan.clone_exhaust"
  gs_3_circ: "fan.clone_circulation"
  gs_3_humid: "humidifier.clone_humidifier"

  # Space 4: Mother
  gs_4_name: "Mother"
  gs_4_metrics: "sensor.mother_metrics_bridge"
  gs_4_vpd: "sensor.mother_calculated_vpd"
  gs_4_temp: "sensor.mother_temperature"
  gs_4_hum: "sensor.mother_humidity"
  gs_4_exhaust: "fan.mother_exhaust"
  gs_4_circ: "fan.mother_circulation"
  gs_4_humid: "humidifier.mother_humidifier"

  # Space 5: Dry
  gs_5_name: "Dry"
  gs_5_metrics: "sensor.dry_metrics_bridge"
  gs_5_vpd: "sensor.dry_calculated_vpd"
  gs_5_temp: "sensor.dry_temperature"
  gs_5_hum: "sensor.dry_humidity"
  gs_5_exhaust: "fan.dry_exhaust"
  gs_5_circ: "fan.dry_circulation"
  gs_5_humid: "humidifier.dry_humidifier"

  # Space 6: Cure
  gs_6_name: "Cure"
  gs_6_metrics: "sensor.cure_metrics_bridge"
  gs_6_vpd: "sensor.cure_calculated_vpd"
  gs_6_temp: "sensor.cure_temperature"
  gs_6_hum: "sensor.cure_humidity"
  gs_6_exhaust: "fan.cure_exhaust"
  gs_6_circ: "fan.cure_circulation"
  gs_6_humid: "humidifier.cure_humidifier"

  # Timing (seconds)
  cycle_interval: "15"
  pause_timeout: "25"

  # Claude Code card: "stage" (mascot-forward) or "terminal" (CLI status line)
  claude_variant: "terminal"
  # Seconds the bridge waits for a tap (CLAUDE_HA_DECISION_TIMEOUT)
  claude_decision_timeout: "110"

  # VPD gauge scale
  vpd_gauge_min: "0.4"
  vpd_gauge_max: "1.8"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - claude/clawd.h
  on_boot:
    priority: -100
    then:
      - delay: 3s
      - script.execute: update_grow_ui

packages:
  claude: !include claude/${claude_variant}.yaml

host:

logger:
  level: INFO

# Native API server listens on TCP 6053 on your PC's LAN/WSL IP
api:
  port: 6053
  on_client_connected:
    - delay: 1s
    - script.execute: update_grow_ui

# ============================================================================
# 1. SDL2 DISPLAY & MOUSE TOUCHSCREEN EMULATOR (640 x 172)
# ============================================================================
display:
  - platform: sdl
    id: my_display
    dimensions:
      width: 640
      height: 172
    snapshot_key: SDLK_F12 # Press F12 in window to save a PNG screenshot
    update_interval: never
    window_options:
      always_on_top: true
      resizable: false

touchscreen:
  - platform: sdl
    id: my_touchscreen
    display: my_display

# ============================================================================
# 2. GLOBALS
# ============================================================================
globals:
  - id: vpd_sensor_index
    type: int
    initial_value: "0"
  - id: cycle_timer
    type: int
    initial_value: "${cycle_interval}"
  - id: cycle_paused
    type: bool
    initial_value: "false"
  - id: pause_timer
    type: int
    initial_value: "0"
  - id: gs_total
    type: int
    initial_value: "${gs_count}"
  - id: nav_direction
    type: int
    initial_value: "1"

# ============================================================================
# 3. FONTS & MDI ICONS
# ============================================================================
font:
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_12
    size: 12
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°•"

  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_14
    size: 14
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°•"

  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: font_20
    size: 20
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°•"

  - file:
      type: gfonts
      family: Roboto
      weight: 800
    id: font_32
    size: 32
    bpp: 4
    glyphs: "0123456789:.% -°abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ/"

  - file: "fonts/materialdesignicons-webfont.ttf"
    id: icons_20
    size: 20
    glyphs:
      - "\U000F050F" # thermometer
      - "\U000F058C" # water
      - "\U000F012C" # check-circle
      - "\U000F0029" # alert
      - "\U000F0159" # close-circle
      - "\U000F0210" # fan
      - "\U000F06B5" # lightbulb (day)
      - "\U000F06B8" # lightbulb-off (night)
      - "\U000F03E4" # pause

  - file: "fonts/materialdesignicons-webfont.ttf"
    id: icons_24
    size: 24
    glyphs:
      - "\U000F0141" # chevron-left
      - "\U000F0142" # chevron-right

# ============================================================================
# 4. LVGL 640x172 UI (Shared Layout Structure with Real Hardware)
# ============================================================================
lvgl:
  log_level: INFO
  buffer_size: 100%
  full_refresh: true
  disp_bg_color: 0x0A0C10
  touchscreens:
    - touchscreen_id: my_touchscreen

  style_definitions:
    - id: nav_btn
      bg_color: 0x161B22
      bg_opa: COVER
      border_color: 0x30363D
      border_width: 1
      radius: 8
      pad_all: 0

    - id: nav_btn_active
      bg_color: 0x1F6FEB
      bg_opa: COVER
      border_color: 0x58A6FF
      border_width: 1
      radius: 8
      pad_all: 0

    - id: card_style
      bg_color: 0x161B22
      bg_opa: COVER
      border_color: 0x30363D
      border_width: 2
      radius: 12
      pad_all: 8

    - id: phase_badge
      bg_color: 0x333333
      bg_opa: COVER
      radius: 6
      pad_left: 7
      pad_right: 7
      pad_top: 2
      pad_bottom: 2
      border_width: 0

  pages:
    - id: home_page
      bg_color: 0x0A0C10
      widgets:
        # ── LEFT NAVIGATION RAIL (72 x 172) ────────────────────────────────
        - button:
            id: nav_grow
            width: 64
            height: 50
            align: TOP_LEFT
            x: 4
            y: 6
            styles: nav_btn_active
            widgets:
              - label:
                  text: "GROW"
                  text_font: font_12
                  text_color: 0xFFFFFF
                  align: CENTER
            on_press:
              then:
                - script.execute:
                    id: switch_tab
                    tab_idx: 0

        - button:
            id: nav_music
            width: 64
            height: 50
            align: LEFT_MID
            x: 4
            y: 0
            styles: nav_btn
            widgets:
              - label:
                  text: "MUSIC"
                  text_font: font_12
                  text_color: 0x8B949E
                  align: CENTER
            on_press:
              then:
                - script.execute:
                    id: switch_tab
                    tab_idx: 1

        - button:
            id: nav_ai
            width: 64
            height: 50
            align: BOTTOM_LEFT
            x: 4
            y: -6
            styles: nav_btn
            widgets:
              - label:
                  text: "AI"
                  text_font: font_12
                  text_color: 0x8B949E
                  align: CENTER
            on_press:
              then:
                - script.execute:
                    id: switch_tab
                    tab_idx: 2

        # ── CARD 1: GROWSPACE MANAGER (560 x 160) ──────────────────────────
        - obj:
            id: grow_card
            width: 560
            height: 160
            align: RIGHT_MID
            x: -6
            y: 0
            styles: card_style
            scrollbar_mode: "off"
            widgets:
              - label:
                  id: gs_name_lbl
                  text: "4x4"
                  text_font: font_20
                  text_color: 0x00D1FF
                  align: TOP_LEFT
                  x: 4
                  y: 0

              - label:
                  id: gs_day_icon
                  text: "\U000F06B5"
                  text_font: icons_20
                  text_color: 0xFFC107
                  align: TOP_LEFT
                  x: 155
                  y: 2

              - label:
                  id: gs_pause_icon
                  text: "\U000F03E4"
                  text_font: icons_20
                  text_color: 0xFFC107
                  align: TOP_LEFT
                  x: 180
                  y: 2
                  hidden: true

              - label:
                  id: gs_phase_badge
                  text: "Waiting HA"
                  text_font: font_12
                  text_color: 0xFFFFFF
                  styles: phase_badge
                  align: TOP_LEFT
                  x: 205
                  y: 2

              - label:
                  id: gs_vpd_status
                  text: "\U000F012C"
                  text_font: icons_20
                  text_color: 0x4CAF50
                  align: LEFT_MID
                  x: 4
                  y: -2

              - label:
                  id: gs_vpd_val
                  text: "-- kPa"
                  text_font: font_32
                  text_color: 0xFFFFFF
                  align: LEFT_MID
                  x: 28
                  y: -2

              - label:
                  id: gs_vpd_range
                  text: "Target\n-- - --"
                  text_font: font_12
                  text_color: 0x8B949E
                  align: LEFT_MID
                  x: 185
                  y: 0

              # VPD Linear Gauge Track (270px wide)
              - obj:
                  id: gs_gauge_bg
                  width: 270
                  height: 10
                  align: BOTTOM_LEFT
                  x: 4
                  y: -16
                  bg_color: 0x30363D
                  bg_opa: COVER
                  border_width: 0
                  radius: 4
                  widgets:
                    - obj:
                        id: gs_gauge_zone
                        width: 80
                        height: 10
                        align: LEFT_MID
                        x: 70
                        bg_color: 0x4CAF50
                        bg_opa: 65%
                        border_width: 0
                        radius: 4
                    - obj:
                        id: gs_gauge_marker
                        width: 8
                        height: 16
                        align: LEFT_MID
                        x: 110
                        bg_color: 0x00D1FF
                        bg_opa: COVER
                        border_width: 0
                        radius: 4

              - label:
                  text: "${vpd_gauge_min}"
                  text_font: font_12
                  text_color: 0x6E7681
                  align: BOTTOM_LEFT
                  x: 4
                  y: 0

              - label:
                  text: "${vpd_gauge_max}"
                  text_font: font_12
                  text_color: 0x6E7681
                  align: BOTTOM_LEFT
                  x: 254
                  y: 0

              # Vertical Divider
              - obj:
                  width: 1
                  height: 132
                  align: LEFT_MID
                  x: 292
                  bg_color: 0x30363D
                  bg_opa: COVER
                  border_width: 0

              # Right Column: Temp, Humidity & Equipment
              - label:
                  text: "\U000F050F"
                  text_font: icons_20
                  text_color: 0xFF6B6B
                  align: TOP_LEFT
                  x: 304
                  y: 4
              - label:
                  id: gs_temp_val
                  text: "--.- °C"
                  text_font: font_20
                  text_color: 0xFFFFFF
                  align: TOP_LEFT
                  x: 326
                  y: 2

              - label:
                  text: "\U000F058C"
                  text_font: icons_20
                  text_color: 0x64B5F6
                  align: TOP_LEFT
                  x: 304
                  y: 34
              - label:
                  id: gs_hum_val
                  text: "-- %"
                  text_font: font_20
                  text_color: 0xFFFFFF
                  align: TOP_LEFT
                  x: 326
                  y: 32

              - label:
                  id: gs_exh_lbl
                  text: "Exh: --"
                  text_font: font_12
                  text_color: 0x8B949E
                  align: BOTTOM_LEFT
                  x: 304
                  y: -36
              - label:
                  id: gs_circ_lbl
                  text: "Circ: --"
                  text_font: font_12
                  text_color: 0x8B949E
                  align: BOTTOM_LEFT
                  x: 304
                  y: -19
              - label:
                  id: gs_hum_eq_lbl
                  text: "Hum: --"
                  text_font: font_12
                  text_color: 0x8B949E
                  align: BOTTOM_LEFT
                  x: 304
                  y: -2

              # Prev / Next Space Buttons
              - button:
                  id: btn_prev_space
                  width: 64
                  height: 62
                  align: TOP_RIGHT
                  x: 0
                  y: 0
                  bg_color: 0x21262D
                  radius: 8
                  widgets:
                    - label:
                        text: "\U000F0141"
                        text_font: icons_24
                        align: CENTER
                  on_press:
                    then:
                      - lambda: "id(nav_direction) = -1;"
                      - script.execute: navigate_space

              - button:
                  id: btn_next_space
                  width: 64
                  height: 62
                  align: BOTTOM_RIGHT
                  x: 0
                  y: 0
                  bg_color: 0x21262D
                  radius: 8
                  widgets:
                    - label:
                        text: "\U000F0142"
                        text_font: icons_24
                        align: CENTER
                  on_press:
                    then:
                      - lambda: "id(nav_direction) = 1;"
                      - script.execute: navigate_space

        # ── CARD 2: SPOTIFY MEDIA BAR (Hidden initially) ────────────────────
        - obj:
            id: music_card
            width: 560
            height: 160
            align: RIGHT_MID
            x: -6
            y: 0
            styles: card_style
            hidden: true
            widgets:
              - label:
                  id: lbl_track_title
                  text: "Spotify Media Bar"
                  text_font: font_20
                  text_color: 0x1DB954
                  align: TOP_LEFT
              - label:
                  id: lbl_track_artist
                  text: "Ready to wire media_player.spotify"
                  text_font: font_14
                  text_color: 0x8B949E
                  align: TOP_LEFT
                  y: 28

        # ── CARD 3: CLAUDE CODE (Hidden initially) ─────────────────────────
        # Widgets live in claude/<variant>_card.yaml, logic in claude/<variant>.yaml.
        - obj: !include claude/${claude_variant}_card.yaml

# ============================================================================
# 5. HOME ASSISTANT SENSORS (All 7 Growspaces)
# ============================================================================
sensor:
  # Space 0: 4x4
  - { platform: homeassistant, id: gs0_vpd, entity_id: "${gs_0_vpd}" }
  - { platform: homeassistant, id: gs0_temp, entity_id: "${gs_0_temp}" }
  - { platform: homeassistant, id: gs0_hum, entity_id: "${gs_0_hum}" }
  - { platform: homeassistant, id: gs0_vpd_tgt_min, entity_id: "${gs_0_metrics}", attribute: vpd_target_min }
  - { platform: homeassistant, id: gs0_vpd_tgt_max, entity_id: "${gs_0_metrics}", attribute: vpd_target_max }
  - { platform: homeassistant, id: gs0_vpd_dng_min, entity_id: "${gs_0_metrics}", attribute: vpd_danger_min }
  - { platform: homeassistant, id: gs0_vpd_dng_max, entity_id: "${gs_0_metrics}", attribute: vpd_danger_max }
  - { platform: homeassistant, id: gs0_exhaust, entity_id: "${gs_0_exhaust}", attribute: percentage }
  - { platform: homeassistant, id: gs0_circ, entity_id: "${gs_0_circ}", attribute: percentage }

  # Space 1: SOG 2x5
  - { platform: homeassistant, id: gs1_vpd, entity_id: "${gs_1_vpd}" }
  - { platform: homeassistant, id: gs1_temp, entity_id: "${gs_1_temp}" }
  - { platform: homeassistant, id: gs1_hum, entity_id: "${gs_1_hum}" }
  - { platform: homeassistant, id: gs1_vpd_tgt_min, entity_id: "${gs_1_metrics}", attribute: vpd_target_min }
  - { platform: homeassistant, id: gs1_vpd_tgt_max, entity_id: "${gs_1_metrics}", attribute: vpd_target_max }
  - { platform: homeassistant, id: gs1_vpd_dng_min, entity_id: "${gs_1_metrics}", attribute: vpd_danger_min }
  - { platform: homeassistant, id: gs1_vpd_dng_max, entity_id: "${gs_1_metrics}", attribute: vpd_danger_max }
  - { platform: homeassistant, id: gs1_exhaust, entity_id: "${gs_1_exhaust}", attribute: percentage }
  - { platform: homeassistant, id: gs1_circ, entity_id: "${gs_1_circ}", attribute: percentage }

  # Space 2: Nursery Dome
  - { platform: homeassistant, id: gs2_vpd, entity_id: "${gs_2_vpd}" }
  - { platform: homeassistant, id: gs2_temp, entity_id: "${gs_2_temp}" }
  - { platform: homeassistant, id: gs2_hum, entity_id: "${gs_2_hum}" }
  - { platform: homeassistant, id: gs2_vpd_tgt_min, entity_id: "${gs_2_metrics}", attribute: vpd_target_min }
  - { platform: homeassistant, id: gs2_vpd_tgt_max, entity_id: "${gs_2_metrics}", attribute: vpd_target_max }
  - { platform: homeassistant, id: gs2_vpd_dng_min, entity_id: "${gs_2_metrics}", attribute: vpd_danger_min }
  - { platform: homeassistant, id: gs2_vpd_dng_max, entity_id: "${gs_2_metrics}", attribute: vpd_danger_max }
  - { platform: homeassistant, id: gs2_exhaust, entity_id: "${gs_2_exhaust}", attribute: percentage }
  - { platform: homeassistant, id: gs2_circ, entity_id: "${gs_2_circ}", attribute: percentage }

  # Space 3: Clone
  - { platform: homeassistant, id: gs3_vpd, entity_id: "${gs_3_vpd}" }
  - { platform: homeassistant, id: gs3_temp, entity_id: "${gs_3_temp}" }
  - { platform: homeassistant, id: gs3_hum, entity_id: "${gs_3_hum}" }
  - { platform: homeassistant, id: gs3_vpd_tgt_min, entity_id: "${gs_3_metrics}", attribute: vpd_target_min }
  - { platform: homeassistant, id: gs3_vpd_tgt_max, entity_id: "${gs_3_metrics}", attribute: vpd_target_max }
  - { platform: homeassistant, id: gs3_vpd_dng_min, entity_id: "${gs_3_metrics}", attribute: vpd_danger_min }
  - { platform: homeassistant, id: gs3_vpd_dng_max, entity_id: "${gs_3_metrics}", attribute: vpd_danger_max }
  - { platform: homeassistant, id: gs3_exhaust, entity_id: "${gs_3_exhaust}", attribute: percentage }
  - { platform: homeassistant, id: gs3_circ, entity_id: "${gs_3_circ}", attribute: percentage }

  # Space 4: Mother
  - { platform: homeassistant, id: gs4_vpd, entity_id: "${gs_4_vpd}" }
  - { platform: homeassistant, id: gs4_temp, entity_id: "${gs_4_temp}" }
  - { platform: homeassistant, id: gs4_hum, entity_id: "${gs_4_hum}" }
  - { platform: homeassistant, id: gs4_vpd_tgt_min, entity_id: "${gs_4_metrics}", attribute: vpd_target_min }
  - { platform: homeassistant, id: gs4_vpd_tgt_max, entity_id: "${gs_4_metrics}", attribute: vpd_target_max }
  - { platform: homeassistant, id: gs4_vpd_dng_min, entity_id: "${gs_4_metrics}", attribute: vpd_danger_min }
  - { platform: homeassistant, id: gs4_vpd_dng_max, entity_id: "${gs_4_metrics}", attribute: vpd_danger_max }
  - { platform: homeassistant, id: gs4_exhaust, entity_id: "${gs_4_exhaust}", attribute: percentage }
  - { platform: homeassistant, id: gs4_circ, entity_id: "${gs_4_circ}", attribute: percentage }

  # Space 5: Dry
  - { platform: homeassistant, id: gs5_vpd, entity_id: "${gs_5_vpd}" }
  - { platform: homeassistant, id: gs5_temp, entity_id: "${gs_5_temp}" }
  - { platform: homeassistant, id: gs5_hum, entity_id: "${gs_5_hum}" }
  - { platform: homeassistant, id: gs5_vpd_tgt_min, entity_id: "${gs_5_metrics}", attribute: vpd_target_min }
  - { platform: homeassistant, id: gs5_vpd_tgt_max, entity_id: "${gs_5_metrics}", attribute: vpd_target_max }
  - { platform: homeassistant, id: gs5_vpd_dng_min, entity_id: "${gs_5_metrics}", attribute: vpd_danger_min }
  - { platform: homeassistant, id: gs5_vpd_dng_max, entity_id: "${gs_5_metrics}", attribute: vpd_danger_max }
  - { platform: homeassistant, id: gs5_exhaust, entity_id: "${gs_5_exhaust}", attribute: percentage }
  - { platform: homeassistant, id: gs5_circ, entity_id: "${gs_5_circ}", attribute: percentage }

  # Space 6: Cure
  - { platform: homeassistant, id: gs6_vpd, entity_id: "${gs_6_vpd}" }
  - { platform: homeassistant, id: gs6_temp, entity_id: "${gs_6_temp}" }
  - { platform: homeassistant, id: gs6_hum, entity_id: "${gs_6_hum}" }
  - { platform: homeassistant, id: gs6_vpd_tgt_min, entity_id: "${gs_6_metrics}", attribute: vpd_target_min }
  - { platform: homeassistant, id: gs6_vpd_tgt_max, entity_id: "${gs_6_metrics}", attribute: vpd_target_max }
  - { platform: homeassistant, id: gs6_vpd_dng_min, entity_id: "${gs_6_metrics}", attribute: vpd_danger_min }
  - { platform: homeassistant, id: gs6_vpd_dng_max, entity_id: "${gs_6_metrics}", attribute: vpd_danger_max }
