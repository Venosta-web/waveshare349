substitutions:
  device_name: "waveshare-sim"
  friendly_name: "Waveshare 3.49 SDL Simulator"

  # ══════════════════════════════════════════════════════════════════════════
  # GROWSPACE CONFIGURATION (Direct HA Entities + Metrics Bridge Templates)
  # See ha_metrics_bridge.yaml and docs/adr/0001-hybrid-ha-metrics-bridge.md
  # ══════════════════════════════════════════════════════════════════════════
  gs_count: "7"

  # Space 0: 4x4
  gs_0_name: "4x4"
  gs_0_metrics: "sensor.4x4_metrics_bridge"
  gs_0_vpd: "sensor.4x4_calculated_vpd"
  gs_0_temp: "sensor.4x4_temperature"
  gs_0_hum: "sensor.4x4_humidity"
  gs_0_exhaust: "fan.4x4_exhaust"
  gs_0_circ: "fan.4x4_circulation"
  gs_0_humid: "humidifier.4x4_humidifier"

  # Space 1: SOG 2x5
  gs_1_name: "SOG 2x5"
  gs_1_metrics: "sensor.sog_2x5_metrics_bridge"
  gs_1_vpd: "sensor.4x4_vpd"
  gs_1_temp: "sensor.4x4_temperature"
  gs_1_hum: "sensor.4x4_humidity"
  gs_1_exhaust: "fan.sog_2x5_exhaust"
  gs_1_circ: "fan.sog_under_canopy"
  gs_1_humid: "humidifier.sog_2x5_humidifier"

  # Space 2: Nursery Dome
  gs_2_name: "Nursery Dome"
  gs_2_metrics: "sensor.nursery_dome_metrics_bridge"
  gs_2_vpd: "sensor.nursery_dome_calculated_vpd"
  gs_2_temp: "sensor.nursery_dome_temperature"
  gs_2_hum: "sensor.nursery_dome_humidity"
  gs_2_exhaust: "fan.nursery_dome_exhaust"
  gs_2_circ: "fan.nursery_dome_circulation"
  gs_2_humid: "humidifier.nursery_dome_humidifier"

  # Space 3: Clone
  gs_3_name: "Clone"
  gs_3_metrics: "sensor.clone_metrics_bridge"
  gs_3_vpd: "sensor.clone_calculated_vpd"
  gs_3_temp: "sensor.clone_temperature"
  gs_3_hum: "sensor.clone_humidity"
  gs_3_exhaust: "fan.clone_exhaust"
  gs_3_circ: "fan.clone_circulation"
  gs_3_humid: "humidifier.clone_humidifier"

  # Space 4: Mother
  gs_4_name: "Mother"
  gs_4_metrics: "sensor.mother_metrics_bridge"
  gs_4_vpd: "sensor.mother_calculated_vpd"
  gs_4_temp: "sensor.mother_temperature"
  gs_4_hum: "sensor.mother_humidity"
  gs_4_exhaust: "fan.mother_exhaust"
  gs_4_circ: "fan.mother_circulation"
  gs_4_humid: "humidifier.mother_humidifier"

  # Space 5: Dry
  gs_5_name: "Dry"
  gs_5_metrics: "sensor.dry_metrics_bridge"
  gs_5_vpd: "sensor.dry_calculated_vpd"
  gs_5_temp: "sensor.dry_temperature"
  gs_5_hum: "sensor.dry_humidity"
  gs_5_exhaust: "fan.dry_exhaust"
  gs_5_circ: "fan.dry_circulation"
  gs_5_humid: "humidifier.dry_humidifier"

  # Space 6: Cure
  gs_6_name: "Cure"
  gs_6_metrics: "sensor.cure_metrics_bridge"
  gs_6_vpd: "sensor.cure_calculated_vpd"
  gs_6_temp: "sensor.cure_temperature"
  gs_6_hum: "sensor.cure_humidity"
  gs_6_exhaust: "fan.cure_exhaust"
  gs_6_circ: "fan.cure_circulation"
  gs_6_humid: "humidifier.cure_humidifier"

  # Timing (seconds)
  cycle_interval: "15"
  pause_timeout: "25"

  # Claude Code card: "stage" (mascot-forward) or "terminal" (CLI status line)
  claude_variant: "terminal"
  # Seconds the bridge waits for a tap (CLAUDE_HA_DECISION_TIMEOUT)
  claude_decision_timeout: "110"

  # Codex card: "stage" (mascot-forward) or "terminal" (CLI status line)
  codex_variant: "terminal"
  codex_decision_timeout: "110"

  # Music Assistant card: "deck" (vinyl turntable) or "studio" (EQ + meter console)
  # Uses ha_music_bridge.yaml to auto-detect the active player & remember the last one used
  music_variant: "studio"
  music_player_entity: "sensor.music_assistant_bridge"

  # VPD gauge scale
  vpd_gauge_min: "0.4"
  vpd_gauge_max: "1.8"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

packages:
  core_ui: !include packages/waveshare_349/core_ui.yaml
  mod_grow: !include packages/waveshare_349/mod_grow.yaml
  mod_music: !include packages/waveshare_349/mod_music.yaml
  mod_claude: !include packages/waveshare_349/mod_claude.yaml
  mod_codex: !include packages/waveshare_349/mod_codex.yaml

host:

logger:
  level: INFO

# Native API server listens on TCP 6053 on your PC's LAN/WSL IP
api:
  port: 6053

# ============================================================================
# SDL2 DISPLAY & MOUSE TOUCHSCREEN EMULATOR (640 x 172)
# ============================================================================
display:
  - platform: sdl
    id: my_display
    dimensions:
      width: 640
      height: 172
    snapshot_key: SDLK_F12 # Press F12 in window to save a PNG screenshot
    update_interval: never
    window_options:
      always_on_top: true
      resizable: false

touchscreen:
  - platform: sdl
    id: my_touchscreen
    display: my_display
