substitutions:
  device_name: "waveshare-349-voice"
  friendly_name: "Waveshare 3.49 Voice Satellite"

  # Wi-Fi credentials (override with secrets or local substitutions)
  wifi_ssid: "YOUR_WIFI_SSID"
  wifi_password: "YOUR_WIFI_PASSWORD"

  # ══════════════════════════════════════════════════════════════════════════
  # GROWSPACE CONFIGURATION (Direct HA Entities + Metrics Bridge Templates)
  # See ha_metrics_bridge.yaml and docs/adr/0001-hybrid-ha-metrics-bridge.md
  # ══════════════════════════════════════════════════════════════════════════
  gs_count: "7"

  # Space 0: 4x4
  gs_0_name: "4x4"
  gs_0_metrics: "sensor.4x4_metrics_bridge"
  gs_0_vpd: "sensor.4x4_calculated_vpd"
  gs_0_temp: "sensor.4x4_temperature"
  gs_0_hum: "sensor.4x4_humidity"
  gs_0_exhaust: "fan.4x4_exhaust"
  gs_0_circ: "fan.4x4_circulation"
  gs_0_humid: "humidifier.4x4_humidifier"

  # Space 1: SOG 2x5
  gs_1_name: "SOG 2x5"
  gs_1_metrics: "sensor.sog_2x5_metrics_bridge"
  gs_1_vpd: "sensor.4x4_vpd"
  gs_1_temp: "sensor.4x4_temperature"
  gs_1_hum: "sensor.4x4_humidity"
  gs_1_exhaust: "fan.sog_2x5_exhaust"
  gs_1_circ: "fan.sog_under_canopy"
  gs_1_humid: "humidifier.sog_2x5_humidifier"

  # Space 2: Nursery Dome
  gs_2_name: "Nursery Dome"
  gs_2_metrics: "sensor.nursery_dome_metrics_bridge"
  gs_2_vpd: "sensor.nursery_dome_calculated_vpd"
  gs_2_temp: "sensor.nursery_dome_temperature"
  gs_2_hum: "sensor.nursery_dome_humidity"
  gs_2_exhaust: "fan.nursery_dome_exhaust"
  gs_2_circ: "fan.nursery_dome_circulation"
  gs_2_humid: "humidifier.nursery_dome_humidifier"

  # Space 3: Clone
  gs_3_name: "Clone"
  gs_3_metrics: "sensor.clone_metrics_bridge"
  gs_3_vpd: "sensor.clone_calculated_vpd"
  gs_3_temp: "sensor.clone_temperature"
  gs_3_hum: "sensor.clone_humidity"
  gs_3_exhaust: "fan.clone_exhaust"
  gs_3_circ: "fan.clone_circulation"
  gs_3_humid: "humidifier.clone_humidifier"

  # Space 4: Mother
  gs_4_name: "Mother"
  gs_4_metrics: "sensor.mother_metrics_bridge"
  gs_4_vpd: "sensor.mother_calculated_vpd"
  gs_4_temp: "sensor.mother_temperature"
  gs_4_hum: "sensor.mother_humidity"
  gs_4_exhaust: "fan.mother_exhaust"
  gs_4_circ: "fan.mother_circulation"
  gs_4_humid: "humidifier.mother_humidifier"

  # Space 5: Dry
  gs_5_name: "Dry"
  gs_5_metrics: "sensor.dry_metrics_bridge"
  gs_5_vpd: "sensor.dry_calculated_vpd"
  gs_5_temp: "sensor.dry_temperature"
  gs_5_hum: "sensor.dry_humidity"
  gs_5_exhaust: "fan.dry_exhaust"
  gs_5_circ: "fan.dry_circulation"
  gs_5_humid: "humidifier.dry_humidifier"

  # Space 6: Cure
  gs_6_name: "Cure"
  gs_6_metrics: "sensor.cure_metrics_bridge"
  gs_6_vpd: "sensor.cure_calculated_vpd"
  gs_6_temp: "sensor.cure_temperature"
  gs_6_hum: "sensor.cure_humidity"
  gs_6_exhaust: "fan.cure_exhaust"
  gs_6_circ: "fan.cure_circulation"
  gs_6_humid: "humidifier.cure_humidifier"

  # Music Assistant card: "deck" (vinyl turntable) or "studio" (EQ + meter console)
  # Uses ha_music_bridge.yaml to auto-detect the active player & remember the last one used
  music_variant: "studio"
  music_player_entity: "sensor.music_assistant_bridge"

  # Timing (seconds)
  cycle_interval: "15"
  pause_timeout: "25"
  idle_timeout: "300"

  # Idle / Lock Clock Screen
  idle_variant: "aurora"
  # Waveshare 3.49 battery voltage divider ratio on GPIO4 (typically 3.0 or 2.0)
  battery_divider: "3.0"

  # Claude Code card: "stage" (mascot-forward) or "terminal" (CLI status line)
  claude_variant: "stage"
  claude_decision_timeout: "110"

  # Codex card: "stage" (mascot-forward) or "terminal" (CLI status line)
  codex_variant: "stage"
  codex_decision_timeout: "110"

  # VPD gauge scale
  vpd_gauge_min: "0.4"
  vpd_gauge_max: "1.8"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2025.11.0
  includes:
    - claude/clawd.h
    - codex/codex_pet.h
  on_boot:
    priority: -100
    then:
      - delay: 3s
      - script.execute: update_grow_ui
      - script.execute: update_music_ui

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

packages:
  ui: !include packages/display_ui.yaml
  idle_common: !include idle/common.yaml
  idle: !include idle/${idle_variant}.yaml
  claude: !include claude/${claude_variant}.yaml
  codex: !include codex/${codex_variant}.yaml
  music_common: !include music/common.yaml
  music: !include music/${music_variant}.yaml

logger:
  level: INFO

api:
  on_client_connected:
    - delay: 1s
    - script.execute: update_grow_ui
    - script.execute: update_music_ui

ota:
  - platform: esphome

wifi:
  ssid: "${wifi_ssid}"
  password: "${wifi_password}"
  ap:
    ssid: "${device_name}-fallback"
  on_connect:
    - lambda: "id(idle_wifi_connected) = true;"
    - if:
        condition:
          lambda: "return id(screen_locked);"
        then:
          - script.execute: update_idle_ui
  on_disconnect:
    - lambda: "id(idle_wifi_connected) = false;"
    - if:
        condition:
          lambda: "return id(screen_locked);"
        then:
          - script.execute: update_idle_ui

# ============================================================================
# BATTERY & WI-FI TELEMETRY SENSORS (For Idle Clock & Home Assistant)
# ============================================================================
sensor:
  - platform: adc
    pin: GPIO4
    id: battery_voltage
    name: "Battery Voltage"
    attenuation: 12db
    update_interval: 30s
    filters:
      - multiply: ${battery_divider}
    on_value:
      - lambda: |-
          float pct = ((x - 3.20f) / (4.20f - 3.20f)) * 100.0f;
          if (pct < 0.0f) pct = 0.0f;
          if (pct > 100.0f) pct = 100.0f;
          id(idle_battery_pct) = (int)roundf(pct);
      - if:
          condition:
            lambda: "return id(screen_locked);"
          then:
            - script.execute: update_idle_ui

  - platform: wifi_signal
    id: wifi_rssi_sensor
    name: "WiFi Signal"
    update_interval: 15s
    on_value:
      - lambda: |-
          id(idle_wifi_rssi) = (int)roundf(x);
          id(idle_wifi_connected) = true;
      - if:
          condition:
            lambda: "return id(screen_locked);"
          then:
            - script.execute: update_idle_ui

text_sensor:
  - platform: wifi_info
    ssid:
      id: wifi_ssid_sensor
      name: "WiFi SSID"
      on_value:
        - lambda: "id(idle_wifi_ssid) = x;"
        - if:
            condition:
              lambda: "return id(screen_locked);"
            then:
              - script.execute: update_idle_ui

captive_portal:

# ============================================================================
# 1. DISPLAY & TOUCH (Waveshare ESP32-S3-Touch-LCD-3.49, 172x640 rotated)
# ============================================================================
spi:
  - id: display_qspi
    type: quad
    clk_pin: GPIO10
    data_pins:
      - GPIO11
      - GPIO12
      - GPIO13
      - GPIO14

i2c:
  - id: touch_i2c
    sda: GPIO17
    scl: GPIO18
    scan: true
  - id: sys_i2c
    sda: GPIO47
    scl: GPIO48
    scan: true

display:
  - platform: mipi_spi
    id: my_display
    model: WAVESHARE-ESP32-S3-TOUCH-LCD-3.49
    spi_id: display_qspi
    cs_pin: GPIO9
    reset_pin: GPIO21
    update_interval: never

lvgl:
  rotation: 90

touchscreen:
  - platform: axs15231
    id: my_touchscreen
    i2c_id: touch_i2c
    display: my_display

# ============================================================================
# 2. AUDIO CODEC (ES8311 + I2S Mic & Speaker)
# ============================================================================
i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO46
    i2s_bclk_pin: GPIO15
    i2s_mclk_pin: GPIO7

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: sys_i2c
    bits_per_sample: 16bit
    sample_rate: 16000

microphone:
  - platform: i2s_audio
    id: mic_i2s
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO45
    adc_type: external
    bits_per_sample: 16bit
    pdm: false

speaker:
  - platform: i2s_audio
    id: spk_i2s
    i2s_audio_id: i2s_audio_bus
    dac_type: external
    i2s_dout_pin: GPIO6
    audio_dac: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 16000

# ============================================================================
# 3. WAKE WORD & VOICE ASSISTANT SATELLITE
# ============================================================================
micro_wake_word:
  id: mww
  microphone: mic_i2s
  models:
    - model: okay_nabu
  on_wake_word_detected:
    - if:
        condition:
          lambda: "return !id(voice_muted);"
        then:
          - script.execute: unlock_idle_screen
          - voice_assistant.start:

voice_assistant:
  id: va
  microphone: mic_i2s
  speaker: spk_i2s
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - script.execute: unlock_idle_screen
    - lvgl.widget.update:
        id: nav_mic_icon
        text_color: 0x58A6FF
    - script.execute:
        id: set_voice_overlay
        visible: true
        status_text: "Listening..."
        accent_hex: 0x58A6FF
  on_stt_vad_end:
    - script.execute: unlock_idle_screen
    - lvgl.widget.update:
        id: nav_mic_icon
        text_color: 0xFFC107
    - script.execute:
        id: set_voice_overlay
        visible: true
        status_text: "Thinking..."
        accent_hex: 0xFFC107
  on_tts_start:
    - script.execute: unlock_idle_screen
    - lvgl.widget.update:
        id: nav_mic_icon
        text_color: 0x1DB954
    - script.execute:
        id: set_voice_overlay
        visible: true
        status_text: !lambda "return x;"
        accent_hex: 0x1DB954
  on_end:
    - delay: 2s
    - lvgl.widget.update:
        id: nav_mic_icon
        text_color: !lambda "return id(voice_muted) ? lv_color_hex(0xFF5252) : lv_color_hex(0x8B949E);"
    - script.execute:
        id: set_voice_overlay
        visible: false
        status_text: ""
        accent_hex: 0x58A6FF
  on_error:
    - script.execute: unlock_idle_screen
    - script.execute:
        id: set_voice_overlay
        visible: true
        status_text: !lambda "return message;"
        accent_hex: 0xFF5252
    - delay: 3s
    - lvgl.widget.update:
        id: nav_mic_icon
        text_color: !lambda "return id(voice_muted) ? lv_color_hex(0xFF5252) : lv_color_hex(0x8B949E);"
    - script.execute:
        id: set_voice_overlay
        visible: false
        status_text: ""
        accent_hex: 0x58A6FF

switch:
  - platform: template
    id: mic_mute_switch
    name: "Mute Microphone"
    icon: "mdi:microphone-off"
    optimistic: true
    turn_on_action:
      - lambda: "id(voice_muted) = true;"
      - micro_wake_word.stop:
      - lvgl.label.update:
          id: nav_mic_icon
          text: "\U000F036D"
          text_color: 0xFF5252
    turn_off_action:
      - lambda: "id(voice_muted) = false;"
      - micro_wake_word.start:
      - lvgl.label.update:
          id: nav_mic_icon
          text: "\U000F036C"
          text_color: 0x8B949E

script:
  - id: !extend on_voice_ptt
    then:
      - script.execute: unlock_idle_screen
      - if:
          condition:
            lambda: "return id(va).is_running();"
          then:
            - voice_assistant.stop:
          else:
            - if:
                condition:
                  lambda: "return !id(voice_muted);"
                then:
                  - voice_assistant.start:
